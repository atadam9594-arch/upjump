<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2353f5d0'/%3E%3Cstop offset='1' stop-color='%23ffd166'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%2307121f'/%3E%3Ccircle cx='32' cy='31' r='16' fill='url(%23g)'/%3E%3Crect x='23' y='24' width='18' height='9' rx='4.5' fill='%2307121f'/%3E%3Ccircle cx='28' cy='28.5' r='2' fill='%23eff8ff'/%3E%3Ccircle cx='36' cy='28.5' r='2' fill='%23eff8ff'/%3E%3Crect x='18' y='50' width='28' height='6' rx='3' fill='%2353f5d0'/%3E%3C/svg%3E">
<title>UpJump — Brego Games Originals</title>
<style>
  :root {
    --bg: #06101c;
    --surface: rgba(7, 18, 32, 0.72);
    --surface-strong: rgba(7, 17, 30, 0.90);
    --line: rgba(255, 255, 255, 0.11);
    --line-strong: rgba(255, 255, 255, 0.20);
    --ink: #f2f9ff;
    --muted: #98b4ca;
    --teal: #53f5d0;
    --sky: #7cc7ff;
    --coral: #ff8a65;
    --gold: #ffd166;
    --font-ui: 'Avenir Next', 'Segoe UI', 'Trebuchet MS', system-ui, -apple-system, sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    background: #030812;
    color: var(--ink);
    font-family: var(--font-ui);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse 58% 46% at 16% 18%, rgba(83, 245, 208, 0.13), transparent 64%),
      radial-gradient(ellipse 50% 42% at 86% 20%, rgba(255, 138, 101, 0.11), transparent 64%),
      radial-gradient(ellipse 75% 54% at 50% 100%, rgba(16, 46, 78, 0.60), transparent 72%),
      linear-gradient(180deg, #02060f 0%, #071323 50%, #040b16 100%);
  }

  #gameWrapper {
    flex-shrink:0;
    position: relative;
    width: 400px;
    height: 640px;
    overflow: hidden;
    border-radius: 26px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow:
      0 34px 100px rgba(0, 0, 0, 0.62),
      0 0 0 1px rgba(83, 245, 208, 0.08),
      inset 0 1px 0 rgba(255, 255, 255, 0.10);
    background: var(--bg);
    contain: layout paint;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: var(--bg);
    touch-action: none;
  }

  [hidden] {
    display: none !important;
  }

  /* HUD Layer */
  #hud, #overlay {
    position: absolute;
    inset: 0;
  }

  #hud {
    z-index: 10;
    pointer-events: none;
  }

  .hud-top {
    position: absolute;
    top: max(12px, env(safe-area-inset-top));
    left: 12px;
    right: 12px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }

  .score-block {
    background: linear-gradient(180deg, rgba(11, 27, 46, 0.80) 0%, rgba(6, 16, 29, 0.72) 100%);
    border: 1px solid var(--line);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 14px;
    padding: 8px 13px 9px;
    min-width: 132px;
  }

  .score-main {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  #scoreDisplay {
    font-size: 27px;
    line-height: 1;
    font-weight: 800;
    letter-spacing: -0.025em;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    text-shadow: 0 2px 10px rgba(83, 245, 208, 0.18);
  }

  #comboDisplay {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    transition: transform 0.14s cubic-bezier(0.16, 1, 0.3, 1), color 0.14s ease;
  }

  #comboDisplay.hot {
    color: var(--gold);
    transform: scale(1.14);
    text-shadow: 0 0 12px rgba(255, 209, 102, 0.45);
  }

  .score-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .score-meta strong {
    color: #d9eefc;
    font-weight: 700;
  }

  .hud-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    pointer-events: auto;
  }

  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(13, 30, 50, 0.82) 0%, rgba(7, 18, 32, 0.76) 100%);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.26), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.12s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.14s ease, border-color 0.14s ease;
    touch-action: manipulation;
  }

  .icon-btn svg {
    width: 18px;
    height: 18px;
    display: block;
    pointer-events: none;
  }

  .icon-btn:hover {
    background: rgba(20, 44, 70, 0.92);
    border-color: var(--line-strong);
  }

  .icon-btn:active {
    transform: scale(0.92);
  }

  .icon-btn:focus-visible,
  #novaBtn:focus-visible,
  #playBtn:focus-visible,
  #overlayRestartBtn:focus-visible,
  #overlayMenuBtn:focus-visible,
  #mobileMoveControls button:focus-visible,
  .lang-btn:focus-visible {
    outline: 2.5px solid var(--gold);
    outline-offset: 2px;
  }

  /* Slim Energy Bar */
  #energyPanel {
    position: absolute;
    left: 12px;
    right: 12px;
    top: calc(max(12px, env(safe-area-inset-top)) + 66px);
    background: linear-gradient(180deg, rgba(10, 24, 42, 0.76) 0%, rgba(6, 15, 27, 0.68) 100%);
    border: 1px solid var(--line);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 12px;
    padding: 6px 11px 8px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  #energyPanel.ready {
    border-color: rgba(255, 209, 102, 0.72);
    box-shadow: 0 0 24px rgba(255, 209, 102, 0.28), inset 0 1px 0 rgba(255, 240, 190, 0.22);
  }

  .energy-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 5px;
    font-variant-numeric: tabular-nums;
  }

  #energyPanel.ready .energy-row {
    color: var(--gold);
  }

  .track {
    position: relative;
    width: 100%;
    height: 8px;
    border-radius: 6px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.09);
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.45);
  }

  #energyFill {
    width: 0%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #32dfb9 0%, #86ffd8 58%, var(--gold) 100%);
    box-shadow: 0 0 14px rgba(83, 245, 208, 0.45);
    transition: width 0.1s linear;
  }

  #energyPanel.ready #energyFill {
    background: linear-gradient(90deg, #ffe99c 0%, var(--gold) 52%, #ff9364 100%);
    box-shadow: 0 0 16px rgba(255, 209, 102, 0.65);
  }

  /* Dynamic Event Banner */
  #banner {
    position: absolute;
    left: 50%;
    top: calc(max(12px, env(safe-area-inset-top)) + 116px);
    transform: translate(-50%, -6px) scale(0.95);
    padding: 6px 15px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: #05131f;
    background: linear-gradient(135deg, #62ffe0 0%, #fff0a8 52%, var(--gold) 100%);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.38), 0 0 20px rgba(83, 245, 208, 0.25);
    opacity: 0;
    white-space: nowrap;
    transition: opacity 0.16s ease, transform 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  }

  #banner.show {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }

  /* Subtle Bottom Mission Strip */
  #missionWrap {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: max(10px, env(safe-area-inset-bottom));
    background: rgba(6, 16, 28, 0.66);
    border: 1px solid rgba(255, 255, 255, 0.09);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 10px;
    padding: 6px 11px 7px;
  }

  #missionPill {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: #d9f0ff;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
  }

  .mission-track {
    margin-top: 5px;
    width: 100%;
    height: 3px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.09);
    overflow: hidden;
  }

  #missionBar {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, var(--teal), var(--gold));
    transition: width 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* Mobile & Touch Controls */
  #novaBtn {
    display: none;
    position: absolute;
    right: 14px;
    bottom: calc(max(10px, env(safe-area-inset-bottom)) + 52px);
    z-index: 12;
    min-width: 102px;
    height: 58px;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0 14px;
    border-radius: 16px;
    border: 1.5px solid rgba(255, 236, 176, 0.9);
    color: #061816;
    background: linear-gradient(135deg, #5efbe0 0%, #fff0a8 52%, var(--gold) 100%);
    font: 900 14px var(--font-ui);
    letter-spacing: 0.05em;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.44), 0 0 22px rgba(255, 209, 102, 0.32);
    touch-action: manipulation;
    cursor: pointer;
    pointer-events: auto;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    transition: transform 0.12s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.16s ease;
  }

  #novaBtn svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  #novaBtn:active:not(:disabled) {
    transform: scale(0.94);
  }

  #novaBtn:disabled {
    opacity: 0.56;
    border-color: rgba(124, 199, 255, 0.26);
    background: rgba(14, 33, 50, 0.84);
    color: #b7d2e2;
    box-shadow: none;
    cursor: default;
  }

  #mobileMoveControls {
    position: absolute;
    left: 14px;
    bottom: calc(max(10px, env(safe-area-inset-bottom)) + 52px);
    z-index: 12;
    gap: 10px;
    display: none;
    pointer-events: auto;
  }

  #mobileMoveControls button {
    width: 60px;
    height: 58px;
    border: 1.5px solid rgba(83, 245, 208, 0.44);
    border-radius: 16px;
    color: #ecffff;
    background: linear-gradient(180deg, rgba(14, 38, 56, 0.82) 0%, rgba(8, 23, 37, 0.82) 100%);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    touch-action: none;
    transition: transform 0.08s ease, background-color 0.1s ease, border-color 0.1s ease;
  }

  #mobileMoveControls button svg {
    width: 24px;
    height: 24px;
    pointer-events: none;
  }

  #mobileMoveControls button:active,
  #mobileMoveControls button.pressed {
    background: rgba(34, 108, 114, 0.94);
    border-color: var(--teal);
    transform: scale(0.94);
  }

  @media (pointer: coarse), (max-width: 540px) {
    #novaBtn:not([hidden]) {
      display: flex;
    }
    #mobileMoveControls:not([hidden]) {
      display: flex;
    }
    .icon-btn {
      width: 44px;
      height: 44px;
    }
  }

  @media (pointer: fine) and (min-width: 541px) {
    #novaBtn:not([hidden]):not(:disabled) {
      display: flex;
      height: 46px;
      min-width: 116px;
      bottom: 54px;
    }
  }

  /* Overlay Layer */
  #overlay {
    z-index: 20;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: radial-gradient(circle at 50% 42%, rgba(8, 22, 38, 0.45), rgba(3, 8, 17, 0.72));
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
  }

  .overlay-card {
    position: relative;
    width: min(100%, 334px);
    border-radius: 22px;
    padding: 18px 20px 20px;
    text-align: center;
    background: linear-gradient(180deg, rgba(11, 25, 43, 0.92) 0%, rgba(6, 15, 28, 0.94) 100%);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow:
      0 26px 70px rgba(0, 0, 0, 0.56),
      inset 0 1px 0 rgba(255, 255, 255, 0.14);
  }

  .overlay-card::before {
    content: '';
    position: absolute;
    top: -1px;
    left: 24px;
    right: 24px;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(83, 245, 208, 0.85), rgba(255, 209, 102, 0.85), transparent);
    pointer-events: none;
  }

  .overlay-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .brand-kicker {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--teal);
    text-align: left;
  }

  .lang-switch {
    display: inline-flex;
    padding: 2px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.10);
    gap: 2px;
  }

  .lang-btn {
    border: 0;
    background: transparent;
    color: var(--muted);
    font: 700 11px var(--font-ui);
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.14s ease, color 0.14s ease;
    white-space: nowrap;
  }

  .lang-btn.active {
    background: rgba(83, 245, 208, 0.22);
    color: var(--ink);
  }

  .logo-wrap {
    margin: 2px auto 10px;
    display: flex;
    justify-content: center;
  }

  .logo-svg {
    width: 236px;
    height: 54px;
    display: block;
    filter: drop-shadow(0 6px 18px rgba(83, 245, 208, 0.22));
  }

  #overlayTitle {
    font-size: 30px;
    line-height: 1.08;
    font-weight: 900;
    letter-spacing: 0.03em;
    margin-bottom: 8px;
    color: var(--ink);
    text-wrap: balance;
  }

  #overlayTitle.sr-brand {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  #newBestBanner {
    margin: 0 auto 10px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.1em;
    color: var(--gold);
    text-shadow: 0 0 14px rgba(255, 209, 102, 0.45);
  }

  #overlayLead {
    color: #cadff0;
    font-size: 13.5px;
    line-height: 1.5;
    margin-bottom: 16px;
  }

  /* Clean hairline-divided stats row */
  #overlayStats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 12px 0;
    margin-bottom: 16px;
  }

  .stat-cell {
    padding: 0 6px;
  }

  .stat-cell + .stat-cell {
    border-left: 1px solid var(--line);
  }

  .stat-cell strong {
    display: block;
    font-size: 19px;
    line-height: 1.1;
    font-weight: 800;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    margin-bottom: 4px;
  }

  .stat-cell span {
    display: block;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  /* Visual Guide on Menu */
  #menuGuide {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 16px;
    text-align: center;
  }

  .guide-item {
    font-size: 11px;
    line-height: 1.35;
    color: #c8def0;
  }

  .guide-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    margin: 0 auto 5px;
  }

  #playBtn {
    width: 100%;
    border: 0;
    border-radius: 14px;
    padding: 14px 18px;
    cursor: pointer;
    color: #05131f;
    font: 900 17px var(--font-ui);
    letter-spacing: 0.08em;
    background: linear-gradient(135deg, #5afbe0 0%, #b5ffe4 46%, var(--gold) 100%);
    box-shadow: 0 12px 30px rgba(83, 245, 208, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.55);
    transition: transform 0.14s cubic-bezier(0.16, 1, 0.3, 1), filter 0.14s ease;
    white-space: nowrap;
  }

  #playBtn:hover {
    filter: brightness(1.07);
  }

  #playBtn:active {
    transform: scale(0.97);
  }

  .secondary-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .secondary-btn {
    flex: 1;
    padding: 11px 12px;
    border-radius: 12px;
    border: 1px solid var(--line-strong);
    background: rgba(20, 44, 68, 0.76);
    color: #e6f6ff;
    font: 700 13px var(--font-ui);
    cursor: pointer;
    white-space: nowrap;
    transition: background-color 0.14s ease, transform 0.12s ease;
  }

  .secondary-btn:hover {
    background: rgba(30, 62, 92, 0.90);
  }

  .secondary-btn:active {
    transform: scale(0.97);
  }

  .controls {
    margin-top: 14px;
    font-size: 11.5px;
    line-height: 1.55;
    color: var(--muted);
  }

  @media (max-width: 540px) {
    #gameWrapper {
      border-radius: 0;
      border: 0;
      box-shadow: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
    }
  }
#ascensionRail,#flightRail{display:none}
#suitBtn{width:100%;margin:0 0 10px;border:1px solid #487b83;background:#142b40;color:#eafaff;border-radius:12px;min-height:36px;font:700 12px var(--font-ui);cursor:pointer}
#suitBtn:focus-visible{outline:2px solid var(--gold)}
#routeProgress{height:3px;margin-top:5px;background:#294352;border-radius:3px;overflow:hidden}
#routeFill{height:100%;width:0;background:linear-gradient(90deg,#53f5d0,#ffd166)}
#routeLabel{color:#d8f3ff;font-size:10px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

function sprite(key,x,y,w,h){if(!artReady(key))return false;ctx.drawImage(ART[key],x,y,w,h);return true;}

const PENTATONIC = [330, 370, 415, 494, 554, 659, 740, 831, 988];

function audioActive() { return soundEnabled && !portalMuted; }

function unlockAudio() {
  if (!audioActive()) return;
  try {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;
    if (!audioContext) {
      audioContext = new Ctor();
      const len = Math.floor(audioContext.sampleRate * 0.2);
      noiseBuffer = audioContext.createBuffer(1, len, audioContext.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    }
    if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
  } catch {}
}

function suspendAudio() {
  try {
    if (audioContext && audioContext.state === 'running') audioContext.suspend().catch(() => {});
  } catch {}
}

function playTone(freq, duration = 0.09, shape = 'sine', volume = 0.024, endFreq = null, delay = 0) {
  if (!audioActive()) return;
  try {
    unlockAudio();
    if (!audioContext || audioContext.state === 'closed') return;
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    const t0 = audioContext.currentTime + delay;
    osc.type = shape;
    osc.frequency.setValueAtTime(freq, t0);
    if (endFreq != null) osc.frequency.exponentialRampToValueAtTime(Math.max(40, endFreq), t0 + duration);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.002, volume), t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
    osc.onended = () => { osc.disconnect(); gain.disconnect(); };
  } catch {}
}

function playNoise(duration = 0.09, volume = 0.024, filterFreq = 900) {
  if (!audioActive()) return;
  try {
    unlockAudio();
    if (!audioContext || !noiseBuffer || audioContext.state === 'closed') return;
    const src = audioContext.createBufferSource();
    src.buffer = noiseBuffer;
    const filter = audioContext.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = filterFreq;
    const gain = audioContext.createGain();
    const t0 = audioContext.currentTime;
    gain.gain.setValueAtTime(volume, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    src.connect(filter);
    filter.connect(gain);
    gain.connect(audioContext.destination);
    src.start(t0);
    src.stop(t0 + duration + 0.01);
    src.onended = () => { src.disconnect(); filter.disconnect(); gain.disconnect(); };
  } catch {}
}

// Drawing Geometry Helpers
function roundRect(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w, y + h - rr);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x, y + rr);
  ctx.quadraticCurveTo(x, y, x + rr, y);
  ctx.closePath();
}

function drawStar(x, y, outer, inner, rotOffset = 0) {
  let rot = Math.PI * 1.5 + rotOffset;
  const step = Math.PI / 5;
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const ox = x + Math.cos(rot) * outer;
    const oy = y + Math.sin(rot) * outer;
    if (i === 0) ctx.moveTo(ox, oy); else ctx.lineTo(ox, oy);
    rot += step;
    ctx.lineTo(x + Math.cos(rot) * inner, y + Math.sin(rot) * inner);
    rot += step;
  }
  ctx.closePath();
}

function drawSparkle(x, y, r) {
  ctx.beginPath();
  ctx.moveTo(x, y - r);
  ctx.quadraticCurveTo(x + r * 0.16, y - r * 0.16, x + r, y);
  ctx.quadraticCurveTo(x + r * 0.16, y + r * 0.16, x, y + r);
  ctx.quadraticCurveTo(x - r * 0.16, y + r * 0.16, x - r, y);
  ctx.quadraticCurveTo(x - r * 0.16, y - r * 0.16, x, y - r);
  ctx.closePath();
  ctx.fill();
}

function inter(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// Biome Interpolation
function getBiomeState(alt) {
  let idx = 0;
  for (let i = 0; i < BIOMES.length; i++) {
    if (alt >= BIOMES[i].alt) idx = i;
  }
  const curr = BIOMES[idx];
  const next = BIOMES[Math.min(idx + 1, BIOMES.length - 1)];
  const span = Math.max(1, next.alt - curr.alt);
  const f = idx === BIOMES.length - 1 ? 0 : clamp((alt - curr.alt) / span, 0, 1);
  return {
    idx,
    name: lang === 'tr' ? curr.nameTr : curr.nameEn,
    top: lerpColor(curr.top, next.top, f),
    mid: lerpColor(curr.mid, next.mid, f),
    bot: lerpColor(curr.bot, next.bot, f),
    glowA: lerpColor(curr.glowA, next.glowA, f),
    glowB: lerpColor(curr.glowB, next.glowB, f),
  };
}

function updateGame(g) {
  if (g.mode !== MODES.PLAY) return;
  g.frame++;
  if(g.boss){updateBoss(g);return;}

  if (g.hitStop > 0) {
    g.hitStop--;
    g.shake *= 0.86;
    return;
  }

  if (input.boost) {
    tryNova(g);
    input.boost = false;
  }

  const pl = g.player;
  const dir = moveIntent();
  if (dir !== 0) g.movedOnce = true;
  if (g.movedOnce && g.hintAlpha > 0) g.hintAlpha = Math.max(0, g.hintAlpha - 0.04);
  else if (g.frame > 180 && g.hintAlpha > 0) g.hintAlpha = Math.max(0, g.hintAlpha - 0.02);

  const targetVx = dir * 6.4;
  pl.vx = lerp(pl.vx, targetVx, dir === 0 ? 0.14 : 0.25);
  pl.x += pl.vx;
  if (dir) pl.face = dir;
  pl.tilt = lerp(pl.tilt, clamp(pl.vx * 0.04, -0.26, 0.26), 0.22);
  pl.antX = lerp(pl.antX, -pl.vx * 1.5, 0.16);

  if (pl.x + pl.w / 2 < 0) pl.x += W;
  if (pl.x + pl.w / 2 > W) pl.x -= W;

  if (pl.boost > 0) {
    pl.boost--;
    pl.shield = Math.max(pl.shield, pl.boost);
    pl.vy += 0.18;
    pl.vy = Math.min(pl.vy, -11);
    if (g.frame % 2 === 0) {
      g.particles.push({
        x: pl.x + pl.w / 2 + rand(-10, 10),
        y: pl.y + pl.h,
        vx: rand(-0.7, 0.7),
        vy: rand(2.6, 5.4),
        life: 17, max: 17,
        size: rand(2.6, 5.6),
        color: Math.random() > 0.35 ? '#ffd166' : '#ff8a65',
        shape: Math.random() > 0.5 ? 'spark' : 'dot',
        grav: 0.04,
      });
    }
  } else {
    pl.vy += 0.47;
  }

  // Afterimage ghosts during Nova Dash or high-velocity Spring Launch
  if ((pl.boost > 0 || pl.vy < -17.5) && g.frame % 3 === 0) {
    g.ghosts.push({
      x: pl.x + pl.w / 2,
      y: pl.y + pl.h / 2,
      tilt: pl.tilt,
      face: pl.face,
      squash: pl.squash,
      boost: pl.boost > 0,
      life: 12,
      max: 12,
    });
  }

  pl.y += pl.vy;
  pl.squash = lerp(pl.squash, 1, 0.2);
  if (pl.shield > 0) pl.shield--;
  pl.blink--;
  if (pl.blink < -7) pl.blink = Math.floor(rand(110, 230));

  updateScarf(pl, pl.x + pl.w / 2 - pl.face * 7, pl.y + 25);

  pl.trail.unshift({
    x: pl.x + pl.w / 2,
    y: pl.y + pl.h / 2,
    r: pl.boost > 0 ? 11 : 6.5,
    a: pl.boost > 0 ? 0.46 : 0.22,
  });
  if (pl.trail.length > 10) pl.trail.pop();
  pl.trail.forEach(tr => { tr.a *= 0.82; tr.r *= 0.96; });

  const targetCam = pl.y - H * 0.42;
  if (targetCam < g.camY) g.camY = lerp(g.camY, targetCam, 0.44);

  while (g.genY > g.camY - 140) {
    spawnLayer(g, g.genY);
    const difficultyGap=Math.min(35,g.dist/40);
    g.genY-=(g.course==='expedition'?72+rngFor(g)*18:rand(72,90))+difficultyGap;
  }

  // Update platforms
  g.platforms.forEach(p => {
    if (p.type === PT.M) {
      p.x += p.vx;
      if (p.x < 14) { p.x = 14; p.vx = Math.abs(p.vx); }
      if (p.x + p.w > W - 14) { p.x = W - 14 - p.w; p.vx = -Math.abs(p.vx); }
    }
    if (p.type === PT.P) {
      p.phase += 0.048;
      p.visible = 0.14 + ((Math.sin(p.phase) + 1) * 0.5) * 0.86;
      p.alpha = 0.18 + p.visible * 0.82;
    }
    if (p.broken) p.alpha = clamp(p.alpha - 0.08, 0, 1);
    if (p.recoil > 0) p.recoil = Math.max(0, p.recoil - 0.16);
    if (p.springAnim > 0) p.springAnim = Math.max(0, p.springAnim - 0.1);
  });

  // Collectibles & gentle magnetic pull
  const cx = pl.x + pl.w / 2, cy = pl.y + pl.h / 2;
  g.stars.forEach(s => {
    s.t += s.kind === 'orb' ? 0.08 : 0.11;
    if (!s.dead) {
      const dx = cx - s.x, dy = cy - s.y;
      const d2 = dx * dx + dy * dy;
      const pullR = (pl.boost>0 ? 108 : s.kind === 'orb' ? 66 : 52)+upgradeLevels.magnet*13;
      if (d2 < pullR * pullR && d2 > 4) {
        const pull = pl.boost > 0 ? 0.24 : 0.12;
        s.x += dx * pull;
        s.y += dy * pull;

    d.phase += 0.16;
    if (d.x < 16) { d.x = 16; d.vx = Math.abs(d.vx); }
    if (d.x + d.w > W - 16) { d.x = W - 16 - d.w; d.vx = -Math.abs(d.vx); }
  });

  g.particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.life--; });
  g.rings.forEach(r => { r.life--; r.r = lerp(r.r, r.maxR, 0.22); });
  g.debris.forEach(b => { b.x += b.vx; b.y += b.vy; b.vy += 0.28; b.rot += b.vrot; b.life--; });
  g.ghosts.forEach(gh => { gh.life--; });
  g.texts.forEach(tx => { tx.y -= 1.1; tx.life--; });

  if (g.dist > 450 && Math.random() < 0.011) {
    g.comets.push({ x: rand(50, W), y: rand(30, H * 0.46), vx: -rand(5.2, 8.8), vy: rand(2.5, 4.6), life: 28, max: 28 });
  }
  g.comets.forEach(c => { c.x += c.vx; c.y += c.vy; c.life--; });

  g.platforms = g.platforms.filter(p => !(p.broken && p.alpha <= 0) && p.y - g.camY < H + 120);
  g.stars = g.stars.filter(s => !s.dead && s.y - g.camY < H + 90);
  g.drones = g.drones.filter(d => !d.dead && d.y - g.camY < H + 120);
  g.particles = g.particles.filter(p => p.life > 0);
  g.rings = g.rings.filter(r => r.life > 0);
  g.debris = g.debris.filter(b => b.life > 0);
  g.ghosts = g.ghosts.filter(gh => gh.life > 0);
  g.texts = g.texts.filter(tx => tx.life > 0);
  g.comets = g.comets.filter(c => c.life > 0);

  // Platform bounce check
  if (pl.vy > 0) {
    const footY = pl.y + pl.h;
    const prevFootY = footY - pl.vy;
    for (const p of g.platforms) {
      if (!solid(p)) continue;
      const horizHit =
        (pl.x + pl.w - 4 > p.x && pl.x + 4 < p.x + p.w) ||
        (pl.x - W + pl.w - 4 > p.x && pl.x - W + 4 < p.x + p.w) ||
        (pl.x + W + pl.w - 4 > p.x && pl.x + W + 4 < p.x + p.w);
      if (horizHit && footY >= p.y && footY <= p.y + p.h + 14 && prevFootY <= p.y + p.h + 2) {
        pl.y = p.y - pl.h;
        pl.vy = -jumpPower(p.type);
        pl.squash = p.type === PT.S ? 0.6 : 0.72;
        p.recoil = 1;

        const fresh=!p.visited&&p.y<g.highestBounce-12;p.visited=true;if(fresh)g.highestBounce=p.y;
        const gap = g.frame - (g.lastBounce || -999);
        g.combo=fresh?(gap<86?Math.min(g.combo+1,9):1):0;
        g.maxCombo = Math.max(g.maxCombo, g.combo);
        g.lastBounce = g.frame;

        let energy=5;
        if(fresh&&Math.abs(pl.x+pl.w/2-(p.x+p.w/2))<p.w*.18){g.perfectLandings++;g.bonus+=12+g.combo*2;addText(g,p.x+p.w/2,p.y-18,lang==='tr'?'MÜKEMMEL':'PERFECT','#fff0a8',1);addRing(g,p.x+p.w/2,p.y,'#ffd166',35,2.5);}
        if (p.type === PT.S) {
          p.springAnim = 1;
          if(fresh){g.bonus+=14;missionHit(g,'spring');}
          energy=15;
          setBanner(g, t().bannerSpring);
          addShake(g, 4.5);
          sfx.spring();
          addRing(g, p.x + p.w / 2, p.y, '#ff8a65', 46, 3.2);
          addBurst(g, p.x + p.w / 2, p.y, '#ffd8c4', 12, 1.25);
        } else if (p.type === PT.C) {
          energy = 6;
          p.broken = true;
          sfx.crumble();
          // 4-piece rock shatter
          for (let k = 0; k < 4; k++) {
            const side = k < 2 ? -1 : 1;
            g.debris.push({
              x: p.x + p.w * (0.18 + k * 0.21),
              y: p.y + 7,
              w: p.w * 0.24,
              h: p.h * (k % 2 === 0 ? 0.9 : 0.7),
              vx: side * rand(0.9, 2.2),
              vy: rand(-1.8, -0.4),
              rot: rand(-0.2, 0.2),
              vrot: side * rand(0.06, 0.14),
              color: k % 2 === 0 ? STYLE.crumble.mid : STYLE.crumble.base,
              life: 38, max: 38,
            });
          }
          addBurst(g, p.x + p.w / 2, p.y + 6, '#fae0be', 10, 0.95, 'diamond');
        } else {
          if(p.type===PT.M){if(fresh)g.bonus+=8;energy=9;}
          else if(p.type===PT.P){if(fresh)g.bonus+=10;energy=11;}
          sfx.bounce(g.combo);
          addBurst(g, pl.x + pl.w / 2, p.y, STYLE[p.type].mid, 7, 0.9);
          addRing(g, pl.x + pl.w / 2, p.y + 2, STYLE[p.type].top, 26, 1.8);
        }

        if(fresh){if(p.risk){g.routeBonus++;g.bonus+=80;energy+=14;addText(g,p.x+p.w/2,p.y-22,lang==='tr'?'CESUR +80':'RISK +80','#ffd166',1.1);}addEnergy(g,energy);}
        break;
      }
    }
  }

  // Collectible pickups
  g.stars.forEach(s => {
    const reach = s.kind === 'orb' ? 30 : 25;
    if (!s.dead && Math.abs(cx - s.x) < reach && Math.abs(cy - s.y) < reach) {
      s.dead = true;g.starsCollected++;
      const bonus = (s.kind === 'orb' ? 75 : 25) + g.combo * 5;
      g.bonus += bonus;
      addEnergy(g, s.kind === 'orb' ? 44 : 18);
      if (s.kind === 'orb') sfx.orb(); else sfx.star(g.combo);
      const col = s.kind === 'orb' ? '#53f5d0' : '#ffd166';
      addBurst(g, s.x, s.y, col, s.kind === 'orb' ? 14 : 9, 1.15);
      addRing(g, s.x, s.y, col, s.kind === 'orb' ? 38 : 26, 2.4);
      addText(g, s.x, s.y - 12, `+${bonus}`, col, s.kind === 'orb' ? 1.18 : 1);
      if (s.kind === 'star') missionHit(g, 'collect');
    }
  });

  // Drone collision
  g.drones.forEach(d => {
    if (g.mode===MODES.PLAY&&!d.dead && inter(pl, d)) {
      if (pl.shield > 0 || pl.boost > 0 || (pl.vy>4 && pl.y+pl.h-pl.vy<=d.y+5)) {
        if(pl.boost===0&&pl.shield===0){pl.vy=-17;pl.shield=16;addEnergy(g,15);}
        d.dead = true;
        g.dronesSmashed += 1;
        const bonus = 140 + g.combo * 12;
        g.bonus += bonus;
        g.hitStop = 3;
        addShake(g, 9.5);
        sfx.smash();
        const dcx = d.x + d.w / 2, dcy = d.y + d.h / 2;
        // Drone armored shrapnel
        for (let k = 0; k < 5; k++) {
          g.debris.push({
            x: dcx, y: dcy, w: rand(7, 13), h: rand(5, 9),
            vx: rand(-3.6, 3.6), vy: rand(-4.2, -0.8),
            rot: rand(0, TAU), vrot: rand(-0.22, 0.22),
            color: k % 2 === 0 ? '#ff8a65' : '#31445c',
            life: 40, max: 40,
          });
        }
        addBurst(g, dcx, dcy, '#ffd166', 20, 1.5);
        addRing(g, dcx, dcy, '#ffd166', 54, 3.5);
        addText(g, dcx, d.y - 12, `+${bonus}`, '#ffd166', 1.28);
        setBanner(g, t().bannerSmash);
        missionHit(g, 'nova');
      } else {
        if(!rescueExpedition(g))triggerGameOver(g, 'drone');
      }
    }
  });

  if (g.frame - (g.lastBounce || -999) > 125) g.combo = 0;

  if (pl.y - g.camY > H + 84 && g.mode === MODES.PLAY) {
    if(!rescueExpedition(g))triggerGameOver(g, 'fall');
  }

  g.dist = Math.max(g.dist, Math.floor(-g.camY / 10));

  if(g.mode!==MODES.PLAY)return;
  const milestone=MILESTONES.filter(m=>g.dist>=m).pop()||0;
  if(milestone>g.lastMilestone){g.lastMilestone=milestone;g.bonus+=100;addEnergy(g,20);const unlocked=SUITS.find(v=>v.alt===milestone&&v.alt>g.startAlt);setBanner(g,unlocked?(lang==='tr'?'YENİ KIYAFET!':'SUIT UNLOCKED!'):milestone+'m · +100');addRing(g,pl.x+pl.w/2,pl.y+pl.h/2,'#ffd166',60,3);sfx.mission();}
  if(g.course==='expedition'){
    const cp=g.dist>=goalFor(g)*.73?Math.floor(goalFor(g)*.73):g.dist>=80?80:0;
    if(cp>g.checkpoint){g.checkpoint=cp;if(!g.rescued)setBanner(g,lang==='tr'?'KURTARMA AÇILDI':'RESCUE UNLOCKED');}
    if(g.dist>=goalFor(g)){if(bossRequired(g))beginBoss(g);else winExpedition(g);return;}
  }
  const bState = getBiomeState(g.dist);
  if (bState.idx > g.biomeIdx) {
    g.biomeIdx = bState.idx;
    if(!SUITS.some(v=>v.alt===milestone&&v.alt>g.startAlt))setBanner(g, `${bState.name} · ${g.dist}m`);
  }

  totalScore(g);
  if (g.bannerTimer > 0) g.bannerTimer--;
  g.shake *= 0.84;
  if (g.shake < 0.2) g.shake = 0;
  g.flash = Math.max(0, g.flash - 0.035);
}

// Sculpted Volumetric Cloud Helper
function drawCloud(x, y, scale, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  // Cool cloud underside shadow
  ctx.fillStyle = `rgba(110, 170, 215, ${alpha * 0.55})`;
  ctx.beginPath();
  ctx.ellipse(0, 6, 46, 12, 0, 0, TAU);
  ctx.fill();
  // Soft lit cloud puffs
  const cg = ctx.createLinearGradient(0, -18, 0, 10);
  cg.addColorStop(0, `rgba(225, 246, 255, ${alpha * 1.15})`);
  cg.addColorStop(1, `rgba(145, 205, 238, ${alpha * 0.35})`);
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.arc(-22, 0, 14, 0, TAU);
  ctx.arc(-4, -7, 20, 0, TAU);
  ctx.arc(17, -2, 15, 0, TAU);
  ctx.arc(31, 3, 10, 0, TAU);
  ctx.fill();
  ctx.restore();
}

    return;
  }

  dom.overlay.style.display = 'flex';
  if (dom.logoWrap) dom.logoWrap.hidden = !isMenu;
  if (dom.menuGuide) dom.menuGuide.hidden = !isMenu;
  dom.overlayTitle.classList.toggle('sr-brand', isMenu);
  if (dom.newBestBanner) {
    dom.newBestBanner.hidden = !(game.mode === MODES.OVER && game.beatBestInRun);
    dom.newBestBanner.textContent = s.newBest;
  }

  if (isMenu) {
    dom.overlayKicker.textContent = s.brand;
    dom.overlayTitle.textContent = 'UPJUMP';
    dom.overlayLead.textContent=lang==='tr'?'Gökyüzü adalarına sıçra. Kristalleri topla, tehlikeli rotaları keşfet.':'Leap between sky islands. Collect crystals and discover risky shortcuts.';
    dom.playBtn.textContent = s.play;
    dom.overlayStats.innerHTML = statsHtml([
      [bestScore, s.best],
      [`${bestAlt}m`, s.altitude],
      [totalRuns, lang === 'tr' ? 'Tur' : 'Runs'],
    ]);
  } else if (isPause) {
    dom.overlayKicker.textContent = s.pausedKicker;
    dom.overlayTitle.textContent = s.paused;
    dom.overlayLead.textContent = s.pausedLead;
    dom.playBtn.textContent = s.resume;
    dom.overlayStats.innerHTML = statsHtml([
      [game.score, s.score],
      [`${Math.round(game.energy)}%`, 'Nova'],
      [`x${game.combo}`, s.combo],
    ]);
  } else {
    dom.overlayKicker.textContent=game.won?(lang==='tr'?'GÖREV BAŞARILI':'MISSION COMPLETE'):game.endReason==='boss'?(lang==='tr'?'MUHAFIZ GALİP':'GUARDIAN WINS'):game.endReason==='drone'?s.overDrone:s.overFall;
    dom.overlayTitle.textContent=game.won?(lang==='tr'?'ZİRVE SENİN!':'SKY CONQUERED!'):s.overTitle;
    dom.overlayLead.textContent=game.won?('★'.repeat(game.medal)+'☆'.repeat(3-game.medal)+' · '+stageName(stageFor(game))): (lang==='tr'?'Yıldız: ':'Stars: ')+game.starsCollected+' · '+(lang==='tr'?'Mükemmel: ':'Perfect: ')+game.perfectLandings+' · '+(lang==='tr'?'Hedef: ':'Target: ')+nextTarget(game.dist)+'m';
    dom.overlayLead.textContent+=' · +'+game.earned+' ◈';
    dom.playBtn.textContent=game.won&&game.stageIndex<STAGES.length-1?(lang==='tr'?'SONRAKİ BÖLÜM':'NEXT LEVEL'):s.tryAgain;
    dom.overlayStats.innerHTML = statsHtml([
      [game.score, s.score],
      [bestScore, s.best],
      [`${game.dist}m`, s.altitude],
    ]);
  }
}

// High-DPI Canvas & Responsive Portal Fit
function fit() {
  const vw = window.innerWidth || W;
  const vh = window.innerHeight || H;
  const isCompact = vw <= 540;
  const pad = isCompact ? 0 : 20;
  const scale = isCompact
    ? Math.min(vw / W, vh / H)
    : clamp(Math.min((vw - pad) / W, (vh - pad) / H), 0.35, 2.2);

  dom.wrapper.style.width = `${Math.round(W * scale)}px`;
  dom.wrapper.style.height = `${Math.round(H * scale)}px`;

  dpr = clamp((window && window.devicePixelRatio) || 1, 1, 2.5);
  const targetW = Math.round(W * dpr);
  const targetH = Math.round(H * dpr);
  if (canvas.width !== targetW || canvas.height !== targetH) {
    canvas.width = targetW;
    canvas.height = targetH;
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  if (dom.fullscreenBtn) {
    const canFs = !!(document && (document.fullscreenEnabled || dom.wrapper.requestFullscreen));
    dom.fullscreenBtn.hidden=embedded||portal.sdkName()==='crazygames'||!canFs;
  }
}

function render() {
  drawGame(game);
  syncHud();
}

function resetControls() {
  input.left = false;
  input.right = false;
  input.pointerX = null;
  input.boost=false;steeringPointerId=null;dom.mobileLeftBtn.classList.remove('pressed');dom.mobileRightBtn.classList.remove('pressed');
}

function startGame() {
  resetControls();shopOpen=false;
  totalRuns += 1;
  safeStorage.set('upjump-runs', totalRuns);
  portal.gameplayStop();saveRecords();game = createGame(MODES.PLAY);
  acc = 0;
  portal.gameplayStart();
  render();
  updateOverlay();
}

function openMenu() {
  saveRecords();resetControls();
  portal.gameplayStop();
  game = createGame(MODES.MENU);
  acc = 0;
  render();
  updateOverlay();
}

function primaryAction() {
  if (game.mode === MODES.MENU || game.mode === MODES.OVER) {
    if(game.won&&game.stageIndex<STAGES.length-1)chooseStage(game.stageIndex+1);
    startGame();
  } else if (game.mode === MODES.PAUSE) {
    game.mode = MODES.PLAY;
    acc = 0;
    portal.gameplayStart();
    updateOverlay();
    render();
  }
}

function togglePause() {
  if (game.mode === MODES.PLAY) {
    game.mode = MODES.PAUSE;
    resetControls();
    portal.gameplayStop();
  } else if (game.mode === MODES.PAUSE) {
    game.mode = MODES.PLAY;
    acc = 0;
    portal.gameplayStart();
  } else return;
  updateOverlay();
  render();
}

async function toggleFullscreen() {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else if (dom.wrapper.requestFullscreen) await dom.wrapper.requestFullscreen();
  } catch {}
}

function step(frames = 1) {
  for (let i = 0; i < frames; i++) updateGame(game);
  render();
}

function loop(ts) {
  if (!last) last = ts;
  const elapsed = Math.max(0, Math.min(100, ts - last));
  last = ts;
  ambientT += elapsed / STEP;

  if (game.mode === MODES.PLAY) {
    acc += elapsed;
    let steps = 0;
    while (acc >= STEP && steps < 6 && game.mode === MODES.PLAY) {
      updateGame(game);
      acc -= STEP;
      steps++;
    }
    if (steps === 6 && acc >= STEP) acc = STEP * 0.5;
  } else {
    acc = 0;
  }

  render();
  rafId = requestAnimationFrame(loop);
}

// Keyboard Controls (Arrows + WASD + Space/Shift/Up + M/P/Esc/F/R)
document.addEventListener('keydown', e => {
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { input.left = true; e.preventDefault(); }
  if (k === 'ArrowRight' || k === 'd' || k === 'D') { input.right = true; e.preventDefault(); }
  if (k === 'ArrowUp' || k === 'ArrowDown') e.preventDefault();

  if ((e.code === 'Space' || k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W' || k === 'Shift') && !e.repeat) {
    e.preventDefault();
    if (game.mode === MODES.PLAY) {
      unlockAudio();
      input.boost = true;
    } else if ((e.code === 'Space' || k === ' ') && (game.mode === MODES.MENU || (game.mode === MODES.OVER && Date.now() - lastDeathMs > 350))) {
      unlockAudio();
      primaryAction();
    }
  }
  if (k === 'Enter' && !e.repeat && !(e.target&&e.target.tagName==='BUTTON')) {
    unlockAudio();
    primaryAction();
  }
  if ((k === 'p' || k === 'P' || k === 'Escape') && !e.repeat) togglePause();
  if ((k === 'm' || k === 'M') && !e.repeat) toggleSound();
  if((k==='f'||k==='F')&&!e.repeat&&!embedded&&portal.sdkName()!=='crazygames')toggleFullscreen();
  if ((k === 'r' || k === 'R') && !e.repeat && (game.mode === MODES.OVER || game.mode === MODES.PAUSE)) {
    unlockAudio();
    startGame();
  }
});

document.addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') input.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') input.right = false;
});

// Pointer & Touch Steering
function setPointer(e) {
  const p = e.touches ? e.touches[0] : e;
  if (p) input.pointerX = p.clientX;
}

let steeringPointerId = null;
canvas.addEventListener('pointerdown', e => {
  if (game.mode !== MODES.PLAY || steeringPointerId !== null) return;
  unlockAudio();
  steeringPointerId = e.pointerId;
  setPointer(e);
  try { canvas.setPointerCapture(e.pointerId); } catch {}
});
canvas.addEventListener('pointermove', e => {
  if (steeringPointerId === e.pointerId && game.mode === MODES.PLAY) setPointer(e);
});
function endSteering(e) {
  if (steeringPointerId !== e.pointerId) return;
  steeringPointerId = null;
  input.pointerX = null;
  try { if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId); } catch {}
}
canvas.addEventListener('pointerup', endSteering);
canvas.addEventListener('pointercancel',endSteering);canvas.addEventListener('lostpointercapture',endSteering);
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('touchstart', e => {
  if (game.mode === MODES.PLAY) { e.preventDefault(); unlockAudio(); setPointer(e); }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  if (game.mode === MODES.PLAY) { e.preventDefault(); setPointer(e); }
}, { passive: false });
canvas.addEventListener('touchend', () => { input.pointerX = null; }, { passive: true });
canvas.addEventListener('touchcancel', () => { input.pointerX = null; }, { passive: true });

// Auto-Pause on Tab Hidden / Focus Lost
function onFocusLost() {
  saveRecords();if (game && game.mode === MODES.PLAY) togglePause();
  resetControls();
  steeringPointerId = null;
  suspendAudio();
}
window.addEventListener('blur', onFocusLost);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) onFocusLost();
});

// Touch Controls Binding
dom.novaBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  e.stopPropagation();
  unlockAudio();
  if (game.mode === MODES.PLAY && game.energy >= 100) input.boost = true;
});
dom.novaBtn.addEventListener('click', e => {
  e.preventDefault();
  e.stopPropagation();
  unlockAudio();
  if (game.mode === MODES.PLAY && game.energy >= 100) input.boost = true;
});

function bindMobileMove(button, direction) {
  let activePointer = null;
  button.addEventListener('pointerdown', e => {
    if (game.mode !== MODES.PLAY) return;
    e.preventDefault();
    e.stopPropagation();
    unlockAudio();
    if(activePointer!==null&&input[direction])return;activePointer=e.pointerId;
    input[direction] = true;
    button.classList.add('pressed');
    try { button.setPointerCapture(e.pointerId); } catch {}
  });
  const release = e => {
    if (activePointer !== e.pointerId) return;
    input[direction] = false;
    activePointer = null;
    button.classList.remove('pressed');
  };
  button.addEventListener('pointerup', release);
  button.addEventListener('pointercancel',release);button.addEventListener('lostpointercapture',release);
  button.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('blur', () => {
    input[direction] = false;
    activePointer = null;
    button.classList.remove('pressed');
  });
}
bindMobileMove(dom.mobileLeftBtn, 'left');
bindMobileMove(dom.mobileRightBtn, 'right');

// UI Buttons
for(const [id,delta] of [['shopPrev',-1],['shopNext',1]])document.getElementById(id).addEventListener('click',()=>{if(game.mode!==MODES.MENU)return;shopIndex=(shopIndex+delta+UPGRADES.length)%UPGRADES.length;syncShop(true);});
document.getElementById('shopToggle').addEventListener('click',()=>{if(game.mode!==MODES.MENU)return;shopOpen=!shopOpen;syncModeMenu(true);});
document.getElementById('shopBuy').addEventListener('click',()=>{if(game.mode!==MODES.MENU)return;buyUpgrade();syncShop(true);});
for(const [id,delta] of [['stagePrev',-1],['stageNext',1]])document.getElementById(id).addEventListener('click',()=>{if(game.mode!==MODES.MENU)return;chooseStage(selectedStage+delta);game=createGame(MODES.MENU);lastRail='';updateOverlay();render();});
for(const [id,mode] of [['expeditionBtn','expedition'],['endlessBtn','endless']]){
 document.getElementById(id).addEventListener('click',()=>{selectedMode=mode;safeStorage.set('upjump-mode',mode);game.course=mode;lastRail='';updateOverlay();render();});
}
document.getElementById('suitBtn').addEventListener('click',()=>{const unlocked=SUITS.filter(v=>v.alt<=bestAlt).length;suitIndex=(suitIndex+1)%unlocked;safeStorage.set('upjump-suit',suitIndex);syncSuit();syncModeMenu(true);render();});
dom.soundBtn.addEventListener('click', toggleSound);
if (dom.fullscreenBtn) dom.fullscreenBtn.addEventListener('click', toggleFullscreen);
dom.overlayMenuBtn.addEventListener('click', openMenu);
if (dom.overlayRestartBtn) dom.overlayRestartBtn.addEventListener('click', () => { unlockAudio(); startGame(); });
dom.playBtn.addEventListener('click', () => { unlockAudio(); primaryAction(); });
dom.pauseBtn.addEventListener('click', togglePause);
if (dom.langEnBtn) dom.langEnBtn.addEventListener('click', () => setLang('en'));
if (dom.langTrBtn) dom.langTrBtn.addEventListener('click', () => setLang('tr'));

window.addEventListener('resize', fit);
document.addEventListener('fullscreenchange', fit);

// QA & Telemetry Inspection Hook
window.render_game_to_text = () => JSON.stringify({
  mode: game.mode,
  lang,
  portal: portal.sdkName(),
  art:{total:ASSET_KEYS.length,ready:ASSET_KEYS.filter(artReady).length},
  economy:{wallet,upgrades:{...upgradeLevels},earned:game.earned},boss:game.boss?{hp:game.boss.hp,hearts:game.boss.hearts,maxHp:game.boss.maxHp}:null,
  course:{stage:game.stageIndex,goal:goalFor(game),medal:game.medal,medals:medals.slice(),unlocked:unlockedStage(),mode:game.course,checkpoint:game.checkpoint,rescued:game.rescued,won:game.won,wins:expeditionWins,risk:game.routeBonus},
  progression:{target:nextTarget(game.dist),suit:suitIndex,unlocked:SUITS.filter(v=>v.alt<=bestAlt).length,perfect:game.perfectLandings,stars:game.starsCollected},
  biome: getBiomeState(game.dist).name,
  coordinates: 'origin top-left; x right; y down; screenY = worldY - camY',
  player: {
    x: Math.round(game.player.x),
    y: Math.round(game.player.y),
    screenY: Math.round(game.player.y - game.camY),
    vx: +game.player.vx.toFixed(2),
    vy: +game.player.vy.toFixed(2),
    boost: game.player.boost,
    shield: game.player.shield,
  },
  hud: {
    score: game.score,
    best: bestScore,
    altitude: game.dist,
    combo: game.combo,
    energy: Math.round(game.energy),
    mission: `${missionText(game.mission)} (${game.mission.progress}/${game.mission.target})`,
  },
  platforms: game.platforms.filter(p => p.y - game.camY > -40 && p.y - game.camY < H + 40).slice(0, 12).map(p => ({
    type: p.type, x: Math.round(p.x), y: Math.round(p.y), screenY: Math.round(p.y - game.camY), solid: solid(p),
  })),
  pickups: game.stars.filter(s => s.y - game.camY > -40 && s.y - game.camY < H + 40).slice(0, 8).map(s => ({
    kind: s.kind, x: Math.round(s.x), y: Math.round(s.y), screenY: Math.round(s.y - game.camY),
  })),
  hazards: game.drones.filter(d => d.y - game.camY > -60 && d.y - game.camY < H + 40).slice(0, 6).map(d => ({
    x: Math.round(d.x), y: Math.round(d.y), screenY: Math.round(d.y - game.camY),
  })),
  overlay: {
    visible: dom.overlay.style.display !== 'none',
    title: dom.overlayTitle.textContent,
    button: dom.playBtn.textContent,
  },
});
window.advanceTime = ms => step(Math.max(1, Math.round(ms / STEP)));
window.startGame = startGame;

syncStaticLabels();
fit();
openMenu();
portal.loadingFinished();
rafId = requestAnimationFrame(loop);
</script>
