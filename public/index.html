// Drawing Geometry Helpers
function roundRect(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w, y + h - rr);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x, y + rr);
  ctx.quadraticCurveTo(x, y, x + rr, y);
  ctx.closePath();
}

function drawStar(x, y, outer, inner, rotOffset = 0) {
  let rot = Math.PI * 1.5 + rotOffset;
  const step = Math.PI / 5;
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const ox = x + Math.cos(rot) * outer;
    const oy = y + Math.sin(rot) * outer;
    if (i === 0) ctx.moveTo(ox, oy); else ctx.lineTo(ox, oy);
    rot += step;
    ctx.lineTo(x + Math.cos(rot) * inner, y + Math.sin(rot) * inner);
    rot += step;
  }
  ctx.closePath();
}

function drawSparkle(x, y, r) {
  ctx.beginPath();
  ctx.moveTo(x, y - r);
  ctx.quadraticCurveTo(x + r * 0.16, y - r * 0.16, x + r, y);
  ctx.quadraticCurveTo(x + r * 0.16, y + r * 0.16, x, y + r);
  ctx.quadraticCurveTo(x - r * 0.16, y + r * 0.16, x - r, y);
  ctx.quadraticCurveTo(x - r * 0.16, y - r * 0.16, x, y - r);
  ctx.closePath();
  ctx.fill();
}

function inter(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function statsHtml(items) {
  return items.map(i => `<div class="stat-cell"><strong>${i[0]}</strong><span>${i[1]}</span></div>`).join('');
}

function createMission() {
  const pool = [
    { type: 'collect', target: 4, progress: 0 },
    { type: 'spring', target: 3, progress: 0 },
    { type: 'nova', target: 1, progress: 0 },
  ];
  return pool[Math.floor(Math.random() * pool.length)];
}

function missionText(m) {
  const s = t();
  if (m.type === 'collect') return s.missionCollect(m.target);
  if (m.type === 'spring') return s.missionSpring(m.target);
  return s.missionNova(m.target);
}

// Biome Interpolation
function getBiomeState(alt) {
  let idx = 0;
  for (let i = 0; i < BIOMES.length - 1; i++) {
    if (alt >= BIOMES[i].alt) idx = i;
  }
  const curr = BIOMES[idx];
  const next = BIOMES[Math.min(idx + 1, BIOMES.length - 1)];
  const span = Math.max(1, next.alt - curr.alt);
  const f = idx === BIOMES.length - 1 ? 0 : clamp((alt - curr.alt) / span, 0, 1);
  return {
    idx,
    name: lang === 'tr' ? curr.nameTr : curr.nameEn,
    top: lerpColor(curr.top, next.top, f),
    mid: lerpColor(curr.mid, next.mid, f),
    bot: lerpColor(curr.bot, next.bot, f),
    glowA: lerpColor(curr.glowA, next.glowA, f),
    glowB: lerpColor(curr.glowB, next.glowB, f),
  };
}

// Game Creation & Fair Procedural Generation
function createGame(mode = MODES.MENU) {
  const startX = W / 2 - 18, startY = H - 150;
  const scarf = [];
  for (let i = 0; i < 6; i++) scarf.push({ x: startX + 18, y: startY + 24 + i * 4 });

  const g = {
    mode,
    frame: 0,
    camY: 0,
    genY: H,
    score: 0,
    dist: 0,
    bonus: 0,
    combo: 0,
    maxCombo: 0,
    dronesSmashed: 0,
    missionsCleared: 0,
    energy: 0,
    energyWasFull: false,
    beatBestInRun: false,
    startBest: bestScore,
    biomeIdx: 0,
    banner: '',
    bannerTimer: 0,
    shake: 0,
    hitStop: 0,
    flash: 0,
    movedOnce: false,
    hintAlpha: 1,
    endReason: 'fall',
    lastSafeX: W / 2 - 44,
    fragileStreak: 0,
    mission: createMission(),
    platforms: [],
    stars: [],
    drones: [],
    particles: [],
    rings: [],
    debris: [],
    ghosts: [],
    texts: [],
    comets: [],
    player: {
      x: startX,
      y: startY,
      w: 36,
      h: 40,
      vx: 0,
      vy: -14,
      face: 1,
      tilt: 0,
      antX: 0,
      blink: 120,
      boost: 0,
      shield: 0,
      squash: 1,
      scarf,
      trail: [],
    },
  };

  g.platforms.push({
    x: W / 2 - 46, y: H - 92, w: 92, h: 15,
    type: PT.N, vx: 0, broken: false, alpha: 1, phase: 0, visible: 1, recoil: 0, springAnim: 0,
  });

  for (let y = H - 166; y > -2200; y -= 82) spawnLayer(g, y);
  g.genY = -2200;
  return g;
}

function spawnLayer(g, y) {
  const d = clamp(-y / 4400, 0, 1.5);
  const r = Math.random();
  let type = PT.N;

  if (r < 0.14 + d * 0.06) type = PT.M;
  else if (r < 0.25 + d * 0.04) type = PT.S;
  else if (r < 0.35 + d * 0.06) type = PT.C;
  else if (r < 0.43 + d * 0.05) type = PT.P;

  if (type === PT.C || type === PT.P) {
    if (g.fragileStreak >= 2 || y > H - 300) {
      type = PT.N;
      g.fragileStreak = 0;
    } else {
      g.fragileStreak += 1;
    }
  } else {
    g.fragileStreak = 0;
  }

  const w = type === PT.S ? 76 : type === PT.P ? 70 : 82;
  const maxReach = 185;
  let px;
  if (Math.random() < 0.72) {
    const raw = g.lastSafeX + rand(-maxReach, maxReach);
    px = ((raw % (W - 36 - w)) + (W - 36 - w)) % (W - 36 - w) + 18;
  } else {
    px = rand(18, W - 18 - w);
  }
  if (type !== PT.C && type !== PT.P) g.lastSafeX = px;

  const moveSpeed = (1.35 + d * 0.55) * (Math.random() > 0.5 ? 1 : -1);
  const p = {
    x: px, y, w, h: 15, type,
    vx: type === PT.M ? moveSpeed : 0,
    broken: false, alpha: 1, phase: rand(0, TAU), visible: 1,
    recoil: 0, springAnim: 0,
  };
  g.platforms.push(p);

  const hasStar = Math.random() < (type === PT.S ? 0.74 : 0.40 + d * 0.08);
  if (hasStar) {
    g.stars.push({
      x: p.x + p.w / 2,
      y: y - rand(22, 32),
      kind: Math.random() < 0.15 + d * 0.06 ? 'orb' : 'star',
      t: rand(0, TAU),
      dead: false,
    });
  }

  if (y < -280 && !hasStar && Math.random() < 0.08 + d * 0.075) {
    const dx = clamp(p.x + (p.x > W / 2 ? -rand(68, 120) : rand(68, 120)), 22, W - 56);
    g.drones.push({
      x: dx,
      y: y - rand(52, 76),
      w: 36,
      h: 22,
      vx: (1.45 + d * 0.45) * (Math.random() > 0.5 ? 1 : -1),
      phase: rand(0, TAU),
      dead: false,
    });
  }
}

function addBurst(g, x, y, color, n, speed = 1, kind = 'mix') {
  for (let i = 0; i < n; i++) {
    const ang = rand(0, TAU);
    const spd = rand(0.9, 4.0) * speed;
    const life = rand(18, 38);
    const shape = kind === 'mix' ? (i % 3 === 0 ? 'spark' : i % 3 === 1 ? 'diamond' : 'dot') : kind;
    g.particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 1.3,
      life, max: life,
      size: rand(2.2, 5.2),
      color,
      shape,
      grav: 0.11,
    });
  }
}

function addRing(g, x, y, color, maxR = 36, lw = 2.5) {
  g.rings.push({ x, y, r: 6, maxR, color, lw, life: 19, max: 19 });
}

function addShake(g, amt) {
  if (reducedMotion()) return;
  g.shake = Math.max(g.shake, amt);
}

function addText(g, x, y, text, color, scale = 1) {
  g.texts.push({ x, y, text, color, life: 48, max: 48, scale });
}

function setBanner(g, text) {
  g.banner = text;
  g.bannerTimer = 96;
}

function addEnergy(g, amount) {
  const prev = g.energy;
  g.energy = clamp(g.energy + amount, 0, 100);
  if (prev < 100 && g.energy >= 100 && !g.energyWasFull) {
    g.energyWasFull = true;
    sfx.novaReady();
    addRing(g, g.player.x + g.player.w / 2, g.player.y + g.player.h / 2, '#ffd166', 48, 3.2);
    addBurst(g, g.player.x + g.player.w / 2, g.player.y + g.player.h / 2, '#ffd166', 10, 1.1, 'spark');
  }
}

function missionHit(g, type) {
  if (g.mission.type !== type) return;
  g.mission.progress += 1;
  if (g.mission.progress >= g.mission.target) {
    g.bonus += 180;
    g.missionsCleared += 1;
    addEnergy(g, 36);
    setBanner(g, t().bannerMission);
    sfx.mission();
    portal.happyTime();
    addBurst(g, g.player.x + g.player.w / 2, g.player.y, '#53f5d0', 18, 1.25);
    g.mission = createMission();
  }
}

function totalScore(g) {
  g.score = g.dist + g.bonus;
  if (g.score > bestScore) {
    bestScore = g.score;
    safeStorage.set('upjump-best', bestScore);
    if (!g.beatBestInRun && g.startBest > 0) {
      g.beatBestInRun = true;
      setBanner(g, t().bannerBest);
      sfx.highScore();
      portal.happyTime();
    }
  }
  if (g.dist > bestAlt) {
    bestAlt = g.dist;
    safeStorage.set('upjump-best-alt', bestAlt);
  }
}

function solid(p) { return !p.broken && (p.type !== PT.P || p.visible > 0.38); }
function jumpPower(type) { return type === PT.S ? 22.4 : type === PT.M ? 15.8 : type === PT.P ? 16.4 : 14.8; }

function moveIntent() {
  if (input.left && !input.right) return -1;
  if (input.right && !input.left) return 1;
  if (input.pointerX == null) return 0;
  const rect = canvas.getBoundingClientRect();
  const x = input.pointerX - rect.left;
  if (x < rect.width * 0.42) return -1;
  if (x > rect.width * 0.58) return 1;
  return 0;
}

function tryNova(g) {
  if (g.energy < 100 || g.player.boost > 0) return false;
  g.energy = 0;
  g.energyWasFull = false;
  g.player.boost = 56;
  g.player.shield = 74;
  g.player.vy = -24;
  g.player.squash = 0.6;
  g.combo = Math.min(g.combo + 2, 9);
  g.maxCombo = Math.max(g.maxCombo, g.combo);
  g.flash = 0.36;
  addShake(g, 8);
  setBanner(g, t().bannerNova);
  sfx.novaDash();
  const cx = g.player.x + g.player.w / 2, cy = g.player.y + g.player.h / 2;
  addBurst(g, cx, cy, '#ffd166', 22, 1.4);
  addRing(g, cx, cy, '#ffd166', 62, 3.6);
  return true;
}

function triggerGameOver(g, reason) {
  g.mode = MODES.OVER;
  g.endReason = reason;
  lastDeathMs = Date.now();
  addShake(g, 10);
  g.flash = 0.28;
  sfx.gameOver();
  portal.gameplayStop();
  totalScore(g);
  updateOverlay();
}

function updateScarf(pl, anchorX, anchorY) {
  const sc = pl.scarf;
  // Reset chain seamlessly if wrapped across screen edges
  if (Math.abs(sc[0].x - anchorX) > 120) {
    for (let i = 0; i < sc.length; i++) {
      sc[i].x = anchorX - pl.face * i * 3;
      sc[i].y = anchorY + i * 4;
    }
    return;
  }
  sc[0].x = anchorX;
  sc[0].y = anchorY;
  for (let i = 1; i < sc.length; i++) {
    const prev = sc[i - 1], curr = sc[i];
    const flutter = Math.sin(ambientT * 0.32 + i * 0.9) * 1.1;
    curr.x = lerp(curr.x, prev.x - pl.face * 3.2 - pl.vx * 0.45 + flutter, 0.46);
    curr.y = lerp(curr.y, prev.y + 4.8 - clamp(pl.vy * 0.25, -4, 3), 0.48);
  }
}

function updateGame(g) {
  if (g.mode !== MODES.PLAY) return;
  g.frame++;

  if (g.hitStop > 0) {
    g.hitStop--;
    g.shake *= 0.86;
    return;
  }

  if (input.boost) {
    tryNova(g);
    input.boost = false;
  }

  const pl = g.player;
  const dir = moveIntent();
  if (dir !== 0) g.movedOnce = true;
  if (g.movedOnce && g.hintAlpha > 0) g.hintAlpha = Math.max(0, g.hintAlpha - 0.04);
  else if (g.frame > 180 && g.hintAlpha > 0) g.hintAlpha = Math.max(0, g.hintAlpha - 0.02);

  const targetVx = dir * 6.4;
  pl.vx = lerp(pl.vx, targetVx, dir === 0 ? 0.14 : 0.25);
  pl.x += pl.vx;
  if (dir) pl.face = dir;
  pl.tilt = lerp(pl.tilt, clamp(pl.vx * 0.04, -0.26, 0.26), 0.22);
  pl.antX = lerp(pl.antX, -pl.vx * 1.5, 0.16);

  if (pl.x + pl.w / 2 < 0) pl.x += W;
  if (pl.x + pl.w / 2 > W) pl.x -= W;

  if (pl.boost > 0) {
    pl.boost--;
    pl.shield = Math.max(pl.shield, pl.boost);
    pl.vy += 0.18;
    pl.vy = Math.min(pl.vy, -11);
    if (g.frame % 2 === 0) {
      g.particles.push({
        x: pl.x + pl.w / 2 + rand(-10, 10),
        y: pl.y + pl.h,
        vx: rand(-0.7, 0.7),
        vy: rand(2.6, 5.4),
        life: 17, max: 17,
        size: rand(2.6, 5.6),
        color: Math.random() > 0.35 ? '#ffd166' : '#ff8a65',
        shape: Math.random() > 0.5 ? 'spark' : 'dot',
        grav: 0.04,
      });
    }
  } else {
    pl.vy += 0.47;
  }

  // Afterimage ghosts during Nova Dash or high-velocity Spring Launch
  if ((pl.boost > 0 || pl.vy < -17.5) && g.frame % 3 === 0) {
    g.ghosts.push({
      x: pl.x + pl.w / 2,
      y: pl.y + pl.h / 2,
      tilt: pl.tilt,
      face: pl.face,
      squash: pl.squash,
      boost: pl.boost > 0,
      life: 12,
      max: 12,
    });
  }

  pl.y += pl.vy;
  pl.squash = lerp(pl.squash, 1, 0.2);
  if (pl.shield > 0) pl.shield--;
  pl.blink--;
  if (pl.blink < -7) pl.blink = Math.floor(rand(110, 230));

  updateScarf(pl, pl.x + pl.w / 2 - pl.face * 7, pl.y + 25);

  pl.trail.unshift({
    x: pl.x + pl.w / 2,
    y: pl.y + pl.h / 2,
    r: pl.boost > 0 ? 11 : 6.5,
    a: pl.boost > 0 ? 0.46 : 0.22,
  });
  if (pl.trail.length > 10) pl.trail.pop();
  pl.trail.forEach(tr => { tr.a *= 0.82; tr.r *= 0.96; });

  const targetCam = pl.y - H * 0.42;
  if (targetCam < g.camY) g.camY = lerp(g.camY, targetCam, 0.44);

  while (g.genY > g.camY - 140) {
    spawnLayer(g, g.genY);
    const difficultyGap = Math.min(46, g.dist / 32);
    g.genY -= rand(68, 96) + difficultyGap;
  }

  // Update platforms
  g.platforms.forEach(p => {
    if (p.type === PT.M) {
      p.x += p.vx;
      if (p.x < 14) { p.x = 14; p.vx = Math.abs(p.vx); }
      if (p.x + p.w > W - 14) { p.x = W - 14 - p.w; p.vx = -Math.abs(p.vx); }
    }
    if (p.type === PT.P) {
      p.phase += 0.048;
      p.visible = 0.14 + ((Math.sin(p.phase) + 1) * 0.5) * 0.86;
      p.alpha = 0.18 + p.visible * 0.82;
    }
    if (p.broken) p.alpha = clamp(p.alpha - 0.08, 0, 1);
    if (p.recoil > 0) p.recoil = Math.max(0, p.recoil - 0.16);
    if (p.springAnim > 0) p.springAnim = Math.max(0, p.springAnim - 0.1);
  });

  // Collectibles & gentle magnetic pull
  const cx = pl.x + pl.w / 2, cy = pl.y + pl.h / 2;
  g.stars.forEach(s => {
    s.t += s.kind === 'orb' ? 0.08 : 0.11;
    if (!s.dead) {
      const dx = cx - s.x, dy = cy - s.y;
      const d2 = dx * dx + dy * dy;
      const pullR = s.kind === 'orb' ? 66 : 52;
      if (d2 < pullR * pullR && d2 > 4) {
        const pull = pl.boost > 0 ? 0.24 : 0.12;
        s.x += dx * pull;
        s.y += dy * pull;
      }
    }
  });

  g.drones.forEach(d => {
    d.x += d.vx;
    d.phase += 0.16;
    if (d.x < 16) { d.x = 16; d.vx = Math.abs(d.vx); }
    if (d.x + d.w > W - 16) { d.x = W - 16 - d.w; d.vx = -Math.abs(d.vx); }
  });

  g.particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.life--; });
  g.rings.forEach(r => { r.life--; r.r = lerp(r.r, r.maxR, 0.22); });
  g.debris.forEach(b => { b.x += b.vx; b.y += b.vy; b.vy += 0.28; b.rot += b.vrot; b.life--; });
  g.ghosts.forEach(gh => { gh.life--; });
  g.texts.forEach(tx => { tx.y -= 1.1; tx.life--; });

  if (g.dist > 450 && Math.random() < 0.011) {
    g.comets.push({ x: rand(50, W), y: rand(30, H * 0.46), vx: -rand(5.2, 8.8), vy: rand(2.5, 4.6), life: 28, max: 28 });
  }
  g.comets.forEach(c => { c.x += c.vx; c.y += c.vy; c.life--; });

  g.platforms = g.platforms.filter(p => !(p.broken && p.alpha <= 0) && p.y - g.camY < H + 120);
  g.stars = g.stars.filter(s => !s.dead && s.y - g.camY < H + 90);
  g.drones = g.drones.filter(d => !d.dead && d.y - g.camY < H + 120);
  g.particles = g.particles.filter(p => p.life > 0);
  g.rings = g.rings.filter(r => r.life > 0);
  g.debris = g.debris.filter(b => b.life > 0);
  g.ghosts = g.ghosts.filter(gh => gh.life > 0);
  g.texts = g.texts.filter(tx => tx.life > 0);
  g.comets = g.comets.filter(c => c.life > 0);

  // Platform bounce check
  if (pl.vy > 0) {
    const footY = pl.y + pl.h;
    const prevFootY = footY - pl.vy;
    for (const p of g.platforms) {
      if (!solid(p)) continue;
      const horizHit =
        (pl.x + pl.w - 4 > p.x && pl.x + 4 < p.x + p.w) ||
        (pl.x - W + pl.w - 4 > p.x && pl.x - W + 4 < p.x + p.w) ||
        (pl.x + W + pl.w - 4 > p.x && pl.x + W + 4 < p.x + p.w);
      if (horizHit && footY >= p.y && footY <= p.y + p.h + 14 && prevFootY <= p.y + p.h + 2) {
        pl.y = p.y - pl.h;
        pl.vy = -jumpPower(p.type);
        pl.squash = p.type === PT.S ? 0.6 : 0.72;
        p.recoil = 1;

        const gap = g.frame - (g.lastBounce || -999);
        g.combo = gap < 86 ? Math.min(g.combo + 1, 9) : 1;
        g.maxCombo = Math.max(g.maxCombo, g.combo);
        g.lastBounce = g.frame;

        let energy = 5;
        if (p.type === PT.S) {
          p.springAnim = 1;
          g.bonus += 14;
          energy = 15;
          missionHit(g, 'spring');
          setBanner(g, t().bannerSpring);
          addShake(g, 4.5);
          sfx.spring();
          addRing(g, p.x + p.w / 2, p.y, '#ff8a65', 46, 3.2);
          addBurst(g, p.x + p.w / 2, p.y, '#ffd8c4', 12, 1.25);
        } else if (p.type === PT.C) {
          energy = 6;
          p.broken = true;
          sfx.crumble();
          // 4-piece rock shatter
          for (let k = 0; k < 4; k++) {
            const side = k < 2 ? -1 : 1;
            g.debris.push({
              x: p.x + p.w * (0.18 + k * 0.21),
              y: p.y + 7,
              w: p.w * 0.24,
              h: p.h * (k % 2 === 0 ? 0.9 : 0.7),
              vx: side * rand(0.9, 2.2),
              vy: rand(-1.8, -0.4),
              rot: rand(-0.2, 0.2),
              vrot: side * rand(0.06, 0.14),
              color: k % 2 === 0 ? STYLE.crumble.mid : STYLE.crumble.base,
              life: 38, max: 38,
            });
          }
          addBurst(g, p.x + p.w / 2, p.y + 6, '#fae0be', 10, 0.95, 'diamond');
        } else {
          if (p.type === PT.M) { g.bonus += 8; energy = 9; }
          else if (p.type === PT.P) { g.bonus += 10; energy = 11; }
          sfx.bounce(g.combo);
          addBurst(g, pl.x + pl.w / 2, p.y, STYLE[p.type].mid, 7, 0.9);
          addRing(g, pl.x + pl.w / 2, p.y + 2, STYLE[p.type].top, 26, 1.8);
        }

        addEnergy(g, energy);
        break;
      }
    }
  }

  // Collectible pickups
  g.stars.forEach(s => {
    const reach = s.kind === 'orb' ? 30 : 25;
    if (!s.dead && Math.abs(cx - s.x) < reach && Math.abs(cy - s.y) < reach) {
      s.dead = true;
      const bonus = (s.kind === 'orb' ? 75 : 25) + g.combo * 5;
      g.bonus += bonus;
      addEnergy(g, s.kind === 'orb' ? 44 : 18);
      if (s.kind === 'orb') sfx.orb(); else sfx.star(g.combo);
      const col = s.kind === 'orb' ? '#53f5d0' : '#ffd166';
      addBurst(g, s.x, s.y, col, s.kind === 'orb' ? 14 : 9, 1.15);
      addRing(g, s.x, s.y, col, s.kind === 'orb' ? 38 : 26, 2.4);
      addText(g, s.x, s.y - 12, `+${bonus}`, col, s.kind === 'orb' ? 1.18 : 1);
      if (s.kind === 'star') missionHit(g, 'collect');
    }
  });

  // Drone collision
  g.drones.forEach(d => {
    if (!d.dead && inter(pl, d)) {
      if (pl.shield > 0 || pl.boost > 0) {
        d.dead = true;
        g.dronesSmashed += 1;
        const bonus = 140 + g.combo * 12;
        g.bonus += bonus;
        g.hitStop = 3;
        addShake(g, 9.5);
        sfx.smash();
        const dcx = d.x + d.w / 2, dcy = d.y + d.h / 2;
        // Drone armored shrapnel
        for (let k = 0; k < 5; k++) {
          g.debris.push({
            x: dcx, y: dcy, w: rand(7, 13), h: rand(5, 9),
            vx: rand(-3.6, 3.6), vy: rand(-4.2, -0.8),
            rot: rand(0, TAU), vrot: rand(-0.22, 0.22),
            color: k % 2 === 0 ? '#ff8a65' : '#31445c',
            life: 40, max: 40,
          });
        }
        addBurst(g, dcx, dcy, '#ffd166', 20, 1.5);
        addRing(g, dcx, dcy, '#ffd166', 54, 3.5);
        addText(g, dcx, d.y - 12, `+${bonus}`, '#ffd166', 1.28);
        setBanner(g, t().bannerSmash);
        missionHit(g, 'nova');
      } else {
        triggerGameOver(g, 'drone');
      }
    }
  });

  if (g.frame - (g.lastBounce || -999) > 125) g.combo = 0;

  if (pl.y - g.camY > H + 84 && g.mode === MODES.PLAY) {
    triggerGameOver(g, 'fall');
  }

  g.dist = Math.max(g.dist, Math.floor(-g.camY / 10));

  const bState = getBiomeState(g.dist);
  if (bState.idx > g.biomeIdx) {
    g.biomeIdx = bState.idx;
    setBanner(g, `${bState.name} · ${g.dist}m`);
  }

  totalScore(g);
  if (g.bannerTimer > 0) g.bannerTimer--;
  g.shake *= 0.84;
  if (g.shake < 0.2) g.shake = 0;
  g.flash = Math.max(0, g.flash - 0.035);
}

// Sculpted Volumetric Cloud Helper
function drawCloud(x, y, scale, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  // Cool cloud underside shadow
  ctx.fillStyle = `rgba(110, 170, 215, ${alpha * 0.55})`;
  ctx.beginPath();
  ctx.ellipse(0, 6, 46, 12, 0, 0, TAU);
  ctx.fill();
  // Soft lit cloud puffs
  const cg = ctx.createLinearGradient(0, -18, 0, 10);
  cg.addColorStop(0, `rgba(225, 246, 255, ${alpha * 1.15})`);
  cg.addColorStop(1, `rgba(145, 205, 238, ${alpha * 0.35})`);
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.arc(-22, 0, 14, 0, TAU);
  ctx.arc(-4, -7, 20, 0, TAU);
  ctx.arc(17, -2, 15, 0, TAU);
  ctx.arc(31, 3, 10, 0, TAU);
  ctx.fill();
  ctx.restore();
}

// Rendering Pipeline
function drawBackground(g, biome) {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, rgb(biome.top));
  sky.addColorStop(0.55, rgb(biome.mid));
  sky.addColorStop(1, rgb(biome.bot));
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Atmospheric nebulae / aurora glows
  let glow = ctx.createRadialGradient(W * 0.18, 125, 0, W * 0.18, 125, 260);
  glow.addColorStop(0, rgb(biome.glowA, 0.19));
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  glow = ctx.createRadialGradient(W * 0.85, 220, 0, W * 0.85, 220, 240);
  glow.addColorStop(0, rgb(biome.glowB, 0.14));
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // Deep Nova Nebula Clouds (1150m+)
  if (g.dist > 1150) {
    const nAlpha = clamp((g.dist - 1150) / 350, 0, 0.24);
    ctx.save();
    const ny = ((220 - g.camY * 0.04) % (H + 220) + (H + 220)) % (H + 220) - 110;
    const ng = ctx.createRadialGradient(W * 0.5, ny, 10, W * 0.5, ny, 210);
    ng.addColorStop(0, `rgba(255, 209, 102, ${nAlpha})`);
    ng.addColorStop(0.45, `rgba(83, 245, 208, ${nAlpha * 0.65})`);
    ng.addColorStop(1, 'transparent');
    ctx.fillStyle = ng;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // Multi-ribbon flowing Aurora Curtains (0–650m)
  const auroraAlpha = clamp(1 - Math.abs(g.dist - 290) / 390, 0, 0.26);
  if (auroraAlpha > 0.01) {
    ctx.save();
    for (let layer = 0; layer < 2; layer++) {
      ctx.globalAlpha = auroraAlpha * (layer === 0 ? 1 : 0.65);
      const yBase = layer === 0 ? 175 : 225;
      const aurGrad = ctx.createLinearGradient(0, yBase - 40, W, yBase + 70);
      aurGrad.addColorStop(0, 'rgba(83,245,208,0)');
      aurGrad.addColorStop(0.35, layer === 0 ? 'rgba(83,245,208,0.62)' : 'rgba(124,199,255,0.52)');
      aurGrad.addColorStop(0.72, layer === 0 ? 'rgba(124,199,255,0.48)' : 'rgba(190,118,255,0.45)');
      aurGrad.addColorStop(1, 'rgba(190,118,255,0)');
      ctx.fillStyle = aurGrad;
      ctx.beginPath();
      ctx.moveTo(0, yBase + 25);
      for (let x = 0; x <= W; x += 24) {
        const wy = yBase + Math.sin(x * 0.016 + ambientT * (0.015 + layer * 0.006) + layer) * 24 + Math.cos(x * 0.009 - ambientT * 0.01) * 12;
        ctx.lineTo(x, wy);
      }
      ctx.lineTo(W, yBase + 75);
      for (let x = W; x >= 0; x -= 24) {
        const wy = yBase + 52 + Math.sin(x * 0.016 + ambientT * (0.015 + layer * 0.006) + layer + 0.8) * 18;
        ctx.lineTo(x, wy);
      }
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // Crescent Moon (350m–1050m)
  if (g.dist > 300 && g.dist < 1150) {
    const mAlpha = clamp(Math.min((g.dist - 300) / 180, (1150 - g.dist) / 200), 0, 0.72);
    const my = 148 + ((g.camY * 0.025) % 240);
    ctx.save();
    ctx.globalAlpha = mAlpha;
    ctx.translate(W * 0.22, ((my + 320) % 360) + 70);
    const halo = ctx.createRadialGradient(0, 0, 14, 0, 0, 56);
    halo.addColorStop(0, 'rgba(220, 240, 255, 0.28)');
    halo.addColorStop(1, 'transparent');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(0, 0, 56, 0, TAU); ctx.fill();
    ctx.fillStyle = '#e8f5ff';
    ctx.beginPath(); ctx.arc(0, 0, 20, 0, TAU); ctx.fill();
    ctx.fillStyle = rgb(biome.mid);
    ctx.beginPath(); ctx.arc(7, -4, 17, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // Detailed Ringed Planet (680m+)
  if (g.dist > 680) {
    const pAlpha = clamp((g.dist - 680) / 280, 0, 0.56);
    const py = ((180 + g.camY * 0.032) % 480 + 480) % 480 + 40;
    ctx.save();
    ctx.globalAlpha = pAlpha;
    ctx.translate(W * 0.78, py);
    // Back ring half
    ctx.strokeStyle = 'rgba(255, 209, 102, 0.32)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.ellipse(0, 2, 68, 15, -0.22, Math.PI, TAU);
    ctx.stroke();
    // Planet sphere with subtle atmosphere bands
    const pg = ctx.createRadialGradient(-14, -14, 5, 0, 0, 42);
    pg.addColorStop(0, '#72a8d8');
    pg.addColorStop(0.55, '#243c6a');
    pg.addColorStop(1, '#091124');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(0, 0, 38, 0, TAU); ctx.fill();
    // Front ring half
    ctx.strokeStyle = 'rgba(255, 224, 140, 0.52)';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.ellipse(0, 2, 68, 15, -0.22, 0, Math.PI);
    ctx.stroke();
    ctx.restore();
  }

  // Multi-layer Starfield with 4-point diffraction flares on bright stars
  const starCount = g.dist > 500 ? 48 : 34;
  for (let i = 0; i < starCount; i++) {
    const x = (i * 89 + 37) % W;
    const speed = 0.045 + (i % 4) * 0.024;
    const y = ((i * 127) - g.camY * speed) % (H + 80);
    const sy = (y + H + 80) % (H + 80) - 40;
    const twinkle = 0.42 + 0.58 * Math.sin(ambientT * 0.045 + i * 1.9);
    const isHeroStar = i % 9 === 0;
    if (isHeroStar) {
      ctx.fillStyle = i % 18 === 0 ? `rgba(255,216,120,${0.9 * twinkle})` : `rgba(186,250,245,${0.85 * twinkle})`;
      drawSparkle(x, sy, 4.2 + twinkle * 1.6);
    } else {
      const r = i % 3 === 0 ? 1.45 : 0.95;
      ctx.fillStyle = `rgba(222,246,255,${0.72 * twinkle})`;
      ctx.beginPath();
      ctx.arc(x, sy, r, 0, TAU);
      ctx.fill();
    }
  }

  // Shooting Comets
  g.comets.forEach(c => {
    const a = c.life / c.max;
    ctx.save();
    const cg = ctx.createLinearGradient(c.x, c.y, c.x - c.vx * 5.5, c.y - c.vy * 5.5);
    cg.addColorStop(0, `rgba(255, 248, 214, ${a})`);
    cg.addColorStop(1, 'rgba(83, 245, 208, 0)');
    ctx.strokeStyle = cg;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(c.x, c.y);
    ctx.lineTo(c.x - c.vx * 5.5, c.y - c.vy * 5.5);
    ctx.stroke();
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.beginPath(); ctx.arc(c.x, c.y, 1.8, 0, TAU); ctx.fill();
    ctx.restore();
  });

  // Subtle World-Space Altitude Ruler Lines (every 100m)
  const firstMark = Math.max(100, Math.floor(-g.camY / 1000) * 100);
  ctx.save();
  ctx.font = '700 10px "Avenir Next", system-ui, sans-serif';
  ctx.textAlign = 'right';
  for (let m = firstMark; m <= firstMark + 200; m += 100) {
    const wy = -m * 10;
    const sy = wy - g.camY;
    if (sy < 60 || sy > H - 40) continue;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]);
    ctx.beginPath();
    ctx.moveTo(16, sy);
    ctx.lineTo(W - 52, sy);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(200, 232, 252, 0.28)';
    ctx.fillText(`${m}m`, W - 16, sy + 3);
  }
  ctx.restore();

  // Volumetric Sculpted Parallax Clouds (fade smoothly above stratosphere)
  const cloudAlpha = clamp(1 - Math.max(0, g.dist - 360) / 280, 0, 0.16);
  if (cloudAlpha > 0.01) {
    for (let i = 0; i < 4; i++) {
      const cx = ((i * 130 + ambientT * (0.14 + (i % 2) * 0.07)) % (W + 170)) - 85;
      const cy = ((i * 185 - g.camY * (0.14 + (i % 2) * 0.04)) % (H + 160) + (H + 160)) % (H + 160) - 80;
      drawCloud(cx, cy, 0.72 + (i % 3) * 0.18, cloudAlpha);
    }
  }

  // Layered Launch Skyline & Mountain Ridge near ground
  const skyOff = clamp(-g.camY * 0.22, 0, 220);
  if (skyOff < 210) {
    ctx.save();
    ctx.translate(0, skyOff);

    // Soft upward horizon light bloom behind skyline
    const hGlow = ctx.createLinearGradient(0, H - 150, 0, H);
    hGlow.addColorStop(0, 'rgba(83, 245, 208, 0)');
    hGlow.addColorStop(1, 'rgba(83, 245, 208, 0.14)');
    ctx.fillStyle = hGlow;
    ctx.fillRect(0, H - 150, W, 150);

    // Distant mountain ridge
    ctx.fillStyle = '#071728';
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 28) {
      ctx.lineTo(x, H - 102 + Math.sin((x / W) * Math.PI * 3.2 + 0.5) * 18 + Math.cos((x / W) * Math.PI * 6.5) * 6);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();

    // Foreground futuristic skyline silhouettes with subtle lit windows
    ctx.fillStyle = '#040e1a';
    for (let i = 0; i < SKYLINE.length; i++) {
      const b = SKYLINE[i];
      const by = H - b.h;
      ctx.fillRect(b.x, by, b.w, b.h);
      // Subtle top rim highlight
      ctx.fillStyle = 'rgba(83, 245, 208, 0.14)';
      ctx.fillRect(b.x, by, b.w, 1.5);
      // Tiny glowing window lights
      ctx.fillStyle = i % 3 === 0 ? 'rgba(255, 209, 102, 0.38)' : 'rgba(130, 245, 225, 0.26)';
      for (let w = 0; w < b.lit; w++) {
        ctx.fillRect(b.x + 6 + (w % 2) * 11, by + 10 + Math.floor(w / 2) * 14, 4, 5);
      }
      ctx.fillStyle = '#040e1a';
    }
    ctx.restore();
  }

  // Ambient floating atmospheric motes
  ctx.save();
  for (let i = 0; i < 12; i++) {
    const mx = ((i * 73 + Math.sin(ambientT * 0.02 + i) * 22) % W + W) % W;
    const my = (((i * 97 - g.camY * 0.35 - ambientT * 0.25) % H) + H) % H;
    const ma = 0.14 + 0.14 * Math.sin(ambientT * 0.05 + i * 2.1);
    ctx.fillStyle = i % 3 === 0 ? `rgba(255, 218, 128, ${ma})` : `rgba(110, 248, 220, ${ma})`;
    ctx.beginPath();
    ctx.arc(mx, my, 1.5, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function drawPlayerSprite(pl, sx, sy, idleBob = 0, ghostAlpha = 1) {
  ctx.save();
  if (ghostAlpha < 1) ctx.globalAlpha = ghostAlpha;

  // Flowing energy scarf behind character (in world space before body transform)
  if (ghostAlpha === 1 && pl.scarf && pl.scarf.length > 1) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const scGrad = ctx.createLinearGradient(sx, sy, sx, sy + 28);
    scGrad.addColorStop(0, pl.boost > 0 ? '#fff5c4' : '#ff9872');
    scGrad.addColorStop(1, pl.boost > 0 ? 'rgba(255,140,80,0.1)' : 'rgba(255,105,85,0.12)');
    ctx.strokeStyle = scGrad;
    for (let i = 0; i < pl.scarf.length - 1; i++) {
      const p0 = pl.scarf[i], p1 = pl.scarf[i + 1];
      ctx.lineWidth = Math.max(1.5, 6.2 - i * 0.9);
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y - game.camY + idleBob);
      ctx.lineTo(p1.x, p1.y - game.camY + idleBob);
      ctx.stroke();
    }
    ctx.restore();
  }

  ctx.translate(sx, sy + idleBob);
  ctx.rotate(pl.tilt);
  const scaleY = pl.squash;
  const scaleX = 1 / Math.sqrt(Math.max(0.5, scaleY));
  ctx.scale(pl.face * scaleX, scaleY);

  // Active shield / Nova barrier + plasma wings
  if (ghostAlpha === 1 && pl.shield > 0) {
    const expiring = pl.shield < 22 && Math.floor(pl.shield / 3) % 2 === 0;
    const sAlpha = expiring ? 0.24 : 0.78;
    ctx.save();
    ctx.rotate(ambientT * 0.09);
    ctx.strokeStyle = `rgba(255, 214, 112, ${sAlpha})`;
    ctx.lineWidth = 3;
    for (let i = 0; i < 3; i++) {
      const a0 = i * (TAU / 3);
      ctx.beginPath();
      ctx.arc(0, 0, 27 + Math.sin(ambientT * 0.22) * 1.5, a0, a0 + 1.45);
      ctx.stroke();
    }
    ctx.restore();

    if (pl.boost > 0) {
      // Swept Nova plasma wing streaks
      ctx.save();
      const wGrad = ctx.createLinearGradient(0, -10, 0, 26);
      wGrad.addColorStop(0, 'rgba(255, 240, 175, 0.75)');
      wGrad.addColorStop(1, 'rgba(255, 130, 80, 0)');
      ctx.fillStyle = wGrad;
      ctx.beginPath();
      ctx.moveTo(-15, -2); ctx.lineTo(-28, 16); ctx.lineTo(-14, 12); ctx.closePath();
      ctx.moveTo(15, -2); ctx.lineTo(28, 16); ctx.lineTo(14, 12); ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  // Dual Jet-Boot Thruster Flames
  if (ghostAlpha === 1 && (pl.vy < -1.5 || pl.boost > 0)) {
    const flameLen = pl.boost > 0 ? 25 + Math.sin(ambientT * 0.95) * 6 : clamp(-pl.vy * 0.78, 5, 16);
    const fGrad = ctx.createLinearGradient(0, 14, 0, 14 + flameLen);
    fGrad.addColorStop(0, '#ffffff');
    fGrad.addColorStop(0.32, pl.boost > 0 ? '#ffd166' : '#63ffe0');
    fGrad.addColorStop(1, pl.boost > 0 ? 'rgba(255,105,60,0)' : 'rgba(83,245,208,0)');
    ctx.fillStyle = fGrad;
    ctx.beginPath();
    ctx.moveTo(-10, 15); ctx.lineTo(-6, 15 + flameLen); ctx.lineTo(-2, 15);
    ctx.moveTo(2, 15); ctx.lineTo(6, 15 + flameLen); ctx.lineTo(10, 15);
    ctx.fill();
  }

  // Reactive Antenna with glowing beacon
  ctx.strokeStyle = '#d9fcff';
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-2, -17);
  ctx.quadraticCurveTo(-2 + pl.antX * 0.5, -25, 2.5 + pl.antX, -28);
  ctx.stroke();
  ctx.fillStyle = pl.boost > 0 ? '#ffd166' : '#53f5d0';
  ctx.beginPath();
  ctx.arc(2.5 + pl.antX, -28, 3.4, 0, TAU);
  ctx.fill();

  // Stabilizer ear-pod on back of helmet
  ctx.fillStyle = '#15324a';
  roundRect(-18.5, -7, 5, 11, 2.5);
  ctx.fill();
  ctx.fillStyle = pl.boost > 0 ? '#ffd166' : '#53f5d0';
  ctx.fillRect(-17.5, -4, 2, 5);

  // Articulated Thruster Feet Pods
  ctx.fillStyle = '#0e2438';
  roundRect(-12, 12, 9.5, 6.5, 3); ctx.fill();
  roundRect(2.5, 12, 9.5, 6.5, 3); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.fillRect(-10.5, 13, 6.5, 1.5);
  ctx.fillRect(4, 13, 6.5, 1.5);

  // Main Dimensional Capsule Body
  if (ghostAlpha === 1) {
    ctx.shadowColor = pl.boost > 0 ? '#ffd166' : '#53f5d0';
    ctx.shadowBlur = pl.boost > 0 ? 24 : 15;
  }
  const bodyGrad = ctx.createRadialGradient(-5, -9, 3, 0, 2, 23);
  bodyGrad.addColorStop(0, '#ffffff');
  bodyGrad.addColorStop(0.32, pl.boost > 0 ? '#ffedb8' : '#cbfff5');
  bodyGrad.addColorStop(0.76, pl.boost > 0 ? '#ff985e' : '#32dfb9');
  bodyGrad.addColorStop(1, pl.boost > 0 ? '#cc522e' : '#168776');
  ctx.fillStyle = bodyGrad;
  roundRect(-16, -18, 32, 33, 15);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Collar / Suit Trim Seam
  ctx.fillStyle = 'rgba(7, 20, 34, 0.25)';
  ctx.fillRect(-13, 6, 26, 2.4);

  // Glossy Curved Helmet Visor
  const vGrad = ctx.createLinearGradient(0, -12, 0, 2);
  vGrad.addColorStop(0, '#102840');
  vGrad.addColorStop(1, '#050e19');
  ctx.fillStyle = vGrad;
  roundRect(-9.5, -11.5, 22, 13, 6.5);
  ctx.fill();

  // Visor rim sheen
  ctx.strokeStyle = 'rgba(180, 252, 245, 0.28)';
  ctx.lineWidth = 1;
  roundRect(-9.5, -11.5, 22, 13, 6.5);
  ctx.stroke();

  // Visor sky reflection
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  roundRect(-6.5, -10, 14, 2.8, 1.4);
  ctx.fill();

  // Expressive Eyes
  if (pl.boost > 0) {
    ctx.fillStyle = '#ffd166';
    roundRect(-5, -6.5, 15.5, 3.8, 2);
    ctx.fill();
  } else if (pl.blink < 0) {
    ctx.strokeStyle = '#9cfef0';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-4, -5); ctx.lineTo(0, -5);
    ctx.moveTo(5.5, -5); ctx.lineTo(9.5, -5);
    ctx.stroke();
  } else {
    const wide = pl.vy < -17 ? 2.9 : pl.vy > 10 ? 2.7 : 2.3;
    const lookY = clamp(pl.vy * 0.08, -1.2, 1.4);
    ctx.fillStyle = '#eaffff';
    ctx.beginPath();
    ctx.arc(-1.2, -5 + lookY, wide, 0, TAU);
    ctx.arc(7.2, -5 + lookY, wide, 0, TAU);
    ctx.fill();
    // Tiny specular catchlight
    ctx.fillStyle = '#53f5d0';
    ctx.beginPath();
    ctx.arc(-0.4, -5.8 + lookY, 0.9, 0, TAU);
    ctx.arc(8.0, -5.8 + lookY, 0.9, 0, TAU);
    ctx.fill();
  }

  ctx.restore();
}

function drawPlatform(p, sy) {
  const st = STYLE[p.type];
  ctx.save();

  // Moving platform horizontal maglev track
  if (p.type === PT.M) {
    ctx.strokeStyle = 'rgba(110, 195, 255, 0.18)';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.moveTo(18, sy + p.h / 2);
    ctx.lineTo(W - 18, sy + p.h / 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Phase platform intangible holographic projection frame + charge bar
  if (p.type === PT.P && p.visible <= 0.38) {
    ctx.strokeStyle = 'rgba(202, 132, 255, 0.56)';
    ctx.lineWidth = 1.6;
    ctx.setLineDash([5, 4]);
    roundRect(p.x, sy, p.w, p.h, 7);
    ctx.stroke();
    ctx.setLineDash([]);
    // Corner hologram emitters
    ctx.fillStyle = 'rgba(232, 185, 255, 0.72)';
    ctx.beginPath();
    ctx.arc(p.x + 6, sy + p.h / 2, 2.2, 0, TAU);
    ctx.arc(p.x + p.w - 6, sy + p.h / 2, 2.2, 0, TAU);
    ctx.fill();
    ctx.restore();
    return;
  }

  ctx.globalAlpha = p.alpha;

  // Soft underside hover-thruster glow (gives platforms depth against the sky)
  if (p.type !== PT.C) {
    const ug = ctx.createRadialGradient(p.x + p.w / 2, sy + p.h + 2, 4, p.x + p.w / 2, sy + p.h + 6, p.w * 0.52);
    ug.addColorStop(0, st.glow);
    ug.addColorStop(1, 'transparent');
    ctx.fillStyle = ug;
    ctx.fillRect(p.x - 10, sy + p.h - 2, p.w + 20, 20);
  }

  // Spring mechanical coil & launch cap
  if (p.type === PT.S) {
    const ext = p.springAnim * 11;
    const cx = p.x + p.w / 2;
    ctx.strokeStyle = '#fff0e6';
    ctx.lineWidth = 2.6;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - 9, sy);
    ctx.lineTo(cx + 9, sy - 4 - ext * 0.32);
    ctx.lineTo(cx - 9, sy - 8 - ext * 0.66);
    ctx.lineTo(cx + 9, sy - 12 - ext);
    ctx.stroke();
    const capGrad = ctx.createLinearGradient(cx, sy - 17 - ext, cx, sy - 11 - ext);
    capGrad.addColorStop(0, '#fff5ec');
    capGrad.addColorStop(1, '#ff9d78');
    ctx.fillStyle = capGrad;
    roundRect(cx - 15, sy - 17 - ext, 30, 6, 3);
    ctx.fill();
  }

  // 3D Slab Underside Shadow Bevel
  ctx.fillStyle = st.base;
  roundRect(p.x, sy + 3, p.w, p.h - 1, 7);
  ctx.fill();

  // Main Platform Top Deck
  ctx.shadowColor = st.glow;
  ctx.shadowBlur = p.type === PT.P ? 16 : 10;
  roundRect(p.x, sy, p.w, p.h - 2, 7);
  const grad = ctx.createLinearGradient(p.x, sy, p.x, sy + p.h - 2);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.22, st.top);
  grad.addColorStop(0.95, st.mid);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.shadowBlur = 0;

  // Specular top edge strip
  ctx.fillStyle = 'rgba(255, 255, 255, 0.36)';
  roundRect(p.x + 6, sy + 1.8, p.w - 12, 3, 1.5);
  ctx.fill();

  // Platform-specific mechanical details (non-hue-only affordances)
  if (p.type === PT.N) {
    // Corner status LEDs
    ctx.fillStyle = 'rgba(7, 28, 34, 0.55)';
    ctx.beginPath();
    ctx.arc(p.x + 9, sy + 6.5, 2, 0, TAU);
    ctx.arc(p.x + p.w - 9, sy + 6.5, 2, 0, TAU);
    ctx.fill();
  } else if (p.type === PT.M) {
    // Directional chevrons
    ctx.strokeStyle = '#07223a';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(p.x + 15, sy + 4); ctx.lineTo(p.x + 11, sy + 6.5); ctx.lineTo(p.x + 15, sy + 9);
    ctx.moveTo(p.x + p.w - 15, sy + 4); ctx.lineTo(p.x + p.w - 11, sy + 6.5); ctx.lineTo(p.x + p.w - 15, sy + 9);
    ctx.stroke();
  } else if (p.type === PT.C) {
    // Deep rock fractures
    ctx.strokeStyle = 'rgba(54, 29, 9, 0.78)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(p.x + p.w * 0.30, sy + 1);
    ctx.lineTo(p.x + p.w * 0.41, sy + 7);
    ctx.lineTo(p.x + p.w * 0.35, sy + 13);
    ctx.moveTo(p.x + p.w * 0.67, sy + 1);
    ctx.lineTo(p.x + p.w * 0.58, sy + 8);
    ctx.lineTo(p.x + p.w * 0.64, sy + 13);
    ctx.stroke();
  } else if (p.type === PT.P) {
    // Hologram emitter nodes & scanline sheen
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(p.x + 8, sy + 6.5, 2.2, 0, TAU);
    ctx.arc(p.x + p.w - 8, sy + 6.5, 2.2, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(p.x + 16, sy + 6.5);
    ctx.lineTo(p.x + p.w - 16, sy + 6.5);
    ctx.stroke();
  }

  ctx.restore();
}

function drawGame(g) {
  const biome = getBiomeState(g.dist);
  ctx.save();
  if (g.shake > 0.2) {
    ctx.translate(rand(-g.shake, g.shake), rand(-g.shake, g.shake));
  }

  drawBackground(g, biome);

  // Speed lines during Nova Dash or high-velocity spring launch
  if (g.mode === MODES.PLAY && (g.player.boost > 0 || g.player.vy < -17)) {
    const intensity = g.player.boost > 0 ? 0.38 : 0.16;
    ctx.save();
    ctx.strokeStyle = g.player.boost > 0 ? `rgba(255,214,112,${intensity})` : `rgba(124,199,255,${intensity})`;
    ctx.lineWidth = 1.6;
    for (let i = 0; i < 10; i++) {
      const lx = i < 5 ? 10 + i * 16 : W - 10 - (i - 5) * 16;
      const ly = ((ambientT * 26 + i * 137) % (H + 90)) - 45;
      ctx.beginPath();
      ctx.moveTo(lx, ly);
      ctx.lineTo(lx, ly + 46);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Platforms
  g.platforms.forEach(p => {
    const sy = p.y - g.camY + p.recoil * 4.8;
    if (sy < -36 || sy > H + 36) return;
    drawPlatform(p, sy);
  });

  // Tumbling Debris
  g.debris.forEach(b => {
    const sy = b.y - g.camY;
    if (sy > H + 40) return;
    ctx.save();
    ctx.globalAlpha = clamp(b.life / b.max, 0, 1);
    ctx.translate(b.x, sy);
    ctx.rotate(b.rot);
    ctx.fillStyle = b.color;
    roundRect(-b.w / 2, -b.h / 2, b.w, b.h, 3);
    ctx.fill();
    ctx.restore();
  });

  // Faceted Crystal Stars & Gyroscopic Energy Orbs
  g.stars.forEach(s => {
    if (s.dead) return;
    const sy = s.y + Math.sin(s.t) * 4.2 - g.camY;
    if (sy < -28 || sy > H + 28) return;
    ctx.save();
    ctx.translate(s.x, sy);
    if (s.kind === 'orb') {
      const pulse = 1 + Math.sin(s.t * 1.5) * 0.08;
      ctx.scale(pulse, pulse);
      // Outer soft energy halo
      const halo = ctx.createRadialGradient(0, 0, 6, 0, 0, 22);
      halo.addColorStop(0, 'rgba(83, 245, 208, 0.32)');
      halo.addColorStop(1, 'transparent');
      ctx.fillStyle = halo;
      ctx.beginPath(); ctx.arc(0, 0, 22, 0, TAU); ctx.fill();

      // Twin counter-rotating gyroscopic rings
      ctx.strokeStyle = 'rgba(200, 255, 246, 0.72)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.ellipse(0, 0, 15.5, 5.5, s.t * 0.75, 0, TAU);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255, 209, 102, 0.55)';
      ctx.beginPath();
      ctx.ellipse(0, 0, 14.5, 5, -s.t * 0.65 + 1.1, 0, TAU);
      ctx.stroke();

      // Luminous plasma core
      const grad = ctx.createRadialGradient(-3, -3, 1.5, 0, 0, 11);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.35, '#bcfff2');
      grad.addColorStop(1, '#26d9b4');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(0, 0, 9.8, 0, TAU); ctx.fill();
    } else {
      const tilt = Math.sin(s.t * 0.65) * 0.22;
      // Warm halo
      const halo = ctx.createRadialGradient(0, 0, 3, 0, 0, 19);
      halo.addColorStop(0, 'rgba(255, 209, 102, 0.34)');
      halo.addColorStop(1, 'transparent');
      ctx.fillStyle = halo;
      ctx.beginPath(); ctx.arc(0, 0, 19, 0, TAU); ctx.fill();

      // Faceted star body
      drawStar(0, 0, 11, 5, tilt);
      const sg = ctx.createLinearGradient(-8, -10, 8, 10);
      sg.addColorStop(0, '#fff7cc');
      sg.addColorStop(0.45, '#ffd166');
      sg.addColorStop(1, '#e8972c');
      ctx.fillStyle = sg;
      ctx.fill();

      // Inner bright crystal core
      drawStar(0, -0.5, 5.5, 2.4, tilt);
      ctx.fillStyle = '#fffdf0';
      ctx.fill();

      // Twinkling corner lens glint
      const glint = 0.5 + 0.5 * Math.sin(s.t * 2.2);
      ctx.fillStyle = `rgba(255,255,255,${0.85 * glint})`;
      drawSparkle(7, -7, 3.8 * glint);
    }
    ctx.restore();
  });

  // Armored Sentinel Patrol Drones
  g.drones.forEach(d => {
    if (d.dead) return;
    const sy = d.y - g.camY;
    if (sy < -44 || sy > H + 44) return;
    const dcx = d.x + d.w / 2, dcy = sy + d.h / 2;
    const dx = (g.player.x + g.player.w / 2) - dcx;
    const dy = (g.player.y - g.camY + g.player.h / 2) - dcy;
    const close = dx * dx + dy * dy < 135 * 135;

    ctx.save();
    ctx.translate(dcx, dcy);

    // Subtle downward volumetric scanner cone
    const scanGrad = ctx.createLinearGradient(0, 8, 0, 42);
    scanGrad.addColorStop(0, g.player.boost > 0 ? 'rgba(255, 209, 102, 0.22)' : 'rgba(255, 110, 86, 0.22)');
    scanGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = scanGrad;
    ctx.beginPath();
    ctx.moveTo(-6, 8); ctx.lineTo(-22, 42); ctx.lineTo(22, 42); ctx.lineTo(6, 8);
    ctx.closePath();
    ctx.fill();

    // Rotor stems & spinning blur discs
    ctx.strokeStyle = '#7ea3bd';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-12, -8); ctx.lineTo(-15, -13);
    ctx.moveTo(12, -8); ctx.lineTo(15, -13);
    ctx.stroke();
    const rotorW = 11 + Math.abs(Math.sin(d.phase * 2.4)) * 4;
    ctx.fillStyle = 'rgba(155, 240, 255, 0.34)';
    ctx.beginPath();
    ctx.ellipse(-15, -13, rotorW, 2.8, 0, 0, TAU);
    ctx.ellipse(15, -13, rotorW, 2.8, 0, 0, TAU);
    ctx.fill();

    // Proximity threat ring
    if (close && g.player.shield <= 0 && g.player.boost <= 0) {
      ctx.strokeStyle = `rgba(255, 112, 86, ${0.42 + Math.sin(ambientT * 0.38) * 0.22})`;
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(0, 0, 24, 0, TAU);
      ctx.stroke();
    }

    // Armored chassis
    ctx.shadowColor = 'rgba(255, 115, 86, 0.45)';
    ctx.shadowBlur = 14;
    const dGrad = ctx.createLinearGradient(0, -11, 0, 11);
    dGrad.addColorStop(0, '#ffd8c7');
    dGrad.addColorStop(0.4, '#ff8660');
    dGrad.addColorStop(1, '#a93729');
    ctx.fillStyle = dGrad;
    roundRect(-18, -10, 36, 20, 9);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Chassis top bevel & side vents
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    roundRect(-12, -8.5, 24, 3, 1.5);
    ctx.fill();

    // Optical tracking eye
    ctx.fillStyle = '#07121f';
    ctx.beginPath(); ctx.arc(0, 1, 7.6, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255, 200, 175, 0.35)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    const lookAng = Math.atan2(dy, dx);
    ctx.fillStyle = g.player.boost > 0 ? '#ffd166' : '#53f5d0';
    ctx.beginPath();
    ctx.arc(Math.cos(lookAng) * 2.4, 1 + Math.sin(lookAng) * 2.4, 3.1, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(Math.cos(lookAng) * 2.4 - 0.8, 0.2 + Math.sin(lookAng) * 2.4, 1.1, 0, TAU);
    ctx.fill();

    ctx.restore();
  });

  // Shockwave Rings
  g.rings.forEach(r => {
    const sy = r.y - g.camY;
    const a = clamp(r.life / r.max, 0, 1);
    ctx.save();
    ctx.globalAlpha = a * 0.78;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = r.lw * a;
    ctx.beginPath();
    ctx.arc(r.x, sy, r.r, 0, TAU);
    ctx.stroke();
    ctx.restore();
  });

  // Mixed Sparkle / Diamond / Ember Particles
  g.particles.forEach(p => {
    const sy = p.y - g.camY;
    if (sy < -24 || sy > H + 24) return;
    const a = clamp(p.life / p.max, 0, 1);
    const sz = p.size * (0.45 + 0.55 * a);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    if (p.shape === 'spark') {
      drawSparkle(p.x, sy, sz * 1.45);
    } else if (p.shape === 'diamond') {
      ctx.translate(p.x, sy);
      ctx.rotate(Math.PI / 4);
      ctx.fillRect(-sz * 0.7, -sz * 0.7, sz * 1.4, sz * 1.4);
    } else {
      ctx.beginPath();
      ctx.arc(p.x, sy, sz, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  });

  // Player Trail & High-Speed Afterimage Ghosts
  const pl = g.player;
  pl.trail.slice().reverse().forEach(tr => {
    ctx.save();
    ctx.globalAlpha = tr.a * 0.8;
    ctx.fillStyle = pl.boost > 0 ? '#ffd166' : '#53f5d0';
    ctx.beginPath();
    ctx.arc(tr.x, tr.y - g.camY, tr.r, 0, TAU);
    ctx.fill();
    ctx.restore();
  });

  g.ghosts.forEach(gh => {
    const a = (gh.life / gh.max) * 0.34;
    drawPlayerSprite(
      { ...pl, tilt: gh.tilt, face: gh.face, squash: gh.squash, boost: gh.boost ? 1 : 0, shield: 0 },
      gh.x, gh.y - g.camY, 0, a
    );
  });

  // Player (with seamless screen-wrap twin render + live Menu hop)
  const sx = pl.x + pl.w / 2;
  const sy = pl.y - g.camY + pl.h / 2;
  const idleBob = g.mode === MODES.MENU ? -Math.abs(Math.sin(ambientT * 0.065)) * 28 : 0;
  if (g.mode === MODES.MENU) updateScarf(pl, sx - pl.face * 7, pl.y + 25);
  drawPlayerSprite(pl, sx, sy, idleBob, 1);
  if (sx < 26) drawPlayerSprite(pl, sx + W, sy, idleBob, 1);
  if (sx > W - 26) drawPlayerSprite(pl, sx - W, sy, idleBob, 1);

  // Subtle Nova-Ready peripheral frame glow
  if (g.mode === MODES.PLAY && g.energy >= 100 && !reducedMotion()) {
    const pulse = 0.14 + 0.08 * Math.sin(ambientT * 0.16);
    const edgeG = ctx.createRadialGradient(W / 2, H / 2, W * 0.38, W / 2, H / 2, H * 0.62);
    edgeG.addColorStop(0, 'transparent');
    edgeG.addColorStop(1, `rgba(255, 209, 102, ${pulse})`);
    ctx.fillStyle = edgeG;
    ctx.fillRect(0, 0, W, H);
  }

  // First-run subtle movement cue
  if (g.mode === MODES.PLAY && g.hintAlpha > 0.02) {
    ctx.save();
    ctx.globalAlpha = g.hintAlpha * 0.82;
    ctx.fillStyle = '#dff6ff';
    ctx.font = '700 13px "Avenir Next", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(t().hintMove, W / 2, H - 120);
    ctx.restore();
  }

  // Floating Score Texts
  g.texts.forEach(tx => {
    const a = clamp(tx.life / tx.max, 0, 1);
    if (!a) return;
    const pop = tx.life > tx.max - 8 ? 1 + ((tx.max - tx.life) / 8) * 0.2 : 1;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(tx.x, tx.y - g.camY);
    ctx.scale(tx.scale * pop, tx.scale * pop);
    ctx.font = '800 15px "Avenir Next", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(4,12,22,0.82)';
    ctx.fillText(tx.text, 0, 1.8);
    ctx.fillStyle = tx.color;
    ctx.fillText(tx.text, 0, 0);
    ctx.restore();
  });

  // Brief impact flash
  if (g.flash > 0.01 && !reducedMotion()) {
    ctx.fillStyle = `rgba(255, 246, 214, ${g.flash * 0.32})`;
    ctx.fillRect(0, 0, W, H);
  }

  if (g.mode === MODES.PAUSE) {
    ctx.fillStyle = 'rgba(3, 9, 18, 0.36)';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.restore();
}

function syncHud() {
  const s = t();
  const energyPct = Math.round(game.energy);
  const ready = game.energy >= 100;

  dom.score.textContent = game.score;
  dom.best.textContent = bestScore;
  if (dom.alt) dom.alt.textContent = `${game.dist}m`;
  dom.combo.textContent = `x${game.combo}`;
  dom.combo.classList.toggle('hot', game.combo >= 3);

  dom.energyFill.style.width = `${energyPct}%`;
  dom.energyLabel.textContent = ready ? s.energyReady : `${energyPct}%`;
  if (dom.energyPanel) dom.energyPanel.classList.toggle('ready', ready);

  dom.mission.textContent = `${missionText(game.mission)} (${game.mission.progress}/${game.mission.target})`;
  if (dom.missionBar) {
    dom.missionBar.style.width = `${Math.round((game.mission.progress / game.mission.target) * 100)}%`;
  }
  if (dom.missionWrap) dom.missionWrap.hidden = game.mode === MODES.MENU;

  dom.banner.textContent = game.banner;
  dom.banner.classList.toggle('show', game.bannerTimer > 0 && game.mode === MODES.PLAY);

  const pauseIcon = game.mode === MODES.PLAY ? SVG_ICONS.pause : SVG_ICONS.play;
  if (lastPauseIcon !== pauseIcon) {
    dom.pauseBtn.innerHTML = pauseIcon;
    lastPauseIcon = pauseIcon;
  }
  dom.pauseBtn.setAttribute('aria-label', game.mode === MODES.PAUSE ? s.ariaResume : s.ariaPause);
  dom.pauseBtn.hidden = game.mode === MODES.MENU || game.mode === MODES.OVER;

  dom.novaBtn.hidden = game.mode !== MODES.PLAY;
  dom.mobileMoveControls.hidden = game.mode !== MODES.PLAY;

  dom.soundBtn.hidden = false;
  const soundIcon = soundEnabled ? SVG_ICONS.soundOn : SVG_ICONS.soundOff;
  if (lastSoundIcon !== soundIcon) {
    dom.soundBtn.innerHTML = soundIcon;
    lastSoundIcon = soundIcon;
  }
  dom.soundBtn.setAttribute('aria-pressed', String(soundEnabled));
  dom.soundBtn.setAttribute('aria-label', soundEnabled ? s.ariaMute : s.ariaUnmute);

  dom.novaBtn.disabled = game.mode !== MODES.PLAY || !ready;
  const novaHtml = `${SVG_ICONS.bolt}<span>${ready ? 'NOVA' : `${energyPct}%`}</span>`;
  if (lastNovaHtml !== novaHtml) {
    dom.novaBtn.innerHTML = novaHtml;
    lastNovaHtml = novaHtml;
  }
}

function updateOverlay() {
  const s = t();
  const isMenu = game.mode === MODES.MENU;
  const isPlay = game.mode === MODES.PLAY;
  const isPause = game.mode === MODES.PAUSE;

  dom.overlayMenuBtn.hidden = isMenu || isPlay;
  if (dom.secondaryActions) dom.secondaryActions.hidden = isMenu || isPlay;
  if (dom.overlayRestartBtn) dom.overlayRestartBtn.hidden = !isPause;

  if (isPlay) {
    dom.overlay.style.display = 'none';
    return;
  }

  dom.overlay.style.display = 'flex';
  if (dom.logoWrap) dom.logoWrap.hidden = !isMenu;
  if (dom.menuGuide) dom.menuGuide.hidden = !isMenu;
  dom.overlayTitle.classList.toggle('sr-brand', isMenu);
  if (dom.newBestBanner) {
    dom.newBestBanner.hidden = !(game.mode === MODES.OVER && game.beatBestInRun);
    dom.newBestBanner.textContent = s.newBest;
  }

  if (isMenu) {
    dom.overlayKicker.textContent = s.brand;
    dom.overlayTitle.textContent = 'UPJUMP';
    dom.overlayLead.textContent = s.menuLead;
    dom.playBtn.textContent = s.play;
    dom.overlayStats.innerHTML = statsHtml([
      [bestScore, s.best],
      [`${bestAlt}m`, s.altitude],
      [totalRuns, lang === 'tr' ? 'Tur' : 'Runs'],
    ]);
  } else if (isPause) {
    dom.overlayKicker.textContent = s.pausedKicker;
    dom.overlayTitle.textContent = s.paused;
    dom.overlayLead.textContent = s.pausedLead;
    dom.playBtn.textContent = s.resume;
    dom.overlayStats.innerHTML = statsHtml([
      [game.score, s.score],
      [`${Math.round(game.energy)}%`, 'Nova'],
      [`x${game.combo}`, s.combo],
    ]);
  } else {
    dom.overlayKicker.textContent = game.endReason === 'drone' ? s.overDrone : s.overFall;
    dom.overlayTitle.textContent = s.overTitle;
    dom.overlayLead.textContent = s.overLead;
    dom.playBtn.textContent = s.tryAgain;
    dom.overlayStats.innerHTML = statsHtml([
      [game.score, s.score],
      [bestScore, s.best],
      [`${game.dist}m`, s.altitude],
    ]);
  }
}

// High-DPI Canvas & Responsive Portal Fit
function fit() {
  const vw = window.innerWidth || W;
  const vh = window.innerHeight || H;
  const isCompact = vw <= 540;
  const pad = isCompact ? 0 : 20;
  const scale = isCompact
    ? Math.min(vw / W, vh / H)
    : clamp(Math.min((vw - pad) / W, (vh - pad) / H), 0.35, 2.2);

  dom.wrapper.style.width = `${Math.round(W * scale)}px`;
  dom.wrapper.style.height = `${Math.round(H * scale)}px`;

  dpr = clamp((window && window.devicePixelRatio) || 1, 1, 2.5);
  const targetW = Math.round(W * dpr);
  const targetH = Math.round(H * dpr);
  if (canvas.width !== targetW || canvas.height !== targetH) {
    canvas.width = targetW;
    canvas.height = targetH;
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  if (dom.fullscreenBtn) {
    const canFs = !!(document && (document.fullscreenEnabled || dom.wrapper.requestFullscreen));
    dom.fullscreenBtn.hidden = !canFs;
  }
}

function render() {
  drawGame(game);
  syncHud();
}

function resetControls() {
  input.left = false;
  input.right = false;
  input.pointerX = null;
  input.boost = false;
}

function startGame() {
  resetControls();
  totalRuns += 1;
  safeStorage.set('upjump-runs', totalRuns);
  game = createGame(MODES.PLAY);
  acc = 0;
  portal.gameplayStart();
  render();
  updateOverlay();
}

function openMenu() {
  resetControls();
  portal.gameplayStop();
  game = createGame(MODES.MENU);
  acc = 0;
  render();
  updateOverlay();
}

function primaryAction() {
  if (game.mode === MODES.MENU || game.mode === MODES.OVER) {
    startGame();
  } else if (game.mode === MODES.PAUSE) {
    game.mode = MODES.PLAY;
    acc = 0;
    portal.gameplayStart();
    updateOverlay();
    render();
  }
}

function togglePause() {
  if (game.mode === MODES.PLAY) {
    game.mode = MODES.PAUSE;
    resetControls();
    portal.gameplayStop();
  } else if (game.mode === MODES.PAUSE) {
    game.mode = MODES.PLAY;
    acc = 0;
    portal.gameplayStart();
  } else return;
  updateOverlay();
  render();
}

async function toggleFullscreen() {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else if (dom.wrapper.requestFullscreen) await dom.wrapper.requestFullscreen();
  } catch {}
}

function step(frames = 1) {
  for (let i = 0; i < frames; i++) updateGame(game);
  render();
}

function loop(ts) {
  if (!last) last = ts;
  const elapsed = Math.max(0, Math.min(100, ts - last));
  last = ts;
  ambientT += elapsed / STEP;

  if (game.mode === MODES.PLAY) {
    acc += elapsed;
    let steps = 0;
    while (acc >= STEP && steps < 6 && game.mode === MODES.PLAY) {
      updateGame(game);
      acc -= STEP;
      steps++;
    }
    if (steps === 6 && acc >= STEP) acc = STEP * 0.5;
  } else {
    acc = 0;
  }

  render();
  rafId = requestAnimationFrame(loop);
}

// Keyboard Controls (Arrows + WASD + Space/Shift/Up + M/P/Esc/F/R)
document.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { input.left = true; e.preventDefault(); }
  if (k === 'ArrowRight' || k === 'd' || k === 'D') { input.right = true; e.preventDefault(); }
  if (k === 'ArrowUp' || k === 'ArrowDown') e.preventDefault();

  if ((e.code === 'Space' || k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W' || k === 'Shift') && !e.repeat) {
    e.preventDefault();
    if (game.mode === MODES.PLAY) {
      unlockAudio();
      input.boost = true;
    } else if ((e.code === 'Space' || k === ' ') && (game.mode === MODES.MENU || (game.mode === MODES.OVER && Date.now() - lastDeathMs > 350))) {
      unlockAudio();
      primaryAction();
    }
  }
  if (k === 'Enter' && !e.repeat) {
    unlockAudio();
    primaryAction();
  }
  if ((k === 'p' || k === 'P' || k === 'Escape') && !e.repeat) togglePause();
  if ((k === 'm' || k === 'M') && !e.repeat) toggleSound();
  if ((k === 'f' || k === 'F') && !e.repeat) toggleFullscreen();
  if ((k === 'r' || k === 'R') && !e.repeat && (game.mode === MODES.OVER || game.mode === MODES.PAUSE)) {
    unlockAudio();
    startGame();
  }
});

document.addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') input.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') input.right = false;
});

// Pointer & Touch Steering
function setPointer(e) {
  const p = e.touches ? e.touches[0] : e;
  if (p) input.pointerX = p.clientX;
}

let steeringPointerId = null;
canvas.addEventListener('pointerdown', e => {
  if (game.mode !== MODES.PLAY || steeringPointerId !== null) return;
  unlockAudio();
  steeringPointerId = e.pointerId;
  setPointer(e);
  try { canvas.setPointerCapture(e.pointerId); } catch {}
});
canvas.addEventListener('pointermove', e => {
  if (steeringPointerId === e.pointerId && game.mode === MODES.PLAY) setPointer(e);
});
function endSteering(e) {
  if (steeringPointerId !== e.pointerId) return;
  steeringPointerId = null;
  input.pointerX = null;
  try { if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId); } catch {}
}
canvas.addEventListener('pointerup', endSteering);
canvas.addEventListener('pointercancel', endSteering);
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('touchstart', e => {
  if (game.mode === MODES.PLAY) { e.preventDefault(); unlockAudio(); setPointer(e); }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  if (game.mode === MODES.PLAY) { e.preventDefault(); setPointer(e); }
}, { passive: false });
canvas.addEventListener('touchend', () => { input.pointerX = null; }, { passive: true });
canvas.addEventListener('touchcancel', () => { input.pointerX = null; }, { passive: true });

// Auto-Pause on Tab Hidden / Focus Lost
function onFocusLost() {
  if (game && game.mode === MODES.PLAY) togglePause();
  resetControls();
  steeringPointerId = null;
  suspendAudio();
}
window.addEventListener('blur', onFocusLost);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) onFocusLost();
});

// Touch Controls Binding
dom.novaBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  e.stopPropagation();
  unlockAudio();
  if (game.mode === MODES.PLAY && game.energy >= 100) input.boost = true;
});
dom.novaBtn.addEventListener('click', e => {
  e.preventDefault();
  e.stopPropagation();
  unlockAudio();
  if (game.mode === MODES.PLAY && game.energy >= 100) input.boost = true;
});

function bindMobileMove(button, direction) {
  let activePointer = null;
  button.addEventListener('pointerdown', e => {
    if (game.mode !== MODES.PLAY) return;
    e.preventDefault();
    e.stopPropagation();
    unlockAudio();
    activePointer = e.pointerId;
    input[direction] = true;
    button.classList.add('pressed');
    try { button.setPointerCapture(e.pointerId); } catch {}
  });
  const release = e => {
    if (activePointer !== e.pointerId) return;
    input[direction] = false;
    activePointer = null;
    button.classList.remove('pressed');
  };
  button.addEventListener('pointerup', release);
  button.addEventListener('pointercancel', release);
  button.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('blur', () => {
    input[direction] = false;
    activePointer = null;
    button.classList.remove('pressed');
  });
}
bindMobileMove(dom.mobileLeftBtn, 'left');
bindMobileMove(dom.mobileRightBtn, 'right');

// UI Buttons
dom.soundBtn.addEventListener('click', toggleSound);
if (dom.fullscreenBtn) dom.fullscreenBtn.addEventListener('click', toggleFullscreen);
dom.overlayMenuBtn.addEventListener('click', openMenu);
if (dom.overlayRestartBtn) dom.overlayRestartBtn.addEventListener('click', () => { unlockAudio(); startGame(); });
dom.playBtn.addEventListener('click', () => { unlockAudio(); primaryAction(); });
dom.pauseBtn.addEventListener('click', togglePause);
if (dom.langEnBtn) dom.langEnBtn.addEventListener('click', () => setLang('en'));
if (dom.langTrBtn) dom.langTrBtn.addEventListener('click', () => setLang('tr'));

window.addEventListener('resize', fit);
document.addEventListener('fullscreenchange', fit);

// QA & Telemetry Inspection Hook
window.render_game_to_text = () => JSON.stringify({
  mode: game.mode,
  lang,
  portal: portal.sdkName(),
  biome: getBiomeState(game.dist).name,
  coordinates: 'origin top-left; x right; y down; screenY = worldY - camY',
  player: {
    x: Math.round(game.player.x),
    y: Math.round(game.player.y),
    screenY: Math.round(game.player.y - game.camY),
    vx: +game.player.vx.toFixed(2),
    vy: +game.player.vy.toFixed(2),
    boost: game.player.boost,
    shield: game.player.shield,
  },
  hud: {
    score: game.score,
    best: bestScore,
    altitude: game.dist,
    combo: game.combo,
    energy: Math.round(game.energy),
    mission: `${missionText(game.mission)} (${game.mission.progress}/${game.mission.target})`,
  },
  platforms: game.platforms.filter(p => p.y - game.camY > -40 && p.y - game.camY < H + 40).slice(0, 12).map(p => ({
    type: p.type, x: Math.round(p.x), y: Math.round(p.y), screenY: Math.round(p.y - game.camY), solid: solid(p),
  })),
  pickups: game.stars.filter(s => s.y - game.camY > -40 && s.y - game.camY < H + 40).slice(0, 8).map(s => ({
    kind: s.kind, x: Math.round(s.x), y: Math.round(s.y), screenY: Math.round(s.y - game.camY),
  })),
  hazards: game.drones.filter(d => d.y - game.camY > -60 && d.y - game.camY < H + 40).slice(0, 6).map(d => ({
    x: Math.round(d.x), y: Math.round(d.y), screenY: Math.round(d.y - game.camY),
  })),
  overlay: {
    visible: dom.overlay.style.display !== 'none',
    title: dom.overlayTitle.textContent,
    button: dom.playBtn.textContent,
  },
});
window.advanceTime = ms => step(Math.max(1, Math.round(ms / STEP)));
window.startGame = startGame;

syncStaticLabels();
fit();
openMenu();
portal.loadingFinished();
rafId = requestAnimationFrame(loop);
</script>
</body>
</html>
