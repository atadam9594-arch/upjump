<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="UpJump — Brego Games Originals. Collect stars, climb atmospheric biomes, chain combos, and unleash Nova Dash on mobile and desktop.">
<meta name="theme-color" content="#07121f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="brego-release" content="upjump-portal-visual-20261123-r3">

<meta property="og:description" content="Collect stars, climb atmospheric biomes, chain combos, and unleash Nova Dash. Play instantly on mobile and desktop.">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2353f5d0'/%3E%3Cstop offset='1' stop-color='%23ffd166'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%2307121f'/%3E%3Ccircle cx='32' cy='31' r='16' fill='url(%23g)'/%3E%3Crect x='23' y='24' width='18' height='9' rx='4.5' fill='%2307121f'/%3E%3Ccircle cx='28' cy='28.5' r='2' fill='%23eff8ff'/%3E%3Ccircle cx='36' cy='28.5' r='2' fill='%23eff8ff'/%3E%3Crect x='18' y='50' width='28' height='6' rx='3' fill='%2353f5d0'/%3E%3C/svg%3E">
<title>UpJump — Brego Games Originals</title>
<style>
  :root {
    --bg: #06101c;
    --surface: rgba(7, 18, 32, 0.72);
    --surface-strong: rgba(7, 17, 30, 0.90);
    --line: rgba(255, 255, 255, 0.11);
    --line-strong: rgba(255, 255, 255, 0.20);
    --ink: #f2f9ff;
    --muted: #98b4ca;
    --teal: #53f5d0;
    --sky: #7cc7ff;
    --coral: #ff8a65;
    --gold: #ffd166;
    --font-ui: 'Avenir Next', 'Segoe UI', 'Trebuchet MS', system-ui, -apple-system, sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    background: #030812;
    color: var(--ink);
    font-family: var(--font-ui);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse 58% 46% at 16% 18%, rgba(83, 245, 208, 0.13), transparent 64%),
      radial-gradient(ellipse 50% 42% at 86% 20%, rgba(255, 138, 101, 0.11), transparent 64%),
      radial-gradient(ellipse 75% 54% at 50% 100%, rgba(16, 46, 78, 0.60), transparent 72%),
      linear-gradient(180deg, #02060f 0%, #071323 50%, #040b16 100%);
  }

  #gameWrapper {
    position: relative;
    width: 400px;
    height: 640px;
    overflow: hidden;
    border-radius: 26px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow:
      0 34px 100px rgba(0, 0, 0, 0.62),
      0 0 0 1px rgba(83, 245, 208, 0.08),
      inset 0 1px 0 rgba(255, 255, 255, 0.10);
    background: var(--bg);
    contain: layout paint;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: var(--bg);
    touch-action: none;
  }

  [hidden] {
    display: none !important;
  }

  /* HUD Layer */
  #hud, #overlay {
    position: absolute;
    inset: 0;
  }

  #hud {
    z-index: 10;
    pointer-events: none;
  }

  .hud-top {
    position: absolute;
    top: max(12px, env(safe-area-inset-top));
    left: 12px;
    right: 12px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }

  .score-block {
    background: linear-gradient(180deg, rgba(11, 27, 46, 0.80) 0%, rgba(6, 16, 29, 0.72) 100%);
    border: 1px solid var(--line);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 14px;
    padding: 8px 13px 9px;
    min-width: 132px;
  }

  .score-main {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  #scoreDisplay {
    font-size: 27px;
    line-height: 1;
    font-weight: 800;
    letter-spacing: -0.025em;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    text-shadow: 0 2px 10px rgba(83, 245, 208, 0.18);
  }

  #comboDisplay {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    transition: transform 0.14s cubic-bezier(0.16, 1, 0.3, 1), color 0.14s ease;
  }

  #comboDisplay.hot {
    color: var(--gold);
    transform: scale(1.14);
    text-shadow: 0 0 12px rgba(255, 209, 102, 0.45);
  }

  .score-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .score-meta strong {
    color: #d9eefc;
    font-weight: 700;
  }

  .hud-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    pointer-events: auto;
  }

  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(13, 30, 50, 0.82) 0%, rgba(7, 18, 32, 0.76) 100%);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.26), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.12s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.14s ease, border-color 0.14s ease;
    touch-action: manipulation;
  }

  .icon-btn svg {
    width: 18px;
    height: 18px;
    display: block;
    pointer-events: none;
  }

  .icon-btn:hover {
    background: rgba(20, 44, 70, 0.92);
    border-color: var(--line-strong);
  }

  .icon-btn:active {
    transform: scale(0.92);
  }

  .icon-btn:focus-visible,
  #novaBtn:focus-visible,
  #playBtn:focus-visible,
  #overlayRestartBtn:focus-visible,
  #overlayMenuBtn:focus-visible,
  #mobileMoveControls button:focus-visible,
  .lang-btn:focus-visible {
    outline: 2.5px solid var(--gold);
    outline-offset: 2px;
  }

  /* Slim Energy Bar */
  #energyPanel {
    position: absolute;
    left: 12px;
    right: 12px;
    top: calc(max(12px, env(safe-area-inset-top)) + 66px);
    background: linear-gradient(180deg, rgba(10, 24, 42, 0.76) 0%, rgba(6, 15, 27, 0.68) 100%);
    border: 1px solid var(--line);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 12px;
    padding: 6px 11px 8px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  #energyPanel.ready {
    border-color: rgba(255, 209, 102, 0.72);
    box-shadow: 0 0 24px rgba(255, 209, 102, 0.28), inset 0 1px 0 rgba(255, 240, 190, 0.22);
  }

  .energy-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 5px;
    font-variant-numeric: tabular-nums;
  }

  #energyPanel.ready .energy-row {
    color: var(--gold);
  }

  .track {
    position: relative;
    width: 100%;
    height: 8px;
    border-radius: 6px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.09);
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.45);
  }

  #energyFill {
    width: 0%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #32dfb9 0%, #86ffd8 58%, var(--gold) 100%);
    box-shadow: 0 0 14px rgba(83, 245, 208, 0.45);
    transition: width 0.1s linear;
  }

  #energyPanel.ready #energyFill {
    background: linear-gradient(90deg, #ffe99c 0%, var(--gold) 52%, #ff9364 100%);
    box-shadow: 0 0 16px rgba(255, 209, 102, 0.65);
  }

  /* Dynamic Event Banner */
  #banner {
    position: absolute;
    left: 50%;
    top: calc(max(12px, env(safe-area-inset-top)) + 116px);
    transform: translate(-50%, -6px) scale(0.95);
    padding: 6px 15px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: #05131f;
    background: linear-gradient(135deg, #62ffe0 0%, #fff0a8 52%, var(--gold) 100%);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.38), 0 0 20px rgba(83, 245, 208, 0.25);
    opacity: 0;
    white-space: nowrap;
    transition: opacity 0.16s ease, transform 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  }

  #banner.show {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }

  /* Subtle Bottom Mission Strip */
  #missionWrap {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: max(10px, env(safe-area-inset-bottom));
    background: rgba(6, 16, 28, 0.66);
    border: 1px solid rgba(255, 255, 255, 0.09);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 10px;
    padding: 6px 11px 7px;
  }

  #missionPill {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: #d9f0ff;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
  }

  .mission-track {
    margin-top: 5px;
    width: 100%;
    height: 3px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.09);
    overflow: hidden;
  }

  #missionBar {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, var(--teal), var(--gold));
    transition: width 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* Mobile & Touch Controls */
  #novaBtn {
    display: none;
    position: absolute;
    right: 14px;
    bottom: calc(max(10px, env(safe-area-inset-bottom)) + 52px);
    z-index: 12;
    min-width: 102px;
    height: 58px;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0 14px;
    border-radius: 16px;
    border: 1.5px solid rgba(255, 236, 176, 0.9);
    color: #061816;
    background: linear-gradient(135deg, #5efbe0 0%, #fff0a8 52%, var(--gold) 100%);
    font: 900 14px var(--font-ui);
    letter-spacing: 0.05em;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.44), 0 0 22px rgba(255, 209, 102, 0.32);
    touch-action: manipulation;
    cursor: pointer;
    pointer-events: auto;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    transition: transform 0.12s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.16s ease;
  }

  #novaBtn svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  #novaBtn:active:not(:disabled) {
    transform: scale(0.94);
  }

  #novaBtn:disabled {
    opacity: 0.56;
    border-color: rgba(124, 199, 255, 0.26);
    background: rgba(14, 33, 50, 0.84);
    color: #b7d2e2;
    box-shadow: none;
    cursor: default;
  }

  #mobileMoveControls {
    position: absolute;
    left: 14px;
    bottom: calc(max(10px, env(safe-area-inset-bottom)) + 52px);
    z-index: 12;
    gap: 10px;
    display: none;
    pointer-events: auto;
  }

  #mobileMoveControls button {
    width: 60px;
    height: 58px;
    border: 1.5px solid rgba(83, 245, 208, 0.44);
    border-radius: 16px;
    color: #ecffff;
    background: linear-gradient(180deg, rgba(14, 38, 56, 0.82) 0%, rgba(8, 23, 37, 0.82) 100%);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    touch-action: none;
    transition: transform 0.08s ease, background-color 0.1s ease, border-color 0.1s ease;
  }

  #mobileMoveControls button svg {
    width: 24px;
    height: 24px;
    pointer-events: none;
  }

  #mobileMoveControls button:active,
  #mobileMoveControls button.pressed {
    background: rgba(34, 108, 114, 0.94);
    border-color: var(--teal);
    transform: scale(0.94);
  }

  @media (pointer: coarse), (max-width: 540px) {
    #novaBtn:not([hidden]) {
      display: flex;
    }
    #mobileMoveControls:not([hidden]) {
      display: flex;
    }
    .icon-btn {
      width: 44px;
      height: 44px;
    }
  }

  @media (pointer: fine) and (min-width: 541px) {
    #novaBtn:not([hidden]):not(:disabled) {
      display: flex;
      height: 46px;
      min-width: 116px;
      bottom: 54px;
    }
  }

  /* Overlay Layer */
  #overlay {
    z-index: 20;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: radial-gradient(circle at 50% 42%, rgba(8, 22, 38, 0.45), rgba(3, 8, 17, 0.72));
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
  }

  .overlay-card {
    position: relative;
    width: min(100%, 334px);
    border-radius: 22px;
    padding: 18px 20px 20px;
    text-align: center;
    background: linear-gradient(180deg, rgba(11, 25, 43, 0.92) 0%, rgba(6, 15, 28, 0.94) 100%);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow:
      0 26px 70px rgba(0, 0, 0, 0.56),
      inset 0 1px 0 rgba(255, 255, 255, 0.14);
  }

  .overlay-card::before {
    content: '';
    position: absolute;
    top: -1px;
    left: 24px;
    right: 24px;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(83, 245, 208, 0.85), rgba(255, 209, 102, 0.85), transparent);
    pointer-events: none;
  }

  .overlay-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .brand-kicker {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--teal);
    text-align: left;
  }

  .lang-switch {
    display: inline-flex;
    padding: 2px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.10);
    gap: 2px;
  }

  .lang-btn {
    border: 0;
    background: transparent;
    color: var(--muted);
    font: 700 11px var(--font-ui);
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.14s ease, color 0.14s ease;
    white-space: nowrap;
  }

  .lang-btn.active {
    background: rgba(83, 245, 208, 0.22);
    color: var(--ink);
  }

  .logo-wrap {
    margin: 2px auto 10px;
    display: flex;
    justify-content: center;
  }

  .logo-svg {
    width: 236px;
    height: 54px;
    display: block;
    filter: drop-shadow(0 6px 18px rgba(83, 245, 208, 0.22));
  }

  #overlayTitle {
    font-size: 30px;
    line-height: 1.08;
    font-weight: 900;
    letter-spacing: 0.03em;
    margin-bottom: 8px;
    color: var(--ink);
    text-wrap: balance;
  }

  #overlayTitle.sr-brand {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  #newBestBanner {
    margin: 0 auto 10px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.1em;
    color: var(--gold);
    text-shadow: 0 0 14px rgba(255, 209, 102, 0.45);
  }

  #overlayLead {
    color: #cadff0;
    font-size: 13.5px;
    line-height: 1.5;
    margin-bottom: 16px;
  }

  /* Clean hairline-divided stats row */
  #overlayStats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 12px 0;
    margin-bottom: 16px;
  }

  .stat-cell {
    padding: 0 6px;
  }

  .stat-cell + .stat-cell {
    border-left: 1px solid var(--line);
  }

  .stat-cell strong {
    display: block;
    font-size: 19px;
    line-height: 1.1;
    font-weight: 800;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    margin-bottom: 4px;
  }

  .stat-cell span {
    display: block;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  /* Visual Guide on Menu */
  #menuGuide {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 16px;
    text-align: center;
  }

  .guide-item {
    font-size: 11px;
    line-height: 1.35;
    color: #c8def0;
  }

  .guide-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    margin: 0 auto 5px;
  }

  #playBtn {
    width: 100%;
    border: 0;
    border-radius: 14px;
    padding: 14px 18px;
    cursor: pointer;
    color: #05131f;
    font: 900 17px var(--font-ui);
    letter-spacing: 0.08em;
    background: linear-gradient(135deg, #5afbe0 0%, #b5ffe4 46%, var(--gold) 100%);
    box-shadow: 0 12px 30px rgba(83, 245, 208, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.55);
    transition: transform 0.14s cubic-bezier(0.16, 1, 0.3, 1), filter 0.14s ease;
    white-space: nowrap;
  }

  #playBtn:hover {
    filter: brightness(1.07);
  }

  #playBtn:active {
    transform: scale(0.97);
  }

  .secondary-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .secondary-btn {
    flex: 1;
    padding: 11px 12px;
    border-radius: 12px;
    border: 1px solid var(--line-strong);
    background: rgba(20, 44, 68, 0.76);
    color: #e6f6ff;
    font: 700 13px var(--font-ui);
    cursor: pointer;
    white-space: nowrap;
    transition: background-color 0.14s ease, transform 0.12s ease;
  }

  .secondary-btn:hover {
    background: rgba(30, 62, 92, 0.90);
  }

  .secondary-btn:active {
    transform: scale(0.97);
  }

  .controls {
    margin-top: 14px;
    font-size: 11.5px;
    line-height: 1.55;
    color: var(--muted);
  }

  @media (max-width: 540px) {
    #gameWrapper {
      border-radius: 0;
      border: 0;
      box-shadow: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<div id="gameWrapper">
  <canvas id="gameCanvas" width="400" height="640" aria-label="UpJump"></canvas>

  <div id="hud">
    <div class="hud-top">
      <div class="score-block">
        <div class="score-main">
          <strong id="scoreDisplay">0</strong>
          <span id="comboDisplay">x0</span>
        </div>
        <div class="score-meta">
          <span id="bestLabel">En iyi</span> <strong id="bestDisplay">0</strong>
          <span aria-hidden="true">·</span>
          <span id="altDisplay">0m</span>
        </div>
      </div>
      <div class="hud-actions">
        <button id="soundBtn" class="icon-btn" type="button" aria-label="Sesi kapat" aria-pressed="true"></button>
        <button id="fullscreenBtn" class="icon-btn" type="button" aria-label="Tam ekran">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
        <button id="pauseBtn" class="icon-btn" type="button" aria-label="Oyunu duraklat"></button>
      </div>
    </div>

    <div id="energyPanel">
      <div class="energy-row">
        <span id="energyTitle">Nova Enerjisi</span>
        <span id="energyLabel">0%</span>
      </div>

const PENTATONIC = [330, 370, 415, 494, 554, 659, 740, 831, 988];

function audioActive() { return soundEnabled && !portalMuted; }

}

function suspendAudio() {

}

function playTone(freq, duration = 0.09, shape = 'sine', volume = 0.024, endFreq = null, delay = 0) {
  if (!audioActive()) return;
  try {
    unlockAudio();
    if (!audioContext || audioContext.state === 'closed') return;
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    const t0 = audioContext.currentTime + delay;
    osc.type = shape;
    osc.frequency.setValueAtTime(freq, t0);
    if (endFreq != null) osc.frequency.exponentialRampToValueAtTime(Math.max(40, endFreq), t0 + duration);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.002, volume), t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
    osc.onended = () => { osc.disconnect(); gain.disconnect(); };
  } catch {}
}

function playNoise(duration = 0.09, volume = 0.024, filterFreq = 900) {
  if (!audioActive()) return;
  try {
    unlockAudio();
    if (!audioContext || !noiseBuffer || audioContext.state === 'closed') return;
    const src = audioContext.createBufferSource();
    src.buffer = noiseBuffer;
    const filter = audioContext.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = filterFreq;
    const gain = audioContext.createGain();
    const t0 = audioContext.currentTime;
    gain.gain.setValueAtTime(volume, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    src.connect(filter);
    filter.connect(gain);
    gain.connect(audioContext.destination);
    src.start(t0);
    src.stop(t0 + duration + 0.01);
    src.onended = () => { src.disconnect(); filter.disconnect(); gain.disconnect(); };
  } catch {}
}

function setLang(next) {
