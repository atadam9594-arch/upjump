<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="UpJump — Brego Games Originals. Collect stars, climb atmospheric biomes, chain combos, and unleash Nova Dash on mobile and desktop.">
<meta name="theme-color" content="#07121f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="brego-release" content="upjump-portal-ready-20261123-r2">
<meta property="og:title" content="UpJump — Brego Games Originals">
<meta property="og:description" content="Collect stars, climb atmospheric biomes, chain combos, and unleash Nova Dash. Play instantly on mobile and desktop.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="UpJump — Brego Games Originals">
<meta name="twitter:description" content="Vertical arcade climber with Nova Dash, dynamic biomes, and instant mobile + desktop controls.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2353f5d0'/%3E%3Cstop offset='1' stop-color='%23ffd166'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%2307121f'/%3E%3Ccircle cx='32' cy='31' r='16' fill='url(%23g)'/%3E%3Crect x='23' y='24' width='18' height='9' rx='4.5' fill='%2307121f'/%3E%3Ccircle cx='28' cy='28.5' r='2' fill='%23eff8ff'/%3E%3Ccircle cx='36' cy='28.5' r='2' fill='%23eff8ff'/%3E%3Crect x='18' y='50' width='28' height='6' rx='3' fill='%2353f5d0'/%3E%3C/svg%3E">
<title>UpJump — Brego Games Originals</title>
<style>
  :root {
    --bg: #07121f;
    --surface: rgba(8, 19, 34, 0.78);
    --surface-strong: rgba(7, 17, 30, 0.90);
    --line: rgba(255, 255, 255, 0.11);
    --line-strong: rgba(255, 255, 255, 0.18);
    --ink: #f0f8ff;
    --muted: #98b2c7;
    --teal: #53f5d0;
    --sky: #7cc7ff;
    --coral: #ff8f6b;
    --gold: #ffd166;
    --font-ui: 'Avenir Next', 'Segoe UI', 'Trebuchet MS', system-ui, -apple-system, sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    background: #040914;
    color: var(--ink);
    font-family: var(--font-ui);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse 55% 45% at 18% 16%, rgba(83, 245, 208, 0.12), transparent 65%),
      radial-gradient(ellipse 50% 42% at 84% 18%, rgba(255, 143, 107, 0.10), transparent 65%),
      radial-gradient(ellipse 70% 50% at 50% 100%, rgba(18, 44, 74, 0.55), transparent 70%),
      linear-gradient(180deg, #030711 0%, #071322 50%, #050d18 100%);
  }

  #gameWrapper {
    position: relative;
    width: 400px;
    height: 640px;
    overflow: hidden;
    border-radius: 24px;
    border: 1px solid var(--line);
    box-shadow:
      0 32px 96px rgba(0, 0, 0, 0.58),
      0 0 0 1px rgba(255, 255, 255, 0.04) inset;
    background: var(--bg);
    contain: layout paint;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: var(--bg);
    touch-action: none;
  }

  [hidden] {
    display: none !important;
  }

  /* HUD Layer */
  #hud, #overlay {
    position: absolute;
    inset: 0;
  }

  #hud {
    z-index: 10;
    pointer-events: none;
  }

  .hud-top {
    position: absolute;
    top: max(12px, env(safe-area-inset-top));
    left: 12px;
    right: 12px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }

  .score-block {
    background: var(--surface);
    border: 1px solid var(--line);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 14px;
    padding: 8px 13px 9px;
    min-width: 128px;
  }

  .score-main {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  #scoreDisplay {
    font-size: 26px;
    line-height: 1;
    font-weight: 800;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }

  #comboDisplay {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    transition: transform 0.14s cubic-bezier(0.16, 1, 0.3, 1), color 0.14s ease;
  }

  #comboDisplay.hot {
    color: var(--gold);
    transform: scale(1.12);
  }

  .score-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .score-meta strong {
    color: #d6eaf8;
    font-weight: 700;
  }

  .hud-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    pointer-events: auto;
  }

  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font: 700 15px var(--font-ui);
    cursor: pointer;
    transition: transform 0.12s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.14s ease, border-color 0.14s ease;
    touch-action: manipulation;
  }

  .icon-btn:hover {
    background: rgba(18, 40, 64, 0.88);
    border-color: var(--line-strong);
  }

  .icon-btn:active {
    transform: scale(0.93);
  }

  .icon-btn:focus-visible,
  #novaBtn:focus-visible,
  #playBtn:focus-visible,
  #overlayRestartBtn:focus-visible,
  #overlayMenuBtn:focus-visible,
  #mobileMoveControls button:focus-visible,
  .lang-btn:focus-visible {
    outline: 2.5px solid var(--gold);
    outline-offset: 2px;
  }

  /* Slim Energy Bar */
  #energyPanel {
    position: absolute;
    left: 12px;
    right: 12px;
    top: calc(max(12px, env(safe-area-inset-top)) + 64px);
    background: var(--surface);
    border: 1px solid var(--line);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 12px;
    padding: 6px 10px 8px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  #energyPanel.ready {
    border-color: rgba(255, 209, 102, 0.65);
    box-shadow: 0 0 22px rgba(255, 209, 102, 0.22);
  }

  .energy-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 5px;
    font-variant-numeric: tabular-nums;
  }

  #energyPanel.ready .energy-row {
    color: var(--gold);
  }

  .track {
    width: 100%;
    height: 8px;
    border-radius: 6px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.09);
  }

  #energyFill {
    width: 0%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--teal) 0%, #86ffd1 58%, var(--gold) 100%);
    transition: width 0.1s linear;
  }

  #energyPanel.ready #energyFill {
    background: linear-gradient(90deg, #ffe28a 0%, var(--gold) 50%, #ff9d6c 100%);
  }

  /* Dynamic Event Banner */
  #banner {
    position: absolute;
    left: 50%;
    top: calc(max(12px, env(safe-area-inset-top)) + 114px);
    transform: translate(-50%, -6px) scale(0.96);
    padding: 6px 14px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: #061420;
    background: linear-gradient(135deg, var(--teal), var(--gold));
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    opacity: 0;
    white-space: nowrap;
    transition: opacity 0.16s ease, transform 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  }

  #banner.show {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }

  /* Subtle Bottom Mission Strip */
  #missionWrap {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: max(10px, env(safe-area-inset-bottom));
    background: rgba(6, 16, 28, 0.68);
    border: 1px solid rgba(255, 255, 255, 0.09);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 10px;
    padding: 6px 11px 7px;
  }

  #missionPill {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: #d7eefc;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
  }

  .mission-track {
    margin-top: 5px;
    width: 100%;
    height: 3px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.09);
    overflow: hidden;
  }

  #missionBar {
    width: 0%;
    height: 100%;
    background: var(--teal);
    transition: width 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* Mobile & Touch Controls */
  #novaBtn {
    display: none;
    position: absolute;
    right: 14px;
    bottom: calc(max(10px, env(safe-area-inset-bottom)) + 52px);
    z-index: 12;
    min-width: 96px;
    height: 58px;
    align-items: center;
    justify-content: center;
    padding: 0 14px;
    border-radius: 16px;
    border: 2px solid rgba(255, 232, 163, 0.85);
    color: #061816;
    background: linear-gradient(135deg, var(--teal), var(--gold));
    font: 800 14px var(--font-ui);
    letter-spacing: 0.04em;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.42);
    touch-action: manipulation;
    cursor: pointer;
    pointer-events: auto;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    transition: transform 0.12s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.16s ease;
  }

  #novaBtn:active:not(:disabled) {
    transform: scale(0.94);
  }

  #novaBtn:disabled {
    opacity: 0.52;
    border-color: rgba(124, 199, 255, 0.28);
    background: rgba(16, 36, 52, 0.84);
    color: #b7d2e2;
    box-shadow: none;
    cursor: default;
  }

  #mobileMoveControls {
    position: absolute;
    left: 14px;
    bottom: calc(max(10px, env(safe-area-inset-bottom)) + 52px);
    z-index: 12;
    gap: 10px;
    display: none;
    pointer-events: auto;
  }

  #mobileMoveControls button {
    width: 60px;
    height: 58px;
    border: 1.5px solid rgba(83, 245, 208, 0.48);
    border-radius: 16px;
    color: #ecffff;
    background: rgba(10, 30, 46, 0.78);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    font: 800 22px system-ui, sans-serif;
    cursor: pointer;
    user-select: none;
    touch-action: none;
    transition: transform 0.08s ease, background-color 0.1s ease, border-color 0.1s ease;
  }

  #mobileMoveControls button:active,
  #mobileMoveControls button.pressed {
    background: rgba(34, 102, 108, 0.92);
    border-color: var(--teal);
    transform: scale(0.94);
  }

  @media (pointer: coarse), (max-width: 540px) {
    #novaBtn:not([hidden]) {
      display: flex;
    }
    #mobileMoveControls:not([hidden]) {
      display: flex;
    }
    .icon-btn {
      width: 44px;
      height: 44px;
    }
  }

  /* Desktop ready button: allow clicking Nova on desktop too when ready */
  @media (pointer: fine) and (min-width: 541px) {
    #novaBtn:not([hidden]):not(:disabled) {
      display: flex;
      height: 46px;
      min-width: 112px;
      bottom: 54px;
    }
  }

  /* Overlay Layer */
  #overlay {
    z-index: 20;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: rgba(3, 9, 18, 0.64);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .overlay-card {
    width: min(100%, 332px);
    border-radius: 22px;
    padding: 18px 20px 20px;
    text-align: center;
    background: var(--surface-strong);
    border: 1px solid var(--line-strong);
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.52);
  }

  .overlay-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .brand-kicker {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--teal);
    text-align: left;
  }

  .lang-switch {
    display: inline-flex;
    padding: 2px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.09);
    gap: 2px;
  }

  .lang-btn {
    border: 0;
    background: transparent;
    color: var(--muted);
    font: 700 11px var(--font-ui);
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.14s ease, color 0.14s ease;
    white-space: nowrap;
  }

  .lang-btn.active {
    background: rgba(83, 245, 208, 0.18);
    color: var(--ink);
  }

  .logo-wrap {
    margin: 2px auto 10px;
    display: flex;
    justify-content: center;
  }

  .logo-svg {
    width: 228px;
    height: 48px;
    display: block;
  }

  #overlayTitle {
    font-size: 30px;
    line-height: 1.08;
    font-weight: 900;
    letter-spacing: 0.03em;
    margin-bottom: 8px;
    color: var(--ink);
    text-wrap: balance;
  }

  #overlayTitle.sr-brand {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  #newBestBanner {
    margin: 0 auto 10px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.1em;
    color: var(--gold);
  }

  #overlayLead {
    color: #c8deee;
    font-size: 13.5px;
    line-height: 1.5;
    margin-bottom: 16px;
  }

  /* Clean hairline-divided stats row (no nested card boxes) */
  #overlayStats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 12px 0;
    margin-bottom: 16px;
  }

  .stat-cell {
    padding: 0 6px;
  }

  .stat-cell + .stat-cell {
    border-left: 1px solid var(--line);
  }

  .stat-cell strong {
    display: block;
    font-size: 19px;
    line-height: 1.1;
    font-weight: 800;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    margin-bottom: 4px;
  }

  .stat-cell span {
    display: block;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  /* Concise Visual Guide on Menu */
  #menuGuide {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 16px;
    text-align: center;
  }

  .guide-item {
    font-size: 11px;
    line-height: 1.35;
    color: #c6dced;
  }

  .guide-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    margin: 0 auto 5px;
  }

  #playBtn {
    width: 100%;
    border: 0;
    border-radius: 14px;
    padding: 14px 18px;
    cursor: pointer;
    color: #061420;
    font: 900 17px var(--font-ui);
    letter-spacing: 0.08em;
    background: linear-gradient(135deg, var(--teal) 0%, #99ffd6 46%, var(--gold) 100%);
    box-shadow: 0 10px 28px rgba(83, 245, 208, 0.24);
    transition: transform 0.14s cubic-bezier(0.16, 1, 0.3, 1), filter 0.14s ease;
    white-space: nowrap;
  }

  #playBtn:hover {
    filter: brightness(1.06);
  }

  #playBtn:active {
    transform: scale(0.97);
  }

  .secondary-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .secondary-btn {
    flex: 1;
    padding: 11px 12px;
    border-radius: 12px;
    border: 1px solid var(--line-strong);
    background: rgba(20, 42, 64, 0.72);
    color: #e4f5ff;
    font: 700 13px var(--font-ui);
    cursor: pointer;
    white-space: nowrap;
    transition: background-color 0.14s ease, transform 0.12s ease;
  }

  .secondary-btn:hover {
    background: rgba(29, 58, 86, 0.88);
  }

  .secondary-btn:active {
    transform: scale(0.97);
  }

  .controls {
    margin-top: 14px;
    font-size: 11.5px;
    line-height: 1.55;
    color: var(--muted);
  }

  @media (max-width: 540px) {
    #gameWrapper {
      border-radius: 0;
      border: 0;
      box-shadow: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<div id="gameWrapper">
  <canvas id="gameCanvas" width="400" height="640" aria-label="UpJump"></canvas>

  <div id="hud">
    <div class="hud-top">
      <div class="score-block">
        <div class="score-main">
          <strong id="scoreDisplay">0</strong>
          <span id="comboDisplay">x0</span>
        </div>
        <div class="score-meta">
          <span id="bestLabel">En iyi</span> <strong id="bestDisplay">0</strong>
          <span aria-hidden="true">·</span>
          <span id="altDisplay">0m</span>
        </div>
      </div>
      <div class="hud-actions">
        <button id="soundBtn" class="icon-btn" type="button" aria-label="Sesi kapat" aria-pressed="true">🔊</button>
        <button id="fullscreenBtn" class="icon-btn" type="button" aria-label="Tam ekran">⛶</button>
        <button id="pauseBtn" class="icon-btn" type="button" aria-label="Oyunu duraklat">II</button>
      </div>
    </div>

    <div id="energyPanel">
      <div class="energy-row">
        <span id="energyTitle">Nova Enerjisi</span>
        <span id="energyLabel">0%</span>
      </div>
      <div class="track"><div id="energyFill"></div></div>
    </div>

    <div id="banner" role="status" aria-live="polite"></div>

    <button id="novaBtn" type="button" aria-label="Nova Dash kullan" disabled hidden>⚡ NOVA</button>

    <div id="mobileMoveControls" hidden>
      <button id="mobileLeftBtn" type="button" aria-label="Sola git">◀</button>
      <button id="mobileRightBtn" type="button" aria-label="Sağa git">▶</button>
    </div>

    <div id="missionWrap">
      <div id="missionPill"></div>
      <div class="mission-track"><div id="missionBar"></div></div>
    </div>
  </div>

  <div id="overlay">
    <div class="overlay-card">
      <div class="overlay-bar">
        <div id="overlayKicker" class="brand-kicker">Brego Games Originals</div>
        <div class="lang-switch" role="group" aria-label="Language">
          <button id="langEnBtn" class="lang-btn" type="button">EN</button>
          <button id="langTrBtn" class="lang-btn" type="button">TR</button>
        </div>
      </div>

      <div id="logoWrap" class="logo-wrap" aria-hidden="true">
        <svg class="logo-svg" viewBox="0 0 260 56" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="upjGrad" x1="16" y1="6" x2="244" y2="50" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#68ffe0"/>
              <stop offset="0.52" stop-color="#effcff"/>
              <stop offset="1" stop-color="#ffd166"/>
            </linearGradient>
          </defs>
          <text x="130" y="43" text-anchor="middle" font-family="'Avenir Next','Trebuchet MS',system-ui,sans-serif" font-size="44" font-weight="900" letter-spacing="4" fill="#04101b" transform="translate(0,3)">UPJUMP</text>
          <text x="130" y="43" text-anchor="middle" font-family="'Avenir Next','Trebuchet MS',system-ui,sans-serif" font-size="44" font-weight="900" letter-spacing="4" fill="url(#upjGrad)">UPJUMP</text>
        </svg>
      </div>

      <h1 id="overlayTitle" class="sr-brand">UPJUMP</h1>
      <div id="newBestBanner" hidden>NEW HIGH SCORE</div>
      <p id="overlayLead"></p>

      <div id="menuGuide">
        <div class="guide-item">
          <div class="guide-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 2.5L14.9 8.4L21.4 9.3L16.7 13.9L17.8 20.4L12 17.3L6.2 20.4L7.3 13.9L2.6 9.3L9.1 8.4L12 2.5Z" fill="#ffd166"/></svg>
          </div>
          <span id="guide1">Yıldız topla</span>
        </div>

// Synthesized Web Audio Engine (Zero External Assets, Zero Copyright Risk)
const PENTATONIC = [330, 370, 415, 494, 554, 659, 740, 831, 988];

function audioActive() { return soundEnabled && !portalMuted; }

function unlockAudio() {
  if (!audioActive()) return;
  try {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;
    if (!audioContext) {
      audioContext = new Ctor();
      // Pre-build short white noise buffer for crack/explosion textures
      const len = Math.floor(audioContext.sampleRate * 0.2);
      noiseBuffer = audioContext.createBuffer(1, len, audioContext.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    }
    if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
  } catch {}
}

function suspendAudio() {
  try {
    if (audioContext && audioContext.state === 'running') audioContext.suspend().catch(() => {});
  } catch {}
}

function playTone(freq, duration = 0.09, shape = 'sine', volume = 0.024, endFreq = null, delay = 0) {
  if (!audioActive()) return;
  try {
    unlockAudio();
    if (!audioContext || audioContext.state === 'closed') return;
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    const t0 = audioContext.currentTime + delay;
    osc.type = shape;
    osc.frequency.setValueAtTime(freq, t0);
    if (endFreq != null) osc.frequency.exponentialRampToValueAtTime(Math.max(40, endFreq), t0 + duration);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.002, volume), t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
    osc.onended = () => { osc.disconnect(); gain.disconnect(); };
  } catch {}
}

function playNoise(duration = 0.09, volume = 0.024, filterFreq = 900) {
  if (!audioActive()) return;
  try {
    unlockAudio();
    if (!audioContext || !noiseBuffer || audioContext.state === 'closed') return;
    const src = audioContext.createBufferSource();
    src.buffer = noiseBuffer;
    const filter = audioContext.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = filterFreq;
    const gain = audioContext.createGain();
    const t0 = audioContext.currentTime;
    gain.gain.setValueAtTime(volume, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    src.connect(filter);
    filter.connect(gain);
    gain.connect(audioContext.destination);
    src.start(t0);
    src.stop(t0 + duration + 0.01);
    src.onended = () => { src.disconnect(); filter.disconnect(); gain.disconnect(); };
  } catch {}
}

// Drawing Geometry Helpers
function roundRect(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w, y + h - rr);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x, y + rr);
  ctx.quadraticCurveTo(x, y, x + rr, y);
  ctx.closePath();
}

function drawStar(x, y, outer, inner, rotOffset = 0) {
  let rot = Math.PI * 1.5 + rotOffset;
  const step = Math.PI / 5;
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const ox = x + Math.cos(rot) * outer;
    const oy = y + Math.sin(rot) * outer;
    if (i === 0) ctx.moveTo(ox, oy); else ctx.lineTo(ox, oy);
    rot += step;
    ctx.lineTo(x + Math.cos(rot) * inner, y + Math.sin(rot) * inner);
    rot += step;
  }
  ctx.closePath();
}

function inter(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// Biome Interpolation
function getBiomeState(alt) {
  let idx = 0;
  for (let i = 0; i < BIOMES.length - 1; i++) {
    if (alt >= BIOMES[i].alt) idx = i;
  }
  const curr = BIOMES[idx];
  const next = BIOMES[Math.min(idx + 1, BIOMES.length - 1)];
  const span = Math.max(1, next.alt - curr.alt);
  const f = idx === BIOMES.length - 1 ? 0 : clamp((alt - curr.alt) / span, 0, 1);
  return {
    idx,
    name: lang === 'tr' ? curr.nameTr : curr.nameEn,
    top: lerpColor(curr.top, next.top, f),
    mid: lerpColor(curr.mid, next.mid, f),
    bot: lerpColor(curr.bot, next.bot, f),
    glowA: lerpColor(curr.glowA, next.glowA, f),
    glowB: lerpColor(curr.glowB, next.glowB, f),
  };
}

    texts: [],
    comets: [],
    player: {
      x: W / 2 - 18,
      y: H - 150,
      w: 36,
      h: 40,
      vx: 0,
      vy: -14,
      face: 1,
      tilt: 0,
      antX: 0,
      blink: 120,
      boost: 0,
      shield: 0,
      squash: 1,
      trail: [],
    },
  };

  // Wide guaranteed starter platform
  g.platforms.push({
    x: W / 2 - 44, y: H - 92, w: 88, h: 14,
    type: PT.N, vx: 0, broken: false, alpha: 1, phase: 0, visible: 1, recoil: 0, springAnim: 0,
  });

  for (let y = H - 166; y > -2200; y -= 82) spawnLayer(g, y);
  g.genY = -2200;
  return g;
}

function spawnLayer(g, y) {
  const d = clamp(-y / 4400, 0, 1.5);
  const r = Math.random();
  let type = PT.N;

  if (r < 0.14 + d * 0.06) type = PT.M;
  else if (r < 0.25 + d * 0.04) type = PT.S;
  else if (r < 0.35 + d * 0.06) type = PT.C;
  else if (r < 0.43 + d * 0.05) type = PT.P;

  // Guarantee fairness: never more than 2 fragile pads in a row
  if (type === PT.C || type === PT.P) {
    if (g.fragileStreak >= 2 || y > H - 300) {
      type = PT.N;
      g.fragileStreak = 0;
    } else {
      g.fragileStreak += 1;
    }
  } else {
    g.fragileStreak = 0;
  }

  const w = type === PT.S ? 74 : type === PT.P ? 68 : 80;
  // Bias reachable horizontal spread from previous safe platform
  const maxReach = 185;
  let px;
  if (Math.random() < 0.72) {
    const raw = g.lastSafeX + rand(-maxReach, maxReach);
    px = ((raw % (W - 36 - w)) + (W - 36 - w)) % (W - 36 - w) + 18;
  } else {
    px = rand(18, W - 18 - w);
  }
  if (type !== PT.C && type !== PT.P) g.lastSafeX = px;

  const moveSpeed = (1.35 + d * 0.55) * (Math.random() > 0.5 ? 1 : -1);
  const p = {
    x: px, y, w, h: 14, type,
    vx: type === PT.M ? moveSpeed : 0,
    broken: false, alpha: 1, phase: rand(0, TAU), visible: 1,
    recoil: 0, springAnim: 0,
  };
  g.platforms.push(p);

  const hasStar = Math.random() < (type === PT.S ? 0.74 : 0.40 + d * 0.08);
  if (hasStar) {
    g.stars.push({
      x: p.x + p.w / 2,
      y: y - rand(22, 32),
      kind: Math.random() < 0.15 + d * 0.06 ? 'orb' : 'star',
      t: rand(0, TAU),
      dead: false,
    });
  }

  // Fair drone placement: never right on top of a star, starts after warm-up height
  if (y < -280 && !hasStar && Math.random() < 0.08 + d * 0.075) {
    const dx = clamp(p.x + (p.x > W / 2 ? -rand(68, 120) : rand(68, 120)), 22, W - 56);
    g.drones.push({
      x: dx,
      y: y - rand(52, 76),
      w: 34,
      h: 22,
      vx: (1.45 + d * 0.45) * (Math.random() > 0.5 ? 1 : -1),
      phase: rand(0, TAU),
      dead: false,
    });
  }
}

function addBurst(g, x, y, color, n, speed = 1) {
  for (let i = 0; i < n; i++) {
    const ang = rand(0, TAU);
    const spd = rand(0.9, 3.8) * speed;
    const life = rand(18, 36);
    g.particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 1.2,
      life, max: life,
      size: rand(2, 4.8),
      color,
      grav: 0.11,
    });
  }
}

function addRing(g, x, y, color, maxR = 36, lw = 2.5) {
  g.rings.push({ x, y, r: 6, maxR, color, lw, life: 18, max: 18 });
}

function addShake(g, amt) {
  if (reducedMotion()) return;
  g.shake = Math.max(g.shake, amt);
}

function addText(g, x, y, text, color, scale = 1) {
  g.texts.push({ x, y, text, color, life: 46, max: 46, scale });
}

function setBanner(g, text) {
  g.banner = text;
  g.bannerTimer = 96;
}

function addEnergy(g, amount) {
  const prev = g.energy;
  g.energy = clamp(g.energy + amount, 0, 100);
  if (prev < 100 && g.energy >= 100 && !g.energyWasFull) {
    g.energyWasFull = true;
    sfx.novaReady();
    addRing(g, g.player.x + g.player.w / 2, g.player.y + g.player.h / 2, '#ffd166', 44, 3);
  }
}

function missionHit(g, type) {
  if (g.mission.type !== type) return;
  g.mission.progress += 1;
  if (g.mission.progress >= g.mission.target) {
    g.bonus += 180;
    g.missionsCleared += 1;
    addEnergy(g, 36);
    setBanner(g, t().bannerMission);
    sfx.mission();
    portal.happyTime();
    addBurst(g, g.player.x + g.player.w / 2, g.player.y, '#53f5d0', 16, 1.2);
    g.mission = createMission();
  }
}

function totalScore(g) {
  g.score = g.dist + g.bonus;
  if (g.score > bestScore) {
    bestScore = g.score;
    safeStorage.set('upjump-best', bestScore);
    if (!g.beatBestInRun && g.startBest > 0) {
      g.beatBestInRun = true;
      setBanner(g, t().bannerBest);
      sfx.highScore();
      portal.happyTime();
    }
  }
  if (g.dist > bestAlt) {
    bestAlt = g.dist;
    safeStorage.set('upjump-best-alt', bestAlt);
  }
}

function solid(p) { return !p.broken && (p.type !== PT.P || p.visible > 0.38); }
function jumpPower(type) { return type === PT.S ? 22.4 : type === PT.M ? 15.8 : type === PT.P ? 16.4 : 14.8; }

function moveIntent() {
  if (input.left && !input.right) return -1;
  if (input.right && !input.left) return 1;
  if (input.pointerX == null) return 0;
  const rect = canvas.getBoundingClientRect();
  const x = input.pointerX - rect.left;
  if (x < rect.width * 0.42) return -1;
  if (x > rect.width * 0.58) return 1;
  return 0;
}

function tryNova(g) {
  if (g.energy < 100 || g.player.boost > 0) return false;
  g.energy = 0;
  g.energyWasFull = false;
  g.player.boost = 56;
  g.player.shield = 74;
  g.player.vy = -24;
  g.player.squash = 0.6;
  g.combo = Math.min(g.combo + 2, 9);
  g.maxCombo = Math.max(g.maxCombo, g.combo);
  g.flash = 0.35;
  addShake(g, 8);
  setBanner(g, t().bannerNova);
  sfx.novaDash();
  const cx = g.player.x + g.player.w / 2, cy = g.player.y + g.player.h / 2;
  addBurst(g, cx, cy, '#ffd166', 20, 1.35);
  addRing(g, cx, cy, '#ffd166', 58, 3.5);
  return true;
}

function triggerGameOver(g, reason) {
  g.mode = MODES.OVER;
  g.endReason = reason;
  lastDeathMs = Date.now();
  addShake(g, 10);
  g.flash = 0.28;
  sfx.gameOver();
  portal.gameplayStop();
  totalScore(g);
  updateOverlay();
}

function updateGame(g) {
  if (g.mode !== MODES.PLAY) return;
  g.frame++;

  if (g.hitStop > 0) {
    g.hitStop--;
    g.shake *= 0.86;
    return;
  }

  if (input.boost) {
    tryNova(g);
    input.boost = false;
  }

  const pl = g.player;
  const dir = moveIntent();
  if (dir !== 0) g.movedOnce = true;
  if (g.movedOnce && g.hintAlpha > 0) g.hintAlpha = Math.max(0, g.hintAlpha - 0.04);
  else if (g.frame > 180 && g.hintAlpha > 0) g.hintAlpha = Math.max(0, g.hintAlpha - 0.02);

  const targetVx = dir * 6.4;
  pl.vx = lerp(pl.vx, targetVx, dir === 0 ? 0.14 : 0.25);
  pl.x += pl.vx;
  if (dir) pl.face = dir;
  pl.tilt = lerp(pl.tilt, clamp(pl.vx * 0.038, -0.25, 0.25), 0.22);
  pl.antX = lerp(pl.antX, -pl.vx * 1.4, 0.16);

  // Seamless screen wrap
  if (pl.x + pl.w / 2 < 0) pl.x += W;
  if (pl.x + pl.w / 2 > W) pl.x -= W;

  if (pl.boost > 0) {
    pl.boost--;
    pl.shield = Math.max(pl.shield, pl.boost);
    pl.vy += 0.18;
    pl.vy = Math.min(pl.vy, -11);
    if (g.frame % 2 === 0) {
      g.particles.push({
        x: pl.x + pl.w / 2 + rand(-9, 9),
        y: pl.y + pl.h,
        vx: rand(-0.6, 0.6),
        vy: rand(2.5, 5.2),
        life: 16, max: 16,
        size: rand(2.5, 5.5),
        color: Math.random() > 0.4 ? '#ffd166' : '#ff8f6b',
        grav: 0.04,
      });
    }
  } else {
    pl.vy += 0.47;
  }

  pl.y += pl.vy;
  pl.squash = lerp(pl.squash, 1, 0.2);
  if (pl.shield > 0) pl.shield--;
  pl.blink--;
  if (pl.blink < -7) pl.blink = Math.floor(rand(110, 230));

  pl.trail.unshift({
    x: pl.x + pl.w / 2,
    y: pl.y + pl.h / 2,
    r: pl.boost > 0 ? 12 : 7,
    a: pl.boost > 0 ? 0.52 : 0.24,
  });
  if (pl.trail.length > 11) pl.trail.pop();
  pl.trail.forEach(tr => { tr.a *= 0.82; tr.r *= 0.96; });

  const targetCam = pl.y - H * 0.42;
  if (targetCam < g.camY) g.camY = lerp(g.camY, targetCam, 0.44);

  while (g.genY > g.camY - 140) {
    spawnLayer(g, g.genY);
    const difficultyGap = Math.min(46, g.dist / 32);
    g.genY -= rand(68, 96) + difficultyGap;
  }

  // Update platforms
  g.platforms.forEach(p => {
    if (p.type === PT.M) {
      p.x += p.vx;
      if (p.x < 14) { p.x = 14; p.vx = Math.abs(p.vx); }
      if (p.x + p.w > W - 14) { p.x = W - 14 - p.w; p.vx = -Math.abs(p.vx); }
    }
    if (p.type === PT.P) {
      p.phase += 0.048;
      p.visible = 0.14 + ((Math.sin(p.phase) + 1) * 0.5) * 0.86;
      p.alpha = 0.18 + p.visible * 0.82;
    }
    if (p.broken) p.alpha = clamp(p.alpha - 0.08, 0, 1);
    if (p.recoil > 0) p.recoil = Math.max(0, p.recoil - 0.16);
    if (p.springAnim > 0) p.springAnim = Math.max(0, p.springAnim - 0.1);
  });

  // Update collectibles & gentle magnetic pull
  const cx = pl.x + pl.w / 2, cy = pl.y + pl.h / 2;
  g.stars.forEach(s => {
    s.t += s.kind === 'orb' ? 0.08 : 0.11;
    if (!s.dead) {
      const dx = cx - s.x, dy = cy - s.y;
      const d2 = dx * dx + dy * dy;
      const pullR = s.kind === 'orb' ? 64 : 50;
      if (d2 < pullR * pullR && d2 > 4) {
        const pull = pl.boost > 0 ? 0.24 : 0.12;
        s.x += dx * pull;
        s.y += dy * pull;
      }
    }
  });

  g.drones.forEach(d => {
    d.x += d.vx;
    d.phase += 0.15;
    if (d.x < 16) { d.x = 16; d.vx = Math.abs(d.vx); }
    if (d.x + d.w > W - 16) { d.x = W - 16 - d.w; d.vx = -Math.abs(d.vx); }
  });

  g.particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.life--; });
  g.rings.forEach(r => { r.life--; r.r = lerp(r.r, r.maxR, 0.22); });
  g.debris.forEach(b => { b.x += b.vx; b.y += b.vy; b.vy += 0.28; b.rot += b.vrot; b.life--; });
  g.texts.forEach(tx => { tx.y -= 1.1; tx.life--; });

  // Ambient shooting stars in high biomes
  if (g.dist > 520 && Math.random() < 0.009) {
    g.comets.push({ x: rand(40, W), y: rand(30, H * 0.45), vx: -rand(5, 8.5), vy: rand(2.5, 4.5), life: 28, max: 28 });
  }
  g.comets.forEach(c => { c.x += c.vx; c.y += c.vy; c.life--; });

  // Prune
  g.platforms = g.platforms.filter(p => !(p.broken && p.alpha <= 0) && p.y - g.camY < H + 120);
  g.stars = g.stars.filter(s => !s.dead && s.y - g.camY < H + 90);
  g.drones = g.drones.filter(d => !d.dead && d.y - g.camY < H + 120);
  g.particles = g.particles.filter(p => p.life > 0);
  g.rings = g.rings.filter(r => r.life > 0);
  g.debris = g.debris.filter(b => b.life > 0);
  g.texts = g.texts.filter(tx => tx.life > 0);
  g.comets = g.comets.filter(c => c.life > 0);

  // Platform bounce check (also accounts for wrapped player edge)
  if (pl.vy > 0) {
    const footY = pl.y + pl.h;
    const prevFootY = footY - pl.vy;
    for (const p of g.platforms) {
      if (!solid(p)) continue;
      const horizHit =
        (pl.x + pl.w - 4 > p.x && pl.x + 4 < p.x + p.w) ||
        (pl.x - W + pl.w - 4 > p.x && pl.x - W + 4 < p.x + p.w) ||
        (pl.x + W + pl.w - 4 > p.x && pl.x + W + 4 < p.x + p.w);
      if (horizHit && footY >= p.y && footY <= p.y + p.h + 14 && prevFootY <= p.y + p.h + 2) {
        pl.y = p.y - pl.h;
        pl.vy = -jumpPower(p.type);
        pl.squash = p.type === PT.S ? 0.62 : 0.74;
        p.recoil = 1;

        const gap = g.frame - (g.lastBounce || -999);
        g.combo = gap < 86 ? Math.min(g.combo + 1, 9) : 1;
        g.maxCombo = Math.max(g.maxCombo, g.combo);
        g.lastBounce = g.frame;

        let energy = 5;
        if (p.type === PT.S) {
          p.springAnim = 1;
          g.bonus += 14;
          energy = 15;
          missionHit(g, 'spring');
          setBanner(g, t().bannerSpring);
          addShake(g, 4.5);
          sfx.spring();
          addRing(g, p.x + p.w / 2, p.y, '#ff8f6b', 42, 3);
          addBurst(g, p.x + p.w / 2, p.y, '#ffcfb5', 10, 1.2);
        } else if (p.type === PT.C) {
          energy = 6;
          p.broken = true;
          sfx.crumble();
          // Split into two tumbling halves
          g.debris.push(
            { x: p.x + p.w * 0.25, y: p.y + 7, w: p.w * 0.46, h: p.h, vx: -1.4, vy: -1.1, rot: 0, vrot: -0.09, color: STYLE.crumble[0], life: 36, max: 36 },
            { x: p.x + p.w * 0.75, y: p.y + 7, w: p.w * 0.46, h: p.h, vx: 1.4, vy: -0.9, rot: 0, vrot: 0.09, color: STYLE.crumble[0], life: 36, max: 36 }
          );
          addBurst(g, p.x + p.w / 2, p.y + 6, '#f4d2ae', 8, 0.9);
        } else {
          if (p.type === PT.M) { g.bonus += 8; energy = 9; }
          else if (p.type === PT.P) { g.bonus += 10; energy = 11; }
          sfx.bounce(g.combo);
          addBurst(g, pl.x + pl.w / 2, p.y, STYLE[p.type][0], 6, 0.85);
          addRing(g, pl.x + pl.w / 2, p.y + 2, STYLE[p.type][0], 24, 1.8);
        }

        addEnergy(g, energy);
        break;
      }
    }
  }

  // Collectible pickups
  g.stars.forEach(s => {
    const reach = s.kind === 'orb' ? 30 : 25;
    if (!s.dead && Math.abs(cx - s.x) < reach && Math.abs(cy - s.y) < reach) {
      s.dead = true;
      const bonus = (s.kind === 'orb' ? 75 : 25) + g.combo * 5;
      g.bonus += bonus;
      addEnergy(g, s.kind === 'orb' ? 44 : 18);
      if (s.kind === 'orb') sfx.orb(); else sfx.star(g.combo);
      const col = s.kind === 'orb' ? '#53f5d0' : '#ffd166';
      addBurst(g, s.x, s.y, col, s.kind === 'orb' ? 12 : 8, 1.1);
      addRing(g, s.x, s.y, col, s.kind === 'orb' ? 34 : 24, 2.2);
      addText(g, s.x, s.y - 12, `+${bonus}`, col, s.kind === 'orb' ? 1.15 : 1);
      if (s.kind === 'star') missionHit(g, 'collect');
    }
  });

  // Drone collision
  g.drones.forEach(d => {
    if (!d.dead && inter(pl, d)) {
      if (pl.shield > 0 || pl.boost > 0) {
        d.dead = true;
        g.dronesSmashed += 1;
        const bonus = 140 + g.combo * 12;
        g.bonus += bonus;
        g.hitStop = 3;
        addShake(g, 9);
        sfx.smash();
        const dcx = d.x + d.w / 2, dcy = d.y + d.h / 2;
        addBurst(g, dcx, dcy, '#ff8f6b', 18, 1.45);
        addRing(g, dcx, dcy, '#ffd166', 48, 3.2);
        addText(g, dcx, d.y - 12, `+${bonus}`, '#ffd166', 1.25);
        setBanner(g, t().bannerSmash);
        missionHit(g, 'nova');
      } else {
        triggerGameOver(g, 'drone');
      }
    }
  });

  if (g.frame - (g.lastBounce || -999) > 125) g.combo = 0;

  if (pl.y - g.camY > H + 84 && g.mode === MODES.PLAY) {
    triggerGameOver(g, 'fall');
  }

  g.dist = Math.max(g.dist, Math.floor(-g.camY / 10));

  // Biome milestone notification
  const bState = getBiomeState(g.dist);
  if (bState.idx > g.biomeIdx) {
    g.biomeIdx = bState.idx;
    setBanner(g, `${bState.name} · ${g.dist}m`);
  }

  totalScore(g);
  if (g.bannerTimer > 0) g.bannerTimer--;
  g.shake *= 0.84;
  if (g.shake < 0.2) g.shake = 0;
  g.flash = Math.max(0, g.flash - 0.035);
}

// Rendering Pipeline
function drawBackground(g, biome) {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, rgb(biome.top));
  sky.addColorStop(0.55, rgb(biome.mid));
  sky.addColorStop(1, rgb(biome.bot));
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Atmospheric nebulae / aurora glows
  let glow = ctx.createRadialGradient(W * 0.2, 130, 0, W * 0.2, 130, 240);
  glow.addColorStop(0, rgb(biome.glowA, 0.17));
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  glow = ctx.createRadialGradient(W * 0.84, 210, 0, W * 0.84, 210, 220);
  glow.addColorStop(0, rgb(biome.glowB, 0.13));
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // Subtle aurora ribbon in lower-mid altitude
  const auroraAlpha = clamp(1 - Math.abs(g.dist - 320) / 380, 0, 0.24);
  if (auroraAlpha > 0.01) {
    ctx.save();
    ctx.globalAlpha = auroraAlpha;
    const aurGrad = ctx.createLinearGradient(0, 120, W, 280);
    aurGrad.addColorStop(0, 'rgba(83,245,208,0)');
    aurGrad.addColorStop(0.45, 'rgba(83,245,208,0.55)');
    aurGrad.addColorStop(0.75, 'rgba(124,199,255,0.45)');
    aurGrad.addColorStop(1, 'rgba(190,118,255,0)');
    ctx.fillStyle = aurGrad;
    ctx.beginPath();
    ctx.moveTo(0, 230);
    for (let x = 0; x <= W; x += 25) {
      const wy = 190 + Math.sin(x * 0.018 + ambientT * 0.016) * 26 + Math.cos(x * 0.008 - ambientT * 0.01) * 14;
      ctx.lineTo(x, wy);
    }
    ctx.lineTo(W, 275);
    for (let x = W; x >= 0; x -= 25) {
      const wy = 245 + Math.sin(x * 0.018 + ambientT * 0.016 + 0.9) * 22;
      ctx.lineTo(x, wy);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // Orbital planet silhouette in high biomes (900m+)
  if (g.dist > 650) {
    const pAlpha = clamp((g.dist - 650) / 300, 0, 0.42);
    const py = 180 + ((g.camY * 0.035) % 420);
    ctx.save();
    ctx.globalAlpha = pAlpha;
    ctx.translate(W * 0.78, (py + 420) % 480 + 40);
    const pg = ctx.createRadialGradient(-14, -14, 6, 0, 0, 44);
    pg.addColorStop(0, '#4f7aa6');
    pg.addColorStop(0.65, '#192a4c');
    pg.addColorStop(1, '#081024');
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.arc(0, 0, 40, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 209, 102, 0.35)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(0, 2, 66, 14, -0.22, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  // Multi-layer twinkling starfield
  const starCount = g.dist > 500 ? 44 : 30;
  for (let i = 0; i < starCount; i++) {
    const x = (i * 89 + 37) % W;
    const speed = 0.05 + (i % 4) * 0.024;
    const y = ((i * 127) - g.camY * speed) % (H + 80);
    const sy = (y + H + 80) % (H + 80) - 40;
    const twinkle = 0.45 + 0.55 * Math.sin(ambientT * 0.045 + i * 1.9);
    const r = i % 6 === 0 ? 2.1 : i % 3 === 0 ? 1.4 : 1.0;
    ctx.fillStyle = i % 6 === 0 ? `rgba(255,209,102,${0.85 * twinkle})` : `rgba(218,244,255,${0.7 * twinkle})`;
    ctx.beginPath();
    ctx.arc(x, sy, r, 0, TAU);
    ctx.fill();
  }

  // Shooting comets
  g.comets.forEach(c => {
    const a = c.life / c.max;
    ctx.save();
    ctx.strokeStyle = `rgba(255, 236, 178, ${a * 0.75})`;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(c.x, c.y);
    ctx.lineTo(c.x - c.vx * 4.5, c.y - c.vy * 4.5);
    ctx.stroke();
    ctx.restore();
  });

  // Soft parallax clouds (fade out above stratosphere)
  const cloudAlpha = clamp(1 - Math.max(0, g.dist - 360) / 300, 0, 0.14);
  if (cloudAlpha > 0.01) {
    ctx.save();
    ctx.fillStyle = `rgba(186, 232, 255, ${cloudAlpha})`;
    for (let i = 0; i < 5; i++) {
      const cx = ((i * 115 + ambientT * (0.14 + (i % 2) * 0.08)) % (W + 140)) - 70;
      const cy = ((i * 165 - g.camY * 0.16) % (H + 140) + (H + 140)) % (H + 140) - 70;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 46 + (i % 3) * 14, 13 + (i % 2) * 4, 0, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  // Distant horizon silhouette near ground
  const skylineOffset = clamp(-g.camY * 0.18, 0, 180);
  if (skylineOffset < 175) {
    ctx.save();
    ctx.translate(0, skylineOffset);
    ctx.fillStyle = '#05101b';
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 32) {
      ctx.lineTo(x, H - 78 + Math.sin((x / W) * Math.PI * 3.5 + 0.6) * 14 + Math.cos((x / W) * Math.PI * 7) * 5);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

function drawPlayerSprite(pl, sx, sy, idleBob = 0) {
  ctx.save();
  ctx.translate(sx, sy + idleBob);
  ctx.rotate(pl.tilt);
  const scaleY = pl.squash;
  const scaleX = 1 / Math.sqrt(Math.max(0.5, scaleY));
  ctx.scale(pl.face * scaleX, scaleY);

  // Active shield / Nova barrier
  if (pl.shield > 0) {
    const expiring = pl.shield < 22 && Math.floor(pl.shield / 3) % 2 === 0;
    const sAlpha = expiring ? 0.25 : 0.72;
    ctx.save();
    ctx.rotate(ambientT * 0.08);
    ctx.strokeStyle = `rgba(255, 209, 102, ${sAlpha})`;
    ctx.lineWidth = 3;
    for (let i = 0; i < 3; i++) {
      const a0 = i * (TAU / 3);
      ctx.beginPath();
      ctx.arc(0, 0, 26 + Math.sin(ambientT * 0.2) * 1.5, a0, a0 + 1.35);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Jet-boot thruster flame when ascending
  if (pl.vy < -2 || pl.boost > 0) {
    const flameLen = pl.boost > 0 ? 22 + Math.sin(ambientT * 0.9) * 6 : clamp(-pl.vy * 0.72, 4, 14);
    const fGrad = ctx.createLinearGradient(0, 14, 0, 14 + flameLen);
    fGrad.addColorStop(0, '#ffffff');
    fGrad.addColorStop(0.35, pl.boost > 0 ? '#ffd166' : '#53f5d0');
    fGrad.addColorStop(1, pl.boost > 0 ? 'rgba(255,107,61,0)' : 'rgba(83,245,208,0)');
    ctx.fillStyle = fGrad;
    ctx.beginPath();
    ctx.moveTo(-9, 14); ctx.lineTo(-5, 14 + flameLen); ctx.lineTo(-1, 14);
    ctx.moveTo(1, 14); ctx.lineTo(5, 14 + flameLen); ctx.lineTo(9, 14);
    ctx.fill();
  }

  // Reactive Antenna
  ctx.strokeStyle = '#d9fcff';
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-2, -17);
  ctx.quadraticCurveTo(-2 + pl.antX * 0.5, -24, 2 + pl.antX, -27);
  ctx.stroke();
  ctx.fillStyle = pl.boost > 0 ? '#ffd166' : '#53f5d0';
  ctx.beginPath();
  ctx.arc(2 + pl.antX, -27, 3.2, 0, TAU);
  ctx.fill();

  // Thruster feet pods
  ctx.fillStyle = '#0e2538';
  roundRect(-12, 12, 9, 6, 3); ctx.fill();
  roundRect(3, 12, 9, 6, 3); ctx.fill();

  // Main capsule body
  ctx.shadowColor = pl.boost > 0 ? '#ffd166' : '#53f5d0';
  ctx.shadowBlur = pl.boost > 0 ? 24 : 14;
  const bodyGrad = ctx.createRadialGradient(-5, -8, 3, 0, 0, 22);
  bodyGrad.addColorStop(0, '#ffffff');
  bodyGrad.addColorStop(0.32, pl.boost > 0 ? '#ffebb5' : '#c4fff4');
  bodyGrad.addColorStop(1, pl.boost > 0 ? '#ff8b5e' : '#32dfb9');
  ctx.fillStyle = bodyGrad;
  roundRect(-16, -18, 32, 33, 15);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Glossy Visor
  ctx.fillStyle = '#081524';
  roundRect(-9, -11, 21, 12, 6);
  ctx.fill();

  // Visor reflection strip
  ctx.fillStyle = 'rgba(255,255,255,0.16)';
  roundRect(-6, -9.5, 14, 3, 2);
  ctx.fill();

  // Expressive Eyes
  if (pl.boost > 0) {
    // Focused Nova visor glow
    ctx.fillStyle = '#ffd166';
    roundRect(-5, -6.5, 15, 3.5, 2);
    ctx.fill();
  } else if (pl.blink < 0) {
    // Blink frame
    ctx.strokeStyle = '#9cfef0';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-4, -5); ctx.lineTo(0, -5);
    ctx.moveTo(5, -5); ctx.lineTo(9, -5);
    ctx.stroke();
  } else {
    const wide = pl.vy < -17 ? 2.8 : 2.2;
    ctx.fillStyle = '#eaffff';
    ctx.beginPath();
    ctx.arc(-1.5, -5, wide, 0, TAU);
    ctx.arc(7, -5, wide, 0, TAU);
    ctx.fill();
  }

  ctx.restore();
}

function drawGame(g) {
  const biome = getBiomeState(g.dist);
  ctx.save();
  if (g.shake > 0.2) {
    ctx.translate(rand(-g.shake, g.shake), rand(-g.shake, g.shake));
  }

  drawBackground(g, biome);

  // Speed lines during Nova Dash or high-velocity spring launch
  if (g.mode === MODES.PLAY && (g.player.boost > 0 || g.player.vy < -17)) {
    const intensity = g.player.boost > 0 ? 0.36 : 0.16;
    ctx.save();
    ctx.strokeStyle = g.player.boost > 0 ? `rgba(255,209,102,${intensity})` : `rgba(124,199,255,${intensity})`;
    ctx.lineWidth = 1.6;
    for (let i = 0; i < 10; i++) {
      const lx = i < 5 ? 10 + i * 16 : W - 10 - (i - 5) * 16;
      const ly = ((ambientT * 26 + i * 137) % (H + 90)) - 45;
      ctx.beginPath();
      ctx.moveTo(lx, ly);
      ctx.lineTo(lx, ly + 42);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Platforms
  g.platforms.forEach(p => {
    const sy = p.y - g.camY + p.recoil * 4.5;
    if (sy < -32 || sy > H + 32) return;
    const [fill, edge, glow] = STYLE[p.type];
    ctx.save();

    // Moving platform subtle horizontal guide track
    if (p.type === PT.M) {
      ctx.strokeStyle = 'rgba(124,199,255,0.16)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 6]);
      ctx.beginPath();
      ctx.moveTo(20, sy + p.h / 2);
      ctx.lineTo(W - 20, sy + p.h / 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Phase platform intangible dashed silhouette
    if (p.type === PT.P && p.visible <= 0.38) {
      ctx.strokeStyle = 'rgba(198,125,255,0.52)';
      ctx.lineWidth = 1.6;
      ctx.setLineDash([5, 4]);
      roundRect(p.x, sy, p.w, p.h, 7);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
      return;
    }

    ctx.globalAlpha = p.alpha;

    // Spring coil underneath/above pad
    if (p.type === PT.S) {
      const ext = p.springAnim * 10;
      const cx = p.x + p.w / 2;
      ctx.strokeStyle = '#ffe5d9';
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(cx - 8, sy);
      ctx.lineTo(cx + 8, sy - 4 - ext * 0.3);
      ctx.lineTo(cx - 8, sy - 8 - ext * 0.65);
      ctx.lineTo(cx + 8, sy - 11 - ext);
      ctx.stroke();
      ctx.fillStyle = '#ffcfb5';
      roundRect(cx - 13, sy - 15 - ext, 26, 5, 2.5);
      ctx.fill();
    }

    // Main platform body
    ctx.shadowColor = glow;
    ctx.shadowBlur = p.type === PT.P ? 16 : 11;
    roundRect(p.x, sy, p.w, p.h, 7);
    const grad = ctx.createLinearGradient(p.x, sy, p.x, sy + p.h);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.16, edge);
    grad.addColorStop(0.92, fill);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Top bevel highlight
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    roundRect(p.x + 5, sy + 2, p.w - 10, 3.5, 2);
    ctx.fill();

    // Non-hue-only platform iconography
    if (p.type === PT.M) {
      // Directional chevrons
      ctx.strokeStyle = '#09243a';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(p.x + 15, sy + 4.5); ctx.lineTo(p.x + 11, sy + 7); ctx.lineTo(p.x + 15, sy + 9.5);
      ctx.moveTo(p.x + p.w - 15, sy + 4.5); ctx.lineTo(p.x + p.w - 11, sy + 7); ctx.lineTo(p.x + p.w - 15, sy + 9.5);
      ctx.stroke();
    } else if (p.type === PT.C) {
      // Distinct fracture cracks
      ctx.strokeStyle = 'rgba(48,26,8,0.72)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(p.x + p.w * 0.32, sy + 1);
      ctx.lineTo(p.x + p.w * 0.42, sy + 7);
      ctx.lineTo(p.x + p.w * 0.36, sy + 13);
      ctx.moveTo(p.x + p.w * 0.66, sy + 1);
      ctx.lineTo(p.x + p.w * 0.58, sy + 8);
      ctx.lineTo(p.x + p.w * 0.64, sy + 13);
      ctx.stroke();
    } else if (p.type === PT.P) {
      // Hologram nodes
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(p.x + 8, sy + 7, 2.2, 0, TAU);
      ctx.arc(p.x + p.w - 8, sy + 7, 2.2, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  });

  // Tumbling crumble platform debris
  g.debris.forEach(b => {
    const sy = b.y - g.camY;
    if (sy > H + 40) return;
    ctx.save();
    ctx.globalAlpha = clamp(b.life / b.max, 0, 1);
    ctx.translate(b.x, sy);
    ctx.rotate(b.rot);
    ctx.fillStyle = b.color;
    roundRect(-b.w / 2, -b.h / 2, b.w, b.h, 4);
    ctx.fill();
    ctx.restore();
  });

  // Stars & Energy Orbs
  g.stars.forEach(s => {
    if (s.dead) return;
    const sy = s.y + Math.sin(s.t) * 4 - g.camY;
    if (sy < -26 || sy > H + 26) return;
    ctx.save();
    ctx.translate(s.x, sy);
    if (s.kind === 'orb') {
      const pulse = 1 + Math.sin(s.t * 1.5) * 0.08;
      ctx.scale(pulse, pulse);
      ctx.shadowColor = '#53f5d0';
      ctx.shadowBlur = 16;
      const grad = ctx.createRadialGradient(-3, -3, 2, 0, 0, 13);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.3, '#b8fff2');
      grad.addColorStop(1, '#3ce8c4');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, 10.5, 0, TAU);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255,255,255,0.72)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.ellipse(0, 0, 15, 5.5, s.t * 0.7, 0, TAU);
      ctx.stroke();
    } else {
      ctx.shadowColor = '#ffd166';
      ctx.shadowBlur = 14;
      drawStar(0, 0, 10.5, 4.6, Math.sin(s.t * 0.6) * 0.25);
      ctx.fillStyle = '#ffd166';
      ctx.fill();
      ctx.shadowBlur = 0;
      drawStar(0, -0.5, 5, 2.2, Math.sin(s.t * 0.6) * 0.25);
      ctx.fillStyle = '#fff9df';
      ctx.fill();
    }
    ctx.restore();
  });

  // Patrol Drones
  g.drones.forEach(d => {
    if (d.dead) return;
    const sy = d.y - g.camY;
    if (sy < -40 || sy > H + 40) return;
    const dcx = d.x + d.w / 2, dcy = sy + d.h / 2;
    const dx = (g.player.x + g.player.w / 2) - dcx;
    const dy = (g.player.y - g.camY + g.player.h / 2) - dcy;
    const close = dx * dx + dy * dy < 130 * 130;

    ctx.save();
    ctx.translate(dcx, dcy);

    // Spinning rotor blur
    const rotorW = 10 + Math.abs(Math.sin(d.phase * 2.2)) * 4;
    ctx.fillStyle = 'rgba(130, 235, 255, 0.26)';
    ctx.beginPath();
    ctx.ellipse(-14, -9, rotorW, 3, 0, 0, TAU);
    ctx.ellipse(14, -9, rotorW, 3, 0, 0, TAU);
    ctx.fill();

    // Danger proximity pulse ring
    if (close && g.player.shield <= 0 && g.player.boost <= 0) {
      ctx.strokeStyle = `rgba(255, 118, 92, ${0.35 + Math.sin(ambientT * 0.35) * 0.2})`;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(0, 0, 22, 0, TAU);
      ctx.stroke();
    }

    // Armored chassis
    ctx.shadowColor = 'rgba(255, 130, 96, 0.45)';
    ctx.shadowBlur = 14;
    const dGrad = ctx.createLinearGradient(0, -11, 0, 11);
    dGrad.addColorStop(0, '#ffd4c2');
    dGrad.addColorStop(0.45, '#ff8964');
    dGrad.addColorStop(1, '#c94c38');
    ctx.fillStyle = dGrad;
    roundRect(-17, -10, 34, 20, 9);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Optical sensor tracking player
    ctx.fillStyle = '#07121f';
    ctx.beginPath();
    ctx.arc(0, 1, 7.2, 0, TAU);
    ctx.fill();
    const lookAng = Math.atan2(dy, dx);
    ctx.fillStyle = g.player.boost > 0 ? '#ffd166' : '#53f5d0';
    ctx.beginPath();
    ctx.arc(Math.cos(lookAng) * 2.2, 1 + Math.sin(lookAng) * 2.2, 3, 0, TAU);
    ctx.fill();
    ctx.restore();
  });

  // Expanding Shockwave Rings
  g.rings.forEach(r => {
    const sy = r.y - g.camY;
    const a = clamp(r.life / r.max, 0, 1);
    ctx.save();
    ctx.globalAlpha = a * 0.72;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = r.lw * a;
    ctx.beginPath();
    ctx.arc(r.x, sy, r.r, 0, TAU);
    ctx.stroke();
    ctx.restore();
  });

  // Particles
  g.particles.forEach(p => {
    const sy = p.y - g.camY;
    if (sy < -24 || sy > H + 24) return;
    const a = clamp(p.life / p.max, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, sy, p.size * (0.45 + 0.55 * a), 0, TAU);
    ctx.fill();
    ctx.restore();
  });

  // Player Trail
  const pl = g.player;
  pl.trail.slice().reverse().forEach(tr => {
    ctx.save();
    ctx.globalAlpha = tr.a;
    ctx.fillStyle = pl.boost > 0 ? '#ffd166' : '#53f5d0';
    ctx.beginPath();
    ctx.arc(tr.x, tr.y - g.camY, tr.r, 0, TAU);
    ctx.fill();
    ctx.restore();
  });

  // Player (with seamless wrap-around ghost + live idle hop in Menu)
  const sx = pl.x + pl.w / 2;
  const sy = pl.y - g.camY + pl.h / 2;
  const idleBob = g.mode === MODES.MENU ? -Math.abs(Math.sin(ambientT * 0.065)) * 28 : 0;
  drawPlayerSprite(pl, sx, sy, idleBob);
  if (sx < 24) drawPlayerSprite(pl, sx + W, sy, idleBob);
  if (sx > W - 24) drawPlayerSprite(pl, sx - W, sy, idleBob);

  // First-run subtle movement cue on canvas
  if (g.mode === MODES.PLAY && g.hintAlpha > 0.02) {
    ctx.save();
    ctx.globalAlpha = g.hintAlpha * 0.78;
    ctx.fillStyle = '#dff6ff';
    ctx.font = '700 13px "Avenir Next", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(t().hintMove, W / 2, H - 120);
    ctx.restore();
  }

  // Floating Score Texts
  g.texts.forEach(tx => {
    const a = clamp(tx.life / tx.max, 0, 1);
    if (!a) return;
    const pop = tx.life > tx.max - 8 ? 1 + ((tx.max - tx.life) / 8) * 0.18 : 1;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(tx.x, tx.y - g.camY);
    ctx.scale(tx.scale * pop, tx.scale * pop);
    ctx.font = '800 14px "Avenir Next", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(4,12,22,0.75)';
    ctx.fillText(tx.text, 0, 1.5);
    ctx.fillStyle = tx.color;
    ctx.fillText(tx.text, 0, 0);
    ctx.restore();
  });

  // Brief impact flash
  if (g.flash > 0.01 && !reducedMotion()) {
    ctx.fillStyle = `rgba(255, 245, 210, ${g.flash * 0.3})`;
    ctx.fillRect(0, 0, W, H);
  }

  if (g.mode === MODES.PAUSE) {
    ctx.fillStyle = 'rgba(3, 9, 18, 0.36)';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.restore();
}

function syncHud() {
  const s = t();
  const energyPct = Math.round(game.energy);
  const ready = game.energy >= 100;

  dom.score.textContent = game.score;
  dom.best.textContent = bestScore;
  if (dom.alt) dom.alt.textContent = `${game.dist}m`;
  dom.combo.textContent = `x${game.combo}`;
  dom.combo.classList.toggle('hot', game.combo >= 3);

  dom.energyFill.style.width = `${energyPct}%`;
  dom.energyLabel.textContent = ready ? s.energyReady : `${energyPct}%`;
  if (dom.energyPanel) dom.energyPanel.classList.toggle('ready', ready);

  dom.mission.textContent = `${missionText(game.mission)} (${game.mission.progress}/${game.mission.target})`;
  if (dom.missionBar) {
    dom.missionBar.style.width = `${Math.round((game.mission.progress / game.mission.target) * 100)}%`;
  }
  if (dom.missionWrap) dom.missionWrap.hidden = game.mode === MODES.MENU;

  dom.banner.textContent = game.banner;
  dom.banner.classList.toggle('show', game.bannerTimer > 0 && game.mode === MODES.PLAY);

  dom.pauseBtn.textContent = game.mode === MODES.PLAY ? 'II' : '▶';
  dom.pauseBtn.setAttribute('aria-label', game.mode === MODES.PAUSE ? s.ariaResume : s.ariaPause);
  dom.pauseBtn.hidden = game.mode === MODES.MENU || game.mode === MODES.OVER;

  dom.novaBtn.hidden = game.mode !== MODES.PLAY;
  dom.mobileMoveControls.hidden = game.mode !== MODES.PLAY;

  // Sound toggle always accessible
  dom.soundBtn.hidden = false;
  dom.soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
  dom.soundBtn.setAttribute('aria-pressed', String(soundEnabled));
  dom.soundBtn.setAttribute('aria-label', soundEnabled ? s.ariaMute : s.ariaUnmute);

  dom.novaBtn.disabled = game.mode !== MODES.PLAY || !ready;
  const novaText = ready ? '⚡ NOVA' : `⚡ ${energyPct}%`;
  if (dom.novaBtn.textContent !== novaText) dom.novaBtn.textContent = novaText;
}

function updateOverlay() {
  const s = t();
  const isMenu = game.mode === MODES.MENU;
  const isPlay = game.mode === MODES.PLAY;
  const isPause = game.mode === MODES.PAUSE;

  dom.overlayMenuBtn.hidden = isMenu || isPlay;
  if (dom.secondaryActions) dom.secondaryActions.hidden = isMenu || isPlay;
  if (dom.overlayRestartBtn) dom.overlayRestartBtn.hidden = !isPause;

  if (isPlay) {
    dom.overlay.style.display = 'none';
    return;
  }

  dom.overlay.style.display = 'flex';
  if (dom.logoWrap) dom.logoWrap.hidden = !isMenu;
  if (dom.menuGuide) dom.menuGuide.hidden = !isMenu;
  dom.overlayTitle.classList.toggle('sr-brand', isMenu);
  if (dom.newBestBanner) {
    dom.newBestBanner.hidden = !(game.mode === MODES.OVER && game.beatBestInRun);
    dom.newBestBanner.textContent = s.newBest;
  }

  if (isMenu) {
    dom.overlayKicker.textContent = s.brand;
    dom.overlayTitle.textContent = 'UPJUMP';
    dom.overlayLead.textContent = s.menuLead;
    dom.playBtn.textContent = s.play;
    dom.overlayStats.innerHTML = statsHtml([
      [bestScore, s.best],
      [`${bestAlt}m`, s.altitude],
      [totalRuns, lang === 'tr' ? 'Tur' : 'Runs'],
    ]);
  } else if (isPause) {
    dom.overlayKicker.textContent = s.pausedKicker;
    dom.overlayTitle.textContent = s.paused;
    dom.overlayLead.textContent = s.pausedLead;
    dom.playBtn.textContent = s.resume;
    dom.overlayStats.innerHTML = statsHtml([
      [game.score, s.score],
      [`${Math.round(game.energy)}%`, 'Nova'],
      [`x${game.combo}`, s.combo],
    ]);
  } else {
    dom.overlayKicker.textContent = game.endReason === 'drone' ? s.overDrone : s.overFall;
    dom.overlayTitle.textContent = s.overTitle;
    dom.overlayLead.textContent = s.overLead;
    dom.playBtn.textContent = s.tryAgain;
    dom.overlayStats.innerHTML = statsHtml([
      [game.score, s.score],
      [bestScore, s.best],
      [`${game.dist}m`, s.altitude],
    ]);
  }
}

// High-DPI Canvas & Responsive Portal Fit
function fit() {
  const vw = window.innerWidth || W;
  const vh = window.innerHeight || H;
  const isCompact = vw <= 540;
  const pad = isCompact ? 0 : 20;
  const scale = isCompact
    ? Math.min(vw / W, vh / H)
    : clamp(Math.min((vw - pad) / W, (vh - pad) / H), 0.35, 2.2);

  dom.wrapper.style.width = `${Math.round(W * scale)}px`;
  dom.wrapper.style.height = `${Math.round(H * scale)}px`;

  dpr = clamp((window && window.devicePixelRatio) || 1, 1, 2.5);
  const targetW = Math.round(W * dpr);
  const targetH = Math.round(H * dpr);
  if (canvas.width !== targetW || canvas.height !== targetH) {
    canvas.width = targetW;
    canvas.height = targetH;
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  if (dom.fullscreenBtn) {
    const canFs = !!(document && (document.fullscreenEnabled || dom.wrapper.requestFullscreen));
    dom.fullscreenBtn.hidden = !canFs;
  }
}

function render() {
  drawGame(game);
  syncHud();
}

function resetControls() {
  input.left = false;
  input.right = false;
  input.pointerX = null;
  input.boost = false;
}

function startGame() {
  resetControls();
  totalRuns += 1;
  safeStorage.set('upjump-runs', totalRuns);
  game = createGame(MODES.PLAY);
  acc = 0;
  portal.gameplayStart();
  render();
  updateOverlay();
}

function openMenu() {
  resetControls();
  portal.gameplayStop();
  game = createGame(MODES.MENU);
  acc = 0;
  render();
  updateOverlay();
}

function primaryAction() {
  if (game.mode === MODES.MENU || game.mode === MODES.OVER) {
    startGame();
  } else if (game.mode === MODES.PAUSE) {
    game.mode = MODES.PLAY;
    acc = 0;
    portal.gameplayStart();
    updateOverlay();
    render();
  }
}

function togglePause() {
  if (game.mode === MODES.PLAY) {
    game.mode = MODES.PAUSE;
    resetControls();
    portal.gameplayStop();
  } else if (game.mode === MODES.PAUSE) {
    game.mode = MODES.PLAY;
    acc = 0;
    portal.gameplayStart();
  } else return;
  updateOverlay();
  render();
}

async function toggleFullscreen() {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else if (dom.wrapper.requestFullscreen) await dom.wrapper.requestFullscreen();
  } catch {}
}

function step(frames = 1) {
  for (let i = 0; i < frames; i++) updateGame(game);
  render();
}

function loop(ts) {
  if (!last) last = ts;
  const elapsed = Math.max(0, Math.min(100, ts - last));
  last = ts;
  ambientT += elapsed / STEP;

  if (game.mode === MODES.PLAY) {
    acc += elapsed;
    let steps = 0;
    while (acc >= STEP && steps < 6 && game.mode === MODES.PLAY) {
      updateGame(game);
      acc -= STEP;
      steps++;
    }
    if (steps === 6 && acc >= STEP) acc = STEP * 0.5;
  } else {
    acc = 0;
  }

  render();
  rafId = requestAnimationFrame(loop);
}

// Keyboard Controls (Arrows + WASD + Space/Shift/Up + M/P/Esc/F/R)
document.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { input.left = true; e.preventDefault(); }
  if (k === 'ArrowRight' || k === 'd' || k === 'D') { input.right = true; e.preventDefault(); }
  if (k === 'ArrowUp' || k === 'ArrowDown') e.preventDefault();

  if ((e.code === 'Space' || k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W' || k === 'Shift') && !e.repeat) {
    e.preventDefault();
    if (game.mode === MODES.PLAY) {
      unlockAudio();
      input.boost = true;
    } else if ((e.code === 'Space' || k === ' ') && (game.mode === MODES.MENU || (game.mode === MODES.OVER && Date.now() - lastDeathMs > 350))) {
      unlockAudio();
      primaryAction();
    }
  }
  if (k === 'Enter' && !e.repeat) {
    unlockAudio();
    primaryAction();
  }
  if ((k === 'p' || k === 'P' || k === 'Escape') && !e.repeat) togglePause();
  if ((k === 'm' || k === 'M') && !e.repeat) toggleSound();
  if ((k === 'f' || k === 'F') && !e.repeat) toggleFullscreen();
  if ((k === 'r' || k === 'R') && !e.repeat && (game.mode === MODES.OVER || game.mode === MODES.PAUSE)) {
    unlockAudio();
    startGame();
  }
});

document.addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') input.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') input.right = false;
});

// Pointer & Touch Steering
function setPointer(e) {
  const p = e.touches ? e.touches[0] : e;
  if (p) input.pointerX = p.clientX;
}

let steeringPointerId = null;
canvas.addEventListener('pointerdown', e => {
  if (game.mode !== MODES.PLAY || steeringPointerId !== null) return;
  unlockAudio();
  steeringPointerId = e.pointerId;
  setPointer(e);
  try { canvas.setPointerCapture(e.pointerId); } catch {}
});
canvas.addEventListener('pointermove', e => {
  if (steeringPointerId === e.pointerId && game.mode === MODES.PLAY) setPointer(e);
});
function endSteering(e) {
  if (steeringPointerId !== e.pointerId) return;
  steeringPointerId = null;
  input.pointerX = null;
  try { if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId); } catch {}
}
canvas.addEventListener('pointerup', endSteering);
canvas.addEventListener('pointercancel', endSteering);
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('touchstart', e => {
  if (game.mode === MODES.PLAY) { e.preventDefault(); unlockAudio(); setPointer(e); }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  if (game.mode === MODES.PLAY) { e.preventDefault(); setPointer(e); }
}, { passive: false });
canvas.addEventListener('touchend', () => { input.pointerX = null; }, { passive: true });
canvas.addEventListener('touchcancel', () => { input.pointerX = null; }, { passive: true });

// Auto-Pause on Tab Hidden / Focus Lost (Portal Requirement)
function onFocusLost() {
  if (game && game.mode === MODES.PLAY) togglePause();
  resetControls();
  steeringPointerId = null;
  suspendAudio();
}
window.addEventListener('blur', onFocusLost);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) onFocusLost();
});

// Touch Controls Binding
dom.novaBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  e.stopPropagation();
  unlockAudio();
  if (game.mode === MODES.PLAY && game.energy >= 100) input.boost = true;
});
dom.novaBtn.addEventListener('click', e => {
  e.preventDefault();
  e.stopPropagation();
  unlockAudio();
  if (game.mode === MODES.PLAY && game.energy >= 100) input.boost = true;
});

function bindMobileMove(button, direction) {
  let activePointer = null;
  button.addEventListener('pointerdown', e => {
    if (game.mode !== MODES.PLAY) return;
    e.preventDefault();
    e.stopPropagation();
    unlockAudio();
    activePointer = e.pointerId;
    input[direction] = true;
    button.classList.add('pressed');
    try { button.setPointerCapture(e.pointerId); } catch {}
  });
  const release = e => {
    if (activePointer !== e.pointerId) return;
    input[direction] = false;
    activePointer = null;
    button.classList.remove('pressed');
  };
  button.addEventListener('pointerup', release);
  button.addEventListener('pointercancel', release);
  button.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('blur', () => {
    input[direction] = false;
    activePointer = null;
    button.classList.remove('pressed');
  });
}
bindMobileMove(dom.mobileLeftBtn, 'left');
bindMobileMove(dom.mobileRightBtn, 'right');

// UI Buttons
dom.soundBtn.addEventListener('click', toggleSound);
if (dom.fullscreenBtn) dom.fullscreenBtn.addEventListener('click', toggleFullscreen);
dom.overlayMenuBtn.addEventListener('click', openMenu);
if (dom.overlayRestartBtn) dom.overlayRestartBtn.addEventListener('click', () => { unlockAudio(); startGame(); });
dom.playBtn.addEventListener('click', () => { unlockAudio(); primaryAction(); });
dom.pauseBtn.addEventListener('click', togglePause);
if (dom.langEnBtn) dom.langEnBtn.addEventListener('click', () => setLang('en'));
if (dom.langTrBtn) dom.langTrBtn.addEventListener('click', () => setLang('tr'));

window.addEventListener('resize', fit);
document.addEventListener('fullscreenchange', fit);

// QA & Telemetry Inspection Hook
window.render_game_to_text = () => JSON.stringify({
  mode: game.mode,
  lang,
  portal: portal.sdkName(),
  biome: getBiomeState(game.dist).name,
  coordinates: 'origin top-left; x right; y down; screenY = worldY - camY',
  player: {
    x: Math.round(game.player.x),
    y: Math.round(game.player.y),
    screenY: Math.round(game.player.y - game.camY),
    vx: +game.player.vx.toFixed(2),
    vy: +game.player.vy.toFixed(2),
    boost: game.player.boost,
    shield: game.player.shield,
  },
  hud: {
    score: game.score,
    best: bestScore,
    altitude: game.dist,
    combo: game.combo,
    energy: Math.round(game.energy),
    mission: `${missionText(game.mission)} (${game.mission.progress}/${game.mission.target})`,
  },
  platforms: game.platforms.filter(p => p.y - game.camY > -40 && p.y - game.camY < H + 40).slice(0, 12).map(p => ({
    type: p.type, x: Math.round(p.x), y: Math.round(p.y), screenY: Math.round(p.y - game.camY), solid: solid(p),
  })),
  pickups: game.stars.filter(s => s.y - game.camY > -40 && s.y - game.camY < H + 40).slice(0, 8).map(s => ({
    kind: s.kind, x: Math.round(s.x), y: Math.round(s.y), screenY: Math.round(s.y - game.camY),
  })),
  hazards: game.drones.filter(d => d.y - game.camY > -60 && d.y - game.camY < H + 40).slice(0, 6).map(d => ({
    x: Math.round(d.x), y: Math.round(d.y), screenY: Math.round(d.y - game.camY),
  })),
  overlay: {
    visible: dom.overlay.style.display !== 'none',
    title: dom.overlayTitle.textContent,
    button: dom.playBtn.textContent,
  },
});
window.advanceTime = ms => step(Math.max(1, Math.round(ms / STEP)));
window.startGame = startGame;

syncStaticLabels();
fit();
openMenu();
portal.loadingFinished();
rafId = requestAnimationFrame(loop);
</script>
</body>
