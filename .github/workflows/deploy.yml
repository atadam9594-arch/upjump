name: Deploy UpJump
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: upjump-cloudflare-production
  cancel-in-progress: true

jobs:
  production:
    name: Test and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate game and mobile controls
        run: node scripts/smoke.mjs

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing repository/org secret CF_API_TOKEN' >&2; exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing repository/org secret CF_ACCOUNT_ID' >&2; exit 1)

      - name: Deploy main to UpJump Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy public --project-name upjump --branch main
